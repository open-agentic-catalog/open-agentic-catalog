domains = ["identity.test"]
jwt_issuer = "https://identity.test:8447"
jwks_uri = "https://identity.test:8447/keys"
serving_cert_source "cert_file" {
    addr = ":8447"
    cert_file_path = "/tls/identity.pem"
    key_file_path = "/tls/identity-key.pem"
}
workload_api {
    socket_path = "/workload/api.sock"
    trust_domain = "workloads.test"
    poll_interval = "1s"
}
