server {
    bind_address = "0.0.0.0"
    bind_port = 8081
    trust_domain = "workloads.test"
    data_dir = "/state"
    jwt_key_type = "ec-p256"
    jwt_issuer = "https://identity.test:8447"
}
plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/state/datastore.sqlite3"
        }
    }
    KeyManager "disk" { plugin_data { keys_path = "/state/keys.json" } }
    NodeAttestor "join_token" { plugin_data {} }
}
