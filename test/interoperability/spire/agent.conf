agent {
    data_dir = "/state"
    server_address = "server"
    server_port = 8081
    trust_domain = "workloads.test"
    trust_bundle_path = "/bootstrap/bundle.pem"
    socket_path = "/workload/api.sock"
}
plugins {
    NodeAttestor "join_token" { plugin_data {} }
    KeyManager "disk" { plugin_data { directory = "/state" } }
    WorkloadAttestor "unix" { plugin_data {} }
}
