[package]
name = "catalog-rust-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
open-agentic-catalog = { path = "../../../../sdk/rust", version = "0.1.0" }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }
# Exercise a consumer that enables decompression in the shared dependency.
reqwest = { version = "0.13.5", default-features = false, features = ["gzip"] }
