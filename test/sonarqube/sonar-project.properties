sonar.projectKey=open-agentic-catalog
sonar.projectName=Open Agentic Catalog
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/test_*.py,**/tests/browser/**
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/test_*.py,**/tests/browser/**,internal/a2apb/**,catalog-ui/src/api/schema.d.ts,**/node_modules/**
sonar.typescript.tsconfigPaths=catalog-ui/tsconfig.json,catalog-ui/tsconfig.browser.json
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true
sonar.scanner.skipJreProvisioning=true
sonar.scanner.skipNodeProvisioning=true
sonar.working.directory=/tmp/sonar-work
