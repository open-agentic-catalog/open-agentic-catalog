sonar.projectKey=open-agentic-catalog
sonar.projectName=Open Agentic Catalog
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/test_*.py,**/tests/browser/**
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/test_*.py,**/tests/browser/**,internal/a2apb/**,catalog-ui/src/api/schema.d.ts,**/node_modules/**
sonar.typescript.tsconfigPaths=catalog-ui/tsconfig.json,catalog-ui/tsconfig.browser.json
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true
sonar.scanner.skipJreProvisioning=true
sonar.scanner.skipNodeProvisioning=true
sonar.working.directory=/tmp/sonar-work

# Ignore test secret, credential, and test container network binding rules under test directory
sonar.issue.ignore.multicriteria=ignoreTestPasswords,ignoreTestHardcodedSecrets,ignoreTestNetworkBinding
sonar.issue.ignore.multicriteria.ignoreTestPasswords.ruleKey=*S6698
sonar.issue.ignore.multicriteria.ignoreTestPasswords.resourceKey=test/**
sonar.issue.ignore.multicriteria.ignoreTestHardcodedSecrets.ruleKey=*S6418
sonar.issue.ignore.multicriteria.ignoreTestHardcodedSecrets.resourceKey=test/**
sonar.issue.ignore.multicriteria.ignoreTestNetworkBinding.ruleKey=*S8392
sonar.issue.ignore.multicriteria.ignoreTestNetworkBinding.resourceKey=test/**
