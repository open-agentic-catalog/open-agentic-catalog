apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-git
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog-git}
  template:
    metadata:
      labels: {app: catalog-git}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-repository
          image: local-git-fixture
          imagePullPolicy: Never
          command: [sh, -ec]
          args:
            - |
              # An interrupted init may leave a partial clone on this Pod's emptyDir.
              rm -rf /repository/catalog.git
              exec git clone --bare /source/catalog.bundle /repository/catalog.git
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources: &gitResources
            requests: {cpu: 10m, memory: 32Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 500m, memory: 128Mi, ephemeral-storage: 32Mi}
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: repository, mountPath: /repository}
      containers:
        - name: git
          image: local-git-fixture
          imagePullPolicy: Never
          command: [python3, -B, /source/git_server.py]
          readinessProbe:
            tcpSocket: {port: 8443}
          securityContext: *restricted
          resources: *gitResources
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: repository, mountPath: /repository, readOnly: true}
      volumes:
        - name: source
          configMap: {name: fixture-source}
        - name: tls
          secret: {secretName: catalog-git-tls}
        - name: repository
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-git
spec:
  selector: {app: catalog-git}
  ports:
    - {port: 8443}
