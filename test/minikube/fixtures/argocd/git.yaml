apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-git
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog-git}
  template:
    metadata:
      labels: {app: catalog-git}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: git
          image: local-git-fixture
          imagePullPolicy: Never
          command: [python3, -B, /source/git_server.py]
          readinessProbe:
            tcpSocket: {port: 8443}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: source
          configMap: {name: fixture-source}
        - name: tls
          secret: {secretName: catalog-git-tls}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-git
spec:
  selector: {app: catalog-git}
  ports:
    - {port: 8443}
