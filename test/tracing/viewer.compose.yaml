# Standalone local viewer, not a Catalog deployment or a production backend.
services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    command: ["--config", "/config/jaeger.yaml"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    ports:
      - "127.0.0.1:${TRACE_VIEWER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${TRACE_VIEWER_OTLP_PORT:-14318}:4318"
    volumes:
      - ./jaeger.yaml:/config/jaeger.yaml:ro
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
