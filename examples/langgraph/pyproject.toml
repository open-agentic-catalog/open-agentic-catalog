[project]
name = "catalog-langgraph-example"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = ["open-agentic-catalog", "langgraph==1.2.20", "langchain-ollama==1.1.0", "httpx==0.28.1"]

[dependency-groups]
dev = ["coverage==7.17.2", "packaging>=25,<27"]

[tool.uv]
required-version = "==0.13.7"
exclude-newer = "2026-11-09T12:11:09Z"
constraint-dependencies = ["certifi==2026.10.23"]
package = false

[tool.uv.sources]
open-agentic-catalog = { path = "../../sdk/python", editable = true }
