[project]
name = "catalog-langgraph-example"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = ["open-agentic-catalog", "langgraph==1.2.14", "langchain-ollama==1.1.0"]

[dependency-groups]
dev = ["coverage==7.16.2", "packaging>=25,<27"]

[tool.uv]
required-version = "==0.13.4"
exclude-newer = "2026-10-09T22:30:23Z"
exclude-newer-package = { certifi = "2026-10-20T02:24:16.604828Z" }
constraint-dependencies = ["certifi==2026.10.19"]
package = false

[tool.uv.sources]
open-agentic-catalog = { path = "../../sdk/python", editable = true }
