[package]
name = "catalog-rust-report"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Read-only Markdown inventory using the Catalog Rust SDK"
publish = false

[dependencies]
open-agentic-catalog = { path = "../../sdk/rust", version = "0.1.0" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
