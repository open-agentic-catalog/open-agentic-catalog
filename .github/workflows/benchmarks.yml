name: Runtime metrics microbenchmarks

# Report-only measurements; no timing threshold.
on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload selected reports only when the maintainer explicitly enables it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CATALOG_ENV_FILE: /dev/null
  DEV_PYTHON: python3.12
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: '0'
  GOTELEMETRY: 'off'
  ASTRO_TELEMETRY_DISABLED: '1'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  runtime-metrics:
    name: Go runtime metric collection and exposition
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the complete source history
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check service-free runner capacity and prerequisites
        run: python3.12 -B test/ci/tools.py preflight --profile unit
      - name: Install the existing Go and Python prerequisite profile
        run: python3.12 -B test/ci/tools.py install --profile unit
      - name: Install locked Python development tools
        run: make dev-tools-install
      - name: Record ten samples of each existing runtime benchmark
        id: measurement
        run: make bench
      - name: Reject unexpected source changes
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail
          git diff --quiet -- || { printf '%s\n' 'Unexpected unstaged source changes.' >&2; exit 1; }
          git diff --cached --quiet -- || { printf '%s\n' 'Unexpected staged source changes.' >&2; exit 1; }
          test -z "$(git ls-files --others --exclude-standard)" || { printf '%s\n' 'Unexpected non-ignored files.' >&2; exit 1; }
      - name: Summarize the report-only measurement boundary
        if: always() && steps.checkout.outcome == 'success'
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome || 'not_run' }}
          STATUS_AT_SUMMARY: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            printf 'Checkout: %s\nRunner: %s/%s\nStatus at summary: %s\nMeasurement: %s\n' "$SOURCE_COMMIT" "$RUNNER_OS" "$RUNNER_ARCH" "$STATUS_AT_SUMMARY" "$MEASUREMENT_OUTCOME"
            printf '%s\n' 'Scope: Go runtime metric collection and exposition; ten samples per benchmark.'
            printf '%s\n' 'The existing harness records source identity, Go settings, CPU, affinity, cgroup limits and complete finite samples.'
            printf '%s\n' 'No listener, database, container, deployed application, hosted endpoint or model is a benchmark target.'
            printf '%s\n' 'There is no timing threshold or comparison against an unrelated hosted run.'
            printf '%s\n' 'These microbenchmarks do not establish application latency, throughput, production capacity or an improvement.'
            printf '%s\n' 'Benchstat comparisons remain separately selected serial matched measurements on the same otherwise idle host.'
            printf '%s\n' 'Failed or cancelled measurements are incomplete; check the retained report status and final job result.'
          } > "$RUNNER_TEMP/ci-benchmark-summary.txt"
          cat "$RUNNER_TEMP/ci-benchmark-summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only benchmark reports and the public summary
        if: ${{ (always() && steps.checkout.outcome == 'success') && inputs.upload_artifacts && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: benchmarks-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/ci-benchmark-summary.txt
            coverage/performance/bench-*/report.json
          retention-days: 7
          if-no-files-found: warn
