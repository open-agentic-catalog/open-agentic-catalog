name: Manual website and PDF

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Maintainer explicitly enables Pages upload and deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CATALOG_ENV_FILE: /dev/null
  ASTRO_TELEMETRY_DISABLED: '1'
  NPM_CONFIG_AUDIT: 'false'
  GOTELEMETRY: 'off'
  DOCS_SITE: https://open-agentic-catalog.github.io
  DOCS_BASE: /open-agentic-catalog/
  DOCS_EDITION_COMMIT: ${{ github.sha }}
  DOCS_DELIVERY_OUTPUT: output/documentation-delivery/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prepare:
    outputs:
      hosted: ${{ steps.hosted.outputs.allowed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - id: hosted
        run: |
          if [[ -z "${ACT:-}" ]]; then printf 'allowed=true\n' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install documentation tools
        run: python3.12 -B test/ci/tools.py install --profile docs
      - run: make docs-install
      - run: make docs-check
      - run: make docs-site-check
        env:
          # Root/subpath tests are ordinary builds, not a public edition.
          DOCS_SITE: ''
          DOCS_EDITION_COMMIT: ''
      - name: Install the documentation-owned PDF browser
        run: |
          node documentation/node_modules/playwright/cli.js install-deps chromium
          make docs-pdf-browser-install
      - name: Prepare the final deployment base and complete PDF
        run: |
          make docs-build
          make docs-delivery
      - name: Upload only the prepared website edition
        if: ${{ !env.ACT && github.ref == 'refs/heads/main' && (inputs.deploy || (github.event_name == 'push' && vars.PAGES_ENABLED == 'true')) }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ${{ env.DOCS_DELIVERY_OUTPUT }}
          retention-days: 1
  deploy:
    needs: prepare
    if: ${{ needs.prepare.outputs.hosted == 'true' && github.ref == 'refs/heads/main' && (inputs.deploy || (github.event_name == 'push' && vars.PAGES_ENABLED == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      - name: Report delivered edition
        env:
          REVISION: ${{ github.sha }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: printf 'Manual source %s. Pages deployment %s.\n' "$REVISION" "$OUTCOME" >> "$GITHUB_STEP_SUMMARY"
