name: Extended coverage or source security

on:
  # The weekly event runs on the default branch and carries no inputs. It
  # selects only the source-security suite and never uploads reports.
  schedule:
    - cron: '17 4 * * 1'
  workflow_call:
    inputs:
      suite:
        type: string
        default: source-security
      upload_artifacts:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload selected reports only when the maintainer explicitly enables it
        type: boolean
        default: false
      suite:
        description: Select one extended boundary (security findings remain failures)
        type: choice
        required: true
        default: full-coverage
        options:
          - full-coverage
          - source-security

permissions:
  contents: read

concurrency:
  group: extended-${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || 'source-security' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CATALOG_ENV_FILE: /dev/null
  DEV_PYTHON: python3.12
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: '0'
  GOTELEMETRY: 'off'
  ASTRO_TELEMETRY_DISABLED: '1'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  extended:
    name: ${{ inputs.suite || 'source-security' }}
    if: ${{ github.event_name != 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SUITE: ${{ inputs.suite || 'source-security' }}
      EVENT_NAME: ${{ github.event_name }}
      REPORT_DIRECTORY: output/ci/${{ github.run_id }}-${{ github.run_attempt }}/extended/${{ inputs.suite || 'source-security' }}
    steps:
      - name: Check out the complete source history
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select fixed prerequisites and check runner capacity
        run: |
          set -euo pipefail
          case "$SUITE" in
            full-coverage) profile=coverage ;;
            source-security) profile=security ;;
            *) printf '%s\n' 'Unsupported fixed extended suite.' >&2; exit 2 ;;
          esac
          python3.12 -B test/ci/tools.py preflight --profile "$profile"
          printf 'CI_TOOL_PROFILE=%s\n' "$profile" >> "$GITHUB_ENV"
      - name: Install only the selected prerequisite profile
        run: python3.12 -B test/ci/tools.py install --profile "$CI_TOOL_PROFILE"
      - name: Install locked Python development tools
        run: make dev-tools-install
      - name: Regenerate all coverage constituents and enforce their union
        id: coverage
        if: env.SUITE == 'full-coverage'
        run: make coverage-full
      - name: Refresh the advisory database
        id: advisory
        if: env.SUITE == 'source-security'
        run: trivy image --download-db-only
      - name: Scan backend source, dependencies, secrets and configuration
        id: security
        if: env.SUITE == 'source-security'
        run: make security
      - name: Scan the complete UI lockfile
        id: ui_scan
        if: env.SUITE == 'source-security' && !cancelled() && steps.security.outcome != 'skipped'
        run: make ui-deps-check
      - name: Reject changes outside ignored check output
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail
          git diff --quiet -- || { printf '%s\n' 'Unexpected unstaged source changes.' >&2; exit 1; }
          git diff --cached --quiet -- || { printf '%s\n' 'Unexpected staged source changes.' >&2; exit 1; }
          test -z "$(git ls-files --others --exclude-standard)" || { printf '%s\n' 'Unexpected non-ignored files.' >&2; exit 1; }
      - name: Summarize coverage or security without exporting private diagnostics
        if: always() && steps.checkout.outcome == 'success'
        env:
          ADVISORY_OUTCOME: ${{ steps.advisory.outcome || 'not_run' }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome || 'not_run' }}
          SECURITY_OUTCOME: ${{ steps.security.outcome || 'not_run' }}
          UI_SCAN_OUTCOME: ${{ steps.ui_scan.outcome || 'not_run' }}
          STATUS_AT_SUMMARY: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIRECTORY"
          {
            printf 'Checkout: %s\nRef: %s\nEvent: %s\nSuite: %s\nRunner: %s/%s\nStatus at summary: %s\n' "$(git rev-parse HEAD)" "$GITHUB_REF" "$EVENT_NAME" "$SUITE" "$RUNNER_OS" "$RUNNER_ARCH" "$STATUS_AT_SUMMARY"
            printf 'Full coverage: %s\nAdvisory refresh: %s\nSource security: %s\nUI dependency scan: %s\n' "$COVERAGE_OUTCOME" "$ADVISORY_OUTCOME" "$SECURITY_OUTCOME" "$UI_SCAN_OUTCOME"
            if [ "$SUITE" = source-security ]; then
              if command -v trivy >/dev/null 2>&1; then
                printf 'Scanner and advisory database identity:\n'
                trivy version 2>/dev/null | sed 's/^/  /' || printf '  unavailable\n'
              else
                printf 'Scanner and advisory database identity: unavailable (scanner not installed)\n'
              fi
              printf '%s\n' 'A component with outcome not_run did not execute; the result is incomplete evidence.'
              printf '%s\n' 'UI lockfile scans use the Trivy-backed check only; no npm registry audit is submitted.'
              printf '%s\n' 'Source and UI scans retrieve advisory data themselves; they do not use the frozen exact-image snapshot.'
              printf '%s\n' 'Nested toolchains, peer images and published releases are not selected here.'
              if [ "$EVENT_NAME" = schedule ]; then
                printf '%s\n' 'Weekly run on the default branch. A delayed or disabled schedule leaves the last result stale; run this workflow manually with suite source-security.'
              fi
            fi
            printf '%s\n' 'Coverage-full owns fresh unit/local/PostgreSQL/process profiles and their deduplicated union.'
            printf '%s\n' 'A coverage result is not the sum of percentages or a combination of unrelated runs.'
            printf '%s\n' 'Known deferred advisories remain unsuppressed failures; this workflow never updates dependencies.'
            printf '%s\n' 'Exact-image scans belong to images.yml and its local Docker store.'
            printf '%s\n' 'Performance, mutation, formal, Minikube, peer deployment, model and installed-editor gates are not selected here.'
            printf '%s\n' 'A hosted run does not by itself close the deferred stable-clock qualification.'
            printf '%s\n' 'Forced cancellation can interrupt cleanup; cancelled work is incomplete.'
          } > "$REPORT_DIRECTORY/summary.txt"
          cat "$REPORT_DIRECTORY/summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only the public summary and full-coverage reports
        if: ${{ (always() && steps.checkout.outcome == 'success') && inputs.upload_artifacts && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: extended-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SUITE }}
          path: |
            ${{ env.REPORT_DIRECTORY }}/summary.txt
            coverage/full.out
            coverage/full.txt
          retention-days: 7
          if-no-files-found: warn
