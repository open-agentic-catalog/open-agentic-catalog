services:
  postgres:
    image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    environment:
      POSTGRES_DB: catalog_test
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_test"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: "no"

volumes:
  postgres-data:
