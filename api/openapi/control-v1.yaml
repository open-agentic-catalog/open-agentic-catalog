        data:
          type: object
          additionalProperties: false
          required: [supported, requested]
          description: Supported-version evidence for an unsupported modern protocol.
          properties:
            supported: {type: array, minItems: 2, maxItems: 2, items: {type: string, enum: ['2026-07-28', '2025-11-25']}}
            requested: {type: string, maxLength: 10}
