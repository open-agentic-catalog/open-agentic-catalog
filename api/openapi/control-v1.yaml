      type: object
      additionalProperties: false
      required: [resourceKinds, profiles, operations, governance, search, optionalCapabilities, limits, profileBundle, degradations]
      properties:
        resourceKinds:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/ResourceKind'}
        profiles:
          type: object
          additionalProperties: false
          required: [ard, aiCatalog, agent, mcp, skill, plugin]
          properties:
            ard: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
            aiCatalog: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
            agent: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
            mcp: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
            skill: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
            plugin: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
        operations:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
          description: Configured operations. Includes catalog.mcp.http only when the optional HTTP MCP route is enabled.
        governance:
          type: object
          additionalProperties: false
          required: [publicationAuthorization, publisherAuthority, legalRights, publisherDomainVerification]
          properties:
            publisherDomainVerification: {type: string, enum: [disabled, optional, required_for_approval], description: Startup DNS verification policy for new approvals.}
            publicationAuthorization: {type: string, const: administrator_approved}
            publisherAuthority: {type: string, const: not_assessed}
            legalRights: {type: string, const: not_assessed}
        search:
          type: object
          additionalProperties: false
          required: [tier, profile, semantic, degraded]
          properties:
            tier: {type: string, enum: [core, hybrid], description: Configured retrieval tier; individual responses report the tier actually used.}
            profile: {type: string, pattern: '^(core-lexical-v1|sha256:[a-f0-9]{64})$'}
            semantic: {$ref: '#/components/schemas/CapabilityState'}
            degraded: {type: boolean}
            providerState: {type: string, enum: [unknown, healthy, degraded], description: 'Last observed inference state of this API process, not a live provider probe or a cluster-wide health promise.'}
            indexing:
              type: object
              description: Current tenant control-index accounting, visible only to tenant administrators with tenant.admin when OAuth scopes are enforced. Counts exclude public snapshots; no provider request is made.
              additionalProperties: false
              required: [state, indexed, failed]
              properties:
                state: {type: string, enum: [pending, building, ready, failed]}
                jobId: {type: string, format: uuid}
                indexed: {type: integer, minimum: 0, maximum: 100000}
                failed: {type: integer, minimum: 0, maximum: 100000}
        optionalCapabilities:
          type: object
          additionalProperties: false
          required: [credentialResolution, managedMedia, softwareAssessment, webhooks, serviceActivity]
          properties:
            credentialResolution: {$ref: '#/components/schemas/CapabilityState'}
            managedMedia: {$ref: '#/components/schemas/CapabilityState'}
            softwareAssessment: {$ref: '#/components/schemas/CapabilityState'}
            serviceActivity: {type: string, enum: [disabled, enabled]}
            webhooks: {$ref: '#/components/schemas/CapabilityState'}
        limits:
          type: object
          additionalProperties: false
          required:
            - requestBodyBytes
            - validationMaxFindings
            - validationMaxDiagnosticBytes
            - catalogDocumentBytes
            - pluginDocumentBytes
            - pluginComponents
            - skillPackageBytes
            - skillPackageExpandedBytes
            - skillPackageFileBytes
            - skillPackageFiles
            - skillPackageDepth
            - skillPackageExpansionRatio
            - catalogPageSize
            - ardPageSize
            - liveFederationPageSize
            - publicationRecords
            - publicationProjectionBytes
            - publicationARDEntries
            - publicationAICatalogEntries
            - publicationExclusions
            - publicationArtifactReferences
            - publicationDocumentBytes
            - publicationSnapshotBytes
            - publicationWorkUnits
            - publicationConcurrentConstructions
          properties:
            requestBodyBytes: {type: integer, format: int64, minimum: 1}
            validationMaxFindings:
              type: integer
              minimum: 1
              maximum: 512
              description: "Maximum findings in each newly generated representation/revision/evidence array, including any exhaustion finding. Does not restrict retained evidence reads."
            validationMaxDiagnosticBytes:
              type: integer
              minimum: 1024
              maximum: 262144
              description: "Maximum JSON-encoded bytes in each newly generated findings array, including array syntax and escaping. Does not include representation documents or restrict retained evidence reads."
            catalogDocumentBytes: {type: integer, format: int64, minimum: 1, maximum: 16777216, description: Maximum combined exact content-document bytes in one VersionRevision. The HTTP request-body limit may be lower.}
            pluginDocumentBytes: {type: integer, minimum: 1, maximum: 500000}
            pluginComponents: {type: integer, minimum: 1, maximum: 128}
            skillPackageBytes: {type: integer, format: int64, const: 16777216, description: Maximum decoded transient ZIP or GZIP package bytes. Base64 and JSON overhead count toward requestBodyBytes.}
            skillPackageExpandedBytes: {type: integer, format: int64, const: 67108864, description: Maximum combined regular-file bytes produced during one bounded package inspection.}
            skillPackageFileBytes: {type: integer, format: int64, const: 16777216, description: Maximum expanded bytes for one regular package file.}
            skillPackageFiles: {type: integer, const: 1024, description: Maximum archive entries and maximum regular files in one package.}
            skillPackageDepth: {type: integer, const: 16, description: Maximum path segments below the Agent Skill root directory.}
            skillPackageExpansionRatio: {type: integer, const: 100, description: Maximum expanded-to-compressed byte ratio.}
            catalogPageSize: {type: integer, minimum: 1}
            ardPageSize: {type: integer, minimum: 1}
