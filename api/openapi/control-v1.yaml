        trustManifest:
          type: object
          additionalProperties: true
          required: [identity]
          properties:
            identity: {type: string}
          description: >-
            Optional unverified declaration from an eligible live peer. Either supported input spelling is emitted as lowercase
            trustManifest. Known members and declared publisher alignment are validated against the retained ARD profile;
            framework-specific members and exact JSON values are preserved. This is not proof of ownership, signature validity,
            current registration, software safety or execution permission. Evidence URLs are not fetched. The Search projection
            is not the original signed byte stream. Local publication results do not inherit peer trust declarations.
        displayName: {type: string}
        type: {type: string}
        url: {type: string, format: uri}
        data: {type: object, additionalProperties: true}
        representativeQueries: {type: array, items: {type: string}}
        capabilities: {type: array, items: {type: string}}
        description: {type: string}
        tags: {type: array, items: {type: string}}
        version: {type: string}
        updatedAt: {type: string, format: date-time}
        metadata:
          type: object
          additionalProperties: true
          description: Scalar declarations. Generated entries include nonempty Listing license text only when it fits 256 Unicode code points; longer declarations are omitted without truncation. A declaration does not prove legal rights.
        'http://purl.org/dc/terms/subject':
          type: array
          items: {type: string}
          description: Reviewed Listing category labels in generated entries, or locally interpreted literal topics in merged live results. Optional Dublin Core extension; not a required ARD core field, taxonomy or quality assessment.
        score: {type: integer, minimum: 0, maximum: 100}
        source:
          type: string
          format: uri
          description: Registry-reported result source. It is retained with separate configured-responder evidence, may have a different origin, and does not grant contact, trust, adoption, or referral authority.
