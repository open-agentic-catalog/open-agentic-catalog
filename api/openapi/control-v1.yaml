      content:
        application/json:
          schema: {$ref: '#/components/schemas/ARDManifest'}
    AICatalog:
      description: Active immutable AI Catalog snapshot.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        Content-Digest: {$ref: '#/components/headers/ContentDigest'}
        Last-Modified: {$ref: '#/components/headers/LastModified'}
        Link: {$ref: '#/components/headers/Link'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
      content:
        application/ai-catalog+json:
          schema: {$ref: '#/components/schemas/AICatalog'}
  schemas:
    CatalogDraftFile:
      type: object
      additionalProperties: false
      required: [format, kind, canonicalIdentifier, version, representations]
      description: >-
        Reusable authoring input for one Resource and one Version. File validity does not establish command readiness,
        approval or publication. Native text can contain incomplete documents. Destination IDs, credentials, receipts
        and governance evidence are not part of this format. Control integers use integer literals, without decimals or exponents.
        The encoded file limit is 64 MiB; client and deployment limits can be lower.
      properties:
        format: {type: string, enum: [open-agentic-catalog-draft-v1]}
        kind: {$ref: '#/components/schemas/ResourceKind'}
        canonicalIdentifier: {type: string, maxLength: 512}
        version: {type: string, maxLength: 128}
        representations:
          type: array
          minItems: 1
          maxItems: 16
          items: {$ref: '#/components/schemas/CatalogDraftRepresentation'}
        listing: {$ref: '#/components/schemas/CatalogDraftListing'}
    CatalogDraftRepresentation:
      type: object
      additionalProperties: false
      required: [role, mediaType, profileId, input]
      description: Preserve authored values. Kind, media type, profile and native document admission still use the normal validators.
      properties:
        role: {type: string, enum: [primary, distribution, metadata, documentation]}
        mediaType: {type: string, maxLength: 255}
        profileId: {type: string, maxLength: 160}
        input:
          oneOf:
            - {$ref: '#/components/schemas/CatalogDraftDocumentInput'}
            - {$ref: '#/components/schemas/CatalogDraftURLInput'}
            - {$ref: '#/components/schemas/CatalogDraftSkillPackageInput'}
            - {$ref: '#/components/schemas/CatalogDraftPluginArchiveInput'}
            - {$ref: '#/components/schemas/CatalogDraftPluginPreparationInput'}
    CatalogDraftDocumentInput:
      type: object
      additionalProperties: false
      required: [mode, text]
      description: UTF-8 document text, including unknown fields, exact numeric tokens and unfinished input. Save validates its declared format.
      properties:
        mode: {type: string, enum: [data, content]}
        text: {type: string, maxLength: 16777216}
    CatalogDraftURLInput:
      type: object
      additionalProperties: false
      required: [mode, url]
      description: An authored document reference. Empty or unfinished URLs remain editable; normal admission validates and retrieves them.
      properties:
        mode: {type: string, enum: [url]}
        url: {type: string, maxLength: 2048}
    CatalogDraftSkillPackageInput:
      type: object
      additionalProperties: false
      required: [mode, handoff]
      description: >-
        Package content must be supplied separately as an archive or through the CLI directory input.
        Handoff is editor JSON text for the existing immutable Git or OCI contract. It can be unfinished.
        This file contains neither archive bytes nor local filesystem directives.
      properties:
        mode: {type: string, enum: [skill-package]}
        handoff: {type: string, maxLength: 16384}
    CatalogDraftPluginArchiveInput:
      type: object
      additionalProperties: false
      required: [mode, url]
      description: >-
        Plugin archive reference. Stored exports set expectedDigest to the retained archive contentDigest.
        Unfinished authored URLs and checksums remain editable; Save requires a supported HTTPS archive and valid optional checksum.
      properties:
        mode: {type: string, enum: [plugin-archive]}
        url: {type: string, maxLength: 2048}
        expectedDigest: {type: string, maxLength: 71}
    CatalogDraftPluginPreparationInput:
      type: object
      additionalProperties: false
      required: [mode, manifest, mcp, skills]
      description: >-
        Editable Plugin preparation, not an archive. Inactive archive inputs are excluded.
        Import assigns fresh component IDs. Package construction and hosting remain separate actions.
      properties:
        mode: {type: string, enum: [plugin-preparation]}
        manifest: {type: string, maxLength: 16777216}
        mcp: {type: string, maxLength: 16777216}
        skills:
          type: array
          maxItems: 1024
          items: {type: string, maxLength: 16777216}
        sourceFiles:
          type: array
          maxItems: 1024
          items: {$ref: '#/components/schemas/CatalogDraftPluginSourceFile'}
    CatalogDraftPluginSourceFile:
      type: object
      additionalProperties: false
      required: [path, retained]
      description: Bounded package inventory using normalized relative Catalog archive paths. Paths never select local files or grant access to them.
      properties:
        path: {type: string, minLength: 1, maxLength: 1024}
        retained: {type: boolean}
    CatalogDraftListing:
      type: object
      additionalProperties: false
      required: [displayName, description, visibility]
      description: >-
        Editable Listing metadata without destination Publisher or Catalog IDs. Incomplete fields are allowed.
        Extensions remain opaque JSON text. Artwork contains author declarations only and must be validated and resealed at the destination.
      properties:
        displayName: {type: string, maxLength: 160}
        description: {type: string, maxLength: 4000}
        visibility: {$ref: '#/components/schemas/Visibility'}
        tags: {type: array, maxItems: 32, items: {type: string, maxLength: 80}}
        categories: {type: array, maxItems: 16, items: {type: string, maxLength: 80}}
        representativeQueries: {type: array, maxItems: 5, items: {type: string, maxLength: 240}}
        documentationUrl: {type: string, maxLength: 2048}
        supportUrl: {type: string, maxLength: 2048}
        termsUrl: {type: string, maxLength: 2048}
        license: {type: string, maxLength: 67108864}
        relationships:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/CatalogDraftRelationship'}
        extensions: {type: string, maxLength: 16777216}
        artwork: {$ref: '#/components/schemas/CatalogDraftArtwork'}
    CatalogDraftRelationship:
      type: object
      additionalProperties: false
      required: [type, targetIdentifier]
      description: An editable relationship row. Save checks supported types and resolves the exact destination target.
      properties:
        type: {type: string, maxLength: 80}
        targetIdentifier: {type: string, maxLength: 512}
        targetVersion: {type: string, maxLength: 128}
    CatalogDraftArtwork:
      type: object
      additionalProperties: false
      required: [schemaVersion]
      properties:
        schemaVersion: {type: integer, enum: [1]}
        icon: {$ref: '#/components/schemas/CatalogDraftArtworkAsset'}
        screenshots: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/CatalogDraftArtworkAsset'}}
    CatalogDraftArtworkAsset:
      type: object
      additionalProperties: false
      required: [url, alt]
      properties:
        url: {type: string, maxLength: 2048}
        alt: {type: string, maxLength: 256}
        caption: {type: string, maxLength: 512}
        rights: {$ref: '#/components/schemas/CatalogDraftArtworkRights'}
    CatalogDraftArtworkRights:
      type: object
      additionalProperties: false
      required: [basis, attribution]
      properties:
        basis: {type: string, maxLength: 80}
        attribution: {type: string, maxLength: 1024}
        reference: {type: string, maxLength: 2048}
    OverviewBoundedCount:
      type: object
      additionalProperties: false
      required: [value, limited]
      description: Exact count when limited is false. Otherwise value is 10000, a proven lower bound.
      properties:
        value: {type: integer, minimum: 0, maximum: 10000}
        limited: {type: boolean}
    OverviewKindCount:
      type: object
      additionalProperties: false
      required: [kind, count]
      properties:
        kind: {$ref: '#/components/schemas/ResourceKind'}
        count: {type: integer, minimum: 0, maximum: 10000}
    SourceStateCount:
      type: object
      additionalProperties: false
      required:
        - state
        - count
      properties:
        state:
          type: string
          enum:
            - active
            - paused
            - error
            - not_applicable
            - not_yet_synced
            - complete
            - incomplete
            - failed
        count:
          type: integer
          minimum: 0
          maximum: 10000
    SyncSummary:
      type: object
      additionalProperties: false
      required:
