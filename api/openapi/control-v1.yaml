        - {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
      responses:
        '200':
          description: Current non-cacheable private feedback.
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            ETag: {schema: {type: string}, description: Individual feedback revision when applicable.}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackPage'}
        default: {$ref: '#/components/responses/Problem'}
