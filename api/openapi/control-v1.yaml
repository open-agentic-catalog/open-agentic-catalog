      properties:
        identifier: {type: string}
        displayName: {type: string}
        type: {type: string}
        url: {type: string, format: uri}
        data: {}
        version: {type: string}
        description: {type: string}
        tags: {type: array, items: {type: string}}
        updatedAt: {type: string, format: date-time}
        extensions: {type: object, additionalProperties: true}
      oneOf:
        - required: [url]
        - required: [data]
    AICatalog:
      type: object
      additionalProperties: false
      required: [specVersion, host, entries]
      properties:
        specVersion: {type: string, pattern: '^[0-9]+\.[0-9]+$'}
        host:
          type: object
          additionalProperties: false
          required: [displayName]
          properties:
            displayName: {type: string}
            identifier: {type: string}
            documentationUrl: {type: string, format: uri}
        entries: {type: array, items: {$ref: '#/components/schemas/AICatalogEntry'}}
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, requestId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string}
        code: {$ref: '#/components/schemas/ErrorCode'}
        requestId: {type: string}
        errors: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Finding'}}
    ARDError:
      type: object
      required: [errorCode, message]
      properties:
        errorCode: {type: string, description: Stable Catalog error code carried in the ARD error shape; REQUEST_DEADLINE_EXCEEDED identifies the cooperative service work deadline.}
        message: {type: string}
    ErrorCode:
      type: string
      enum:
        - INVALID_ARGUMENT
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - PRECONDITION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - VERSION_SEALED
        - SEPARATION_OF_DUTIES
        - INVALID_TRANSITION
        - IDEMPOTENCY_KEY_REUSED
        - DEPENDENCY_UNAVAILABLE
        - WEBHOOK_TEST_BUSY
        - UNSUPPORTED_PROFILE
        - PUBLICATION_NOT_READY
        - SOURCE_POLICY_DENIED
        - AUDIT_EXPORT_RANGE_TOO_LARGE
        - WORK_LIMIT_EXCEEDED
        - REQUEST_DEADLINE_EXCEEDED
        - INTERNAL
    TrustAssessmentRequest:
      type: object
      additionalProperties: false
      required: [sourceRevision, identifier, versionPresent, mediaType, delivery, exactEntryDigest, reason]
      oneOf:
        - required: [observationId]
          not: {required: [text]}
        - required: [text]
          not: {required: [observationId]}
      allOf:
        - oneOf:
            - properties: {versionPresent: {const: true}}
              required: [version]
            - properties: {versionPresent: {const: false}}
              not: {required: [version]}
      properties:
        sourceRevision: {type: integer, format: int64, minimum: 1}
        identifier: {type: string, minLength: 1, maxLength: 4096, pattern: '^urn:air:'}
        version: {type: string, maxLength: 128}
        versionPresent: {type: boolean}
        mediaType: {type: string, minLength: 1, maxLength: 255}
        delivery: {type: string, enum: [url, data]}
        exactEntryDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        observationId: {$ref: '#/components/schemas/UUID'}
        text: {type: string, minLength: 1, maxLength: 500}
        reason: {type: string, minLength: 1, maxLength: 2000, pattern: '.*\S.*'}
    TrustCheck:
      type: object
      additionalProperties: false
      required: [state, code]
      properties:
        state: {type: string, enum: [valid, invalid, unavailable, unsupported, not_assessed]}
        code: {type: string, minLength: 1, maxLength: 100}
    TrustCryptographicResult:
      type: object
      additionalProperties: false
      required: [profile, policyDigest, entryDigest, checkedAt, receipt, producer, log, checkpoint, inclusion, target, status, currentRegistration]
      properties:
        profile: {type: string, const: ans-registration-v1}
        policyDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        entryDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        checkedAt: {type: string, format: date-time}
        validUntil: {type: string, format: date-time}
        receipt: {$ref: '#/components/schemas/TrustCheck'}
        producer: {$ref: '#/components/schemas/TrustCheck'}
        log: {$ref: '#/components/schemas/TrustCheck'}
        checkpoint: {$ref: '#/components/schemas/TrustCheck'}
        inclusion: {$ref: '#/components/schemas/TrustCheck'}
        target: {$ref: '#/components/schemas/TrustCheck'}
        status: {$ref: '#/components/schemas/TrustCheck'}
        currentRegistration: {type: boolean}
        schemaVersion: {type: string, maxLength: 100}
        eventType: {type: string, maxLength: 100}
        subject: {type: string, maxLength: 4096}
        logId: {type: string, maxLength: 128}
        registrationKeyFingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        logKeyFingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        envelopeLogKeyFingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
    TrustEvidenceBundle:
      type: object
      additionalProperties: false
      description: Exact original bytes as base64. Complete encoded bundle is at most 1048576 bytes; configured limits may be lower.
      required: [profile, entry, receipt, checkpoint, statusToken]
      properties:
        profile: {type: string, const: ans-registration-v1}
        entry: {type: string, contentEncoding: base64, maxLength: 349528}
        receipt: {type: string, contentEncoding: base64, maxLength: 349528}
        checkpoint: {type: string, contentEncoding: base64, maxLength: 43692}
        checkpointHistory: {type: string, contentEncoding: base64, maxLength: 349528}
        statusToken: {type: string, contentEncoding: base64, maxLength: 87384}
    TrustAssessment:
      type: object
      additionalProperties: false
      required: [sourceId, sourceRevision, policyName, policyDigest, authority, exactEntryDigest, mediaType, delivery, assessment, evidence, softwareTrust, artifactIntegrity, rights]
      properties:
        sourceId: {$ref: '#/components/schemas/UUID'}
        sourceRevision: {type: integer, format: int64, minimum: 1}
        policyName: {type: string, minLength: 1, maxLength: 63}
        policyDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        authority: {type: string, minLength: 1, maxLength: 253}
        exactEntryDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        mediaType: {type: string, maxLength: 255}
        delivery: {type: string, enum: [url, data]}
        assessment: {$ref: '#/components/schemas/TrustCryptographicResult'}
        evidence: {$ref: '#/components/schemas/TrustEvidenceBundle'}
        softwareTrust: {type: string, const: not_assessed}
        artifactIntegrity: {type: string, const: not_assessed}
        rights: {type: string, const: not_assessed}
    TrustAssessmentResponse:
      type: object
      additionalProperties: false
      required: [result, current, applicability]
      properties:
        result: {$ref: '#/components/schemas/TrustAssessment'}
        current: {type: boolean}
        applicability: {type: string, enum: [historical, negative_or_insufficient, expired, current]}
