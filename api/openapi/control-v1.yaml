openapi: 3.1.0
info:
  title: Open Agentic Catalog Control API
  version: 0.1.0
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  description: >-
    Governed authoring, review, publication, discovery, and federation for Agents, MCP Servers, Skills, and Plugins.
    Host-bound ARD Registry operations follow the separately pinned ARD profile.
    Control paths under /api/v1/ reject repeated Authorization, Content-Type, Idempotency-Key and If-Match
    field lines with 400 INVALID_ARGUMENT before authentication or command reservation, including case-variant
    names and identical repeated values. If-Match control commands require one current revision validator;
    this does not prohibit repetition of other list-valued HTTP fields.
servers:
  - url: http://127.0.0.1:8080
    description: Default local development service.
  - url: https://catalog.example.com
    description: Illustrative deployment; replace it with the target Catalog origin.
security:
  - bearerAuth: []
tags:
  - name: Catalog overview
    description: Private bounded counts for currently authorized Catalog workflows.
  - name: Personal workspace
    description: Human caller-owned work queues and private saved references or searches.
  - name: Catalog MCP
    description: Optional authenticated, read-only stateless MCP HTTP and public OAuth resource metadata.
  - name: Service
    description: Health, version, capabilities, metrics, and the served API contract.
  - name: Identity
    description: Catalog-owned tenant memberships and roles, namespaces, publishers, and administrator-approved publication domains. Publication approval is not external publisher-authority evidence.
  - name: Groups and members
    description: Direct group membership and lifecycle within one identity realm.
  - name: Roles
    description: Built-in and custom permission definitions and assignment impact.
  - name: Access assignments
    description: Explicit tenant or exact-namespace grants to members and groups.
  - name: My access
    description: Current self-context, permission descriptors and effective assignment paths.
  - name: Catalog lifecycle
    description: Governed Resources, immutable versions, listings, review, releases, and artifacts.
  - name: Catalog discovery
    description: Authenticated browse, Search, Explore, evidence, and audit operations.
  - name: Publication
    description: Immutable host- and audience-bound snapshot generation, activation, rollback, and unpublish.
  - name: Federation
    description: Source inspection, scoped onboarding, synchronization, observations, and bounded live queries.
  - name: Jobs
    description: Durable asynchronous work, cancellation, and attributable retry.
  - name: Ratings
    description: Human version-specific opinions, consented snapshot summaries and administrator moderation.
  - name: Feedback
    description: Private authenticated item feedback and administrator responses, separate from ratings and publication reviews.
  - name: Webhooks
    description: Optional signed CloudEvents endpoints, secret rotation, testing, and delivery history. These operations are registered only when optionalCapabilities.webhooks is enabled.
  - name: Discovery
    description: Exact-host anonymous or authenticated ARD and AI Catalog discovery backed by an active immutable audience snapshot.
paths:
  /api/v1/me/work:
    get:
      tags:
        - Personal workspace
      operationId: listPersonalWork
      summary: List my current authoring work
      description: 'Requires an active human membership. Current own-work attribution and per-field metadata/content/history
        permissions apply. OAuth scope when enforced: catalog.read. Responses are no-store. Cursors bind principal, filters
        and current policy. Resolve never makes a live request or substitutes a different release/source/generation.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalWorkPage'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - name: queue
          in: query
          schema:
            type: string
            enum:
              - drafts
              - submitted
              - changes_required
              - approved
            default: drafts
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
  /api/v1/personal/items:
    get:
      tags:
        - Personal workspace
      operationId: listPersonalItems
      summary: List my saved resources and searches
      description: 'Requires an active human membership. Requires library.own and exact tenant/realm/membership ownership; administrators
        cannot select another owner. Owner reads, rename and removal remain available after target access loss. OAuth scope
        when enforced: catalog.read. Responses are no-store. Cursors bind principal, filters and current policy. Resolve never
        makes a live request or substitutes a different release/source/generation.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalPage'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              - resource
              - search
        - name: label
          in: query
          description: 'Optional literal case-sensitive match of the complete saved label. Surrounding spaces and Unicode spelling
            are significant; wildcard characters are literal. Labels need not be unique. Omission leaves labels unrestricted;
            an empty, whitespace-only or control-containing value is invalid. Filtering precedes page limits and is bound into
            continuation with type and current owner authority.'
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
    post:
      tags:
        - Personal workspace
      operationId: createPersonalItem
      summary: Save a resource or named search
      description: 'Requires an active human membership. Requires library.own and exact tenant/realm/membership ownership; administrators
        cannot select another owner. Owner reads, rename and removal remain available after target access loss. OAuth scope
        when enforced: personal.write. Responses are no-store. Mutations require Idempotency-Key; updates and removals also
        require If-Match. Required audit contains identity/revision only; no public notification is created. At most 200 items
        per owner, labels up to 120 characters, bodies up to 16 KiB.'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalReceipt'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              $ref: '#/components/headers/ETag'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalInput'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
  /api/v1/personal/items/{itemId}:
    get:
      tags:
        - Personal workspace
      operationId: getPersonalItem
      summary: Read my saved item
      description: 'Requires an active human membership. Requires library.own and exact tenant/realm/membership ownership; administrators
        cannot select another owner. Owner reads, rename and removal remain available after target access loss. OAuth scope
        when enforced: catalog.read. Responses are no-store. Cursors bind principal, filters and current policy. Resolve never
        makes a live request or substitutes a different release/source/generation.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalItem'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
    patch:
      tags:
        - Personal workspace
      operationId: updatePersonalItem
      summary: Update my saved item
      description: 'Requires an active human membership. Requires library.own and exact tenant/realm/membership ownership; administrators
        cannot select another owner. Owner reads, rename and removal remain available after target access loss. OAuth scope
        when enforced: personal.write. Responses are no-store. Mutations require Idempotency-Key; updates and removals also
        require If-Match. Required audit contains identity/revision only; no public notification is created. At most 200 items
        per owner, labels up to 120 characters, bodies up to 16 KiB.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalReceipt'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              $ref: '#/components/headers/ETag'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalInput'
    delete:
      tags:
        - Personal workspace
      operationId: deletePersonalItem
      summary: Remove my saved item
      description: 'Requires an active human membership. Requires library.own and exact tenant/realm/membership ownership; administrators
        cannot select another owner. Owner reads, rename and removal remain available after target access loss. OAuth scope
        when enforced: personal.write. Responses are no-store. Mutations require Idempotency-Key; updates and removals also
        require If-Match. Required audit contains identity/revision only; no public notification is created. At most 200 items
        per owner, labels up to 120 characters, bodies up to 16 KiB.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalReceipt'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              $ref: '#/components/headers/ETag'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
  /api/v1/personal/items/{itemId}/resolve:
    post:
      tags:
        - Personal workspace
      operationId: resolvePersonalItem
      summary: Resolve an exact saved resource without live discovery
      description: 'Requires an active human membership. Requires library.own and exact tenant/realm/membership ownership; administrators
        cannot select another owner. Owner reads, rename and removal remain available after target access loss. OAuth scope
        when enforced: catalog.read. Responses are no-store. Cursors bind principal, filters and current policy. Resolve never
        makes a live request or substitutes a different release/source/generation.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalResolution'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
  /api/v1/tenant-settings:
    get:
      tags: [Identity]
      operationId: getTenantSettings
      summary: Read the current tenant's operational settings
      description: >-
        Requires tenant settings.read and tenant.admin OAuth scope when enforced.
        Returns saved overrides, this API process's deployment defaults and the resolved policy.
        An absent record has revision zero, empty overrides and a usable strong ETag.
        Deployment defaults must be consistent across API and worker processes.
      responses:
        '200':
          description: Current private tenant policy; this does not read worker configuration.
          headers:
            ETag: {schema: {type: string}, description: "Exact opaque settings validator, including deployment defaults."}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantSettings'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Identity]
      operationId: setTenantSettings
      summary: Replace the current tenant's operational overrides
      description: >-
        Requires tenant settings.manage and settings.read, with tenant.admin OAuth scope when enforced.
        Omitted override fields inherit deployment defaults. An empty overrides object resets all fields.
        Explicit false pauses new automatic source admissions; retained Jobs and manual sync continue.
        Saves and resets are audited atomically. Exact replay returns the original receipt; read current settings separately.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          description: Exact settings ETag from GET, including before the first save. Wildcards and validator lists are not accepted.
          schema: {type: string, pattern: '^"settings-[0-9a-f]{64}"$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [overrides, reason]
              properties:
                overrides: {$ref: '#/components/schemas/TenantSettingsOverrides'}
                reason: {type: string, minLength: 1, maxLength: 2000, pattern: '.*\S.*'}
      responses:
        '200':
          description: Audited command receipt. Read current settings separately after replay.
          headers:
            ETag: {schema: {type: string}, description: Exact opaque settings validator.}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantSettings'}
        default: {$ref: '#/components/responses/Problem'}
  /mcp:
    post:
      tags: [Catalog MCP]
      operationId: callCatalogMCP
      summary: Read Catalog metadata through stateless MCP
      description: >-
        Available only when mcp.enabled is true. Supports 2026-07-28 per-request metadata
        and the 2025-11-25 legacy handshake. No sessions, GET stream, execution or mutations.
        All calls require current Catalog membership. Resource tools require catalog.read when
        OAuth scope enforcement is enabled; protocol discovery, tool listing, capabilities and
        self-access do not. Catalog permissions still apply inside each read.
        Headers must agree with the validated JSON-RPC operation. Duplicate security headers,
        batches, duplicate JSON keys, invalid Unicode, unsupported methods and over-limit input fail.
        Bodies have the tighter API limit or 262144 bytes; tool arguments have a 65536-byte limit.
        A full concurrency gate returns 503 without queuing. Responses are finite JSON and no-store.
        Tool failures use isError inside a protocol result; OAuth scope denial is HTTP 403.
      parameters:
        - {name: MCP-Protocol-Version, in: header, required: false, schema: {type: string}, description: 'Required except for legacy initialize. Supported versions are 2026-07-28 and 2025-11-25.'}
        - {name: MCP-Method, in: header, required: false, schema: {type: string}, description: Required matching method for the modern protocol.}
        - {name: MCP-Name, in: header, required: false, schema: {type: string}, description: Required matching tool name for modern tools/call.}
        - {name: Origin, in: header, required: false, schema: {type: string}, description: If present must exactly match the public origin or an explicit MCP allowed origin.}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MCPRequest'}
      responses:
        '200': {$ref: '#/components/responses/MCPReply'}
        '202': {description: Accepted legacy initialized notification; empty body and no session ID.}
        '400': {$ref: '#/components/responses/MCPError'}
        '401': {$ref: '#/components/responses/MCPError'}
        '403': {$ref: '#/components/responses/MCPError'}
        '404': {$ref: '#/components/responses/MCPError'}
        '413': {$ref: '#/components/responses/MCPError'}
        '415': {$ref: '#/components/responses/MCPError'}
        '500': {$ref: '#/components/responses/MCPError'}
        '503': {$ref: '#/components/responses/MCPError'}
    options:
      tags: [Catalog MCP]
      operationId: preflightCatalogMCP
      security: []
      summary: Check an exact MCP browser origin
      description: Requires an approved Origin, POST request method and an admitted header set. Disabled routes return 404. Does not enable cookie authentication or global API CORS.
      responses:
        '204': {description: Approved credential-free preflight.}
        '400': {$ref: '#/components/responses/MCPError'}
        '403': {$ref: '#/components/responses/MCPError'}
        '404': {$ref: '#/components/responses/Problem'}
    get:
      tags: [Catalog MCP]
      operationId: refuseCatalogMCPStream
      security: []
      summary: Refuse a standalone MCP stream
      responses:
        '405': {$ref: '#/components/responses/MCPError'}
        '403': {$ref: '#/components/responses/MCPError'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Catalog MCP]
      operationId: refuseCatalogMCPSessionDeletion
      security: []
      summary: Refuse deletion because MCP has no retained sessions
      responses:
        '405': {$ref: '#/components/responses/MCPError'}
        '400': {$ref: '#/components/responses/MCPError'}
        '403': {$ref: '#/components/responses/MCPError'}
        '404': {$ref: '#/components/responses/Problem'}
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags: [Catalog MCP]
      operationId: getCatalogMCPOAuthMetadata
      security: []
      summary: Discover the configured MCP OAuth resource and issuer
      description: Available only when MCP is enabled and authentication uses OIDC. URLs come from configuration, never Host or forwarding headers. Development mode and disabled MCP return 404.
      responses:
        '200':
          description: RFC 9728 protected resource metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPOAuthMetadata'}
        '400': {$ref: '#/components/responses/MCPError'}
        '403': {$ref: '#/components/responses/MCPError'}
        '404': {$ref: '#/components/responses/MCPError'}
    head:
      tags: [Catalog MCP]
      operationId: headCatalogMCPOAuthMetadata
      security: []
      summary: Check MCP OAuth metadata availability
      responses:
        '200': {description: Metadata is available; empty body.}
        '403': {$ref: '#/components/responses/MCPError'}
        '404': {$ref: '#/components/responses/MCPError'}
    options:
      tags: [Catalog MCP]
      operationId: preflightCatalogMCPOAuthMetadata
      security: []
      summary: Check an exact metadata browser origin
      responses:
        '204': {description: Approved credential-free metadata preflight for GET or HEAD.}
        '400': {$ref: '#/components/responses/MCPError'}
        '403': {$ref: '#/components/responses/MCPError'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/ratings/read:
    post:
      tags:
        - Ratings
      summary: Read the current rating summary and your opinion
      operationId: readRating
      description: 'Human opinions use exact version and source-generation identity. They do not change relevance, trust or publication approval. Own
        rating submission requires an active human and current target visibility. Retained own-list reads and withdrawal remain available after target visibility loss. Administrator actions cannot
        choose a score. This read-only POST does not require Idempotency-Key. OAuth scope when enforced: catalog.read.'
      responses:
        '200':
          description: Current non-cacheable rating data.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingView'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
  /api/v1/ratings:
    post:
      tags:
        - Ratings
      summary: Submit or replace your score
      operationId: submitRating
      description: 'Human opinions use exact version and source-generation identity. They do not change relevance, trust or publication approval. Own
        rating submission requires an active human and current target visibility. Retained own-list reads and withdrawal remain available after target visibility loss. Administrator actions cannot
        choose a score.  OAuth scope when enforced: ratings.write.'
      responses:
        '200':
          description: Command receipt. Read current state separately.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingReceipt'
        '201':
          description: Command receipt. Read current state separately.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingReceipt'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: Required when an own rating or sharing choice already exists. Use its current ETag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingSubmit'
    get:
      tags:
        - Ratings
      summary: List your own opinions
      operationId: listOwnRatings
      description: 'Human opinions use exact version and source-generation identity. They do not change relevance, trust or publication approval. Own
        rating submission requires an active human and current target visibility. Retained own-list reads and withdrawal remain available after target visibility loss. Administrator actions cannot
        choose a score.  OAuth scope when enforced: catalog.read.'
      responses:
        '200':
          description: Current non-cacheable rating data.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          schema:
            type: string
            enum:
              - active
              - withdrawn
              - removed
  /api/v1/ratings/inbox:
    get:
      tags:
        - Ratings
      summary: List opinions for moderation
      operationId: listRatingInbox
      description: 'Human opinions use exact version and source-generation identity. They do not change relevance, trust or publication approval. Own
        rating submission requires an active human and current target visibility. Retained own-list reads and withdrawal remain available after target visibility loss. Administrator actions cannot
        choose a score.  OAuth scope when enforced: tenant.admin.'
      responses:
        '200':
          description: Current non-cacheable rating data.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          schema:
            type: string
            enum:
              - active
              - withdrawn
              - removed
  /api/v1/ratings/{ratingId}:
    get:
      tags:
        - Ratings
      summary: Read your opinion or a moderated opinion
      operationId: getRating
      description: 'Human opinions use exact version and source-generation identity. They do not change relevance, trust or publication approval. Own
        rating submission requires an active human and current target visibility. Retained own-list reads and withdrawal remain available after target visibility loss. Administrator actions cannot
        choose a score.  OAuth scope when enforced: catalog.read.'
      responses:
        '200':
          description: Current non-cacheable rating data.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - name: ratingId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
  /api/v1/ratings/{ratingId}:withdraw:
    post:
      tags:
        - Ratings
      summary: Withdraw an opinion
      operationId: withdrawRating
      description: 'Human opinions use exact version and source-generation identity. They do not change relevance, trust or publication approval. Own
        rating submission requires an active human and current target visibility. Retained own-list reads and withdrawal remain available after target visibility loss. Administrator actions cannot
        choose a score.  OAuth scope when enforced: ratings.write.'
      responses:
        '200':
          description: Command receipt. Read current state separately.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingReceipt'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - name: ratingId
          in: path
          required: true
          schema:
