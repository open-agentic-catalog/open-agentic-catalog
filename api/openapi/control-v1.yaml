        revision: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PublisherDomainVerification:
      type: object
      additionalProperties: false
      required: [domain, mode, state, challengeState]
      properties:
        domain: {type: string, format: hostname, minLength: 1, maxLength: 221}
        mode: {type: string, enum: [disabled, optional, required_for_approval]}
        state: {type: string, enum: [not_verified, verified, expired], description: "Current proof freshness under the deployment policy, independent of publication approval."}
        challengeState: {type: string, enum: [not_issued, pending, expired, consumed]}
        challengeId: {type: string, format: uuid}
        challengeIssuedAt: {type: string, format: date-time}
        challengeExpiresAt: {type: string, format: date-time}
        verifiedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: Earlier of recorded proof expiry and the current proof-age limit.}
        lastCheckAt: {type: string, format: date-time}
        lastCheckOutcome: {type: string, enum: [matched, mismatch, not_found, unavailable, response_limit], description: Outcome of the last completed lookup. A failed renewal does not erase an earlier valid proof.}
        lastCheckChallengeId: {type: string, format: uuid}
    PublisherDomainChallenge:
