        principalType: {type: string, enum: [catalog_membership, service_executor, database_login]}
        actorType: {type: string, enum: [human, service]}
        realmId: {$ref: '#/components/schemas/UUID'}
        authorizationDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        commandId: {$ref: '#/components/schemas/UUID'}
        currentUser: {type: string, minLength: 1, maxLength: 512}
        operatorLabel: {type: string, minLength: 1, maxLength: 512}
        facts: {type: object, maxProperties: 64, additionalProperties: true, description: Bounded action-specific evidence under the service-owned record validator.}
      oneOf:
        - properties: {principalType: {const: catalog_membership}}
          required: [actorType, realmId]
          not: {anyOf: [{required: [currentUser]}, {required: [operatorLabel]}]}
        - properties: {principalType: {const: service_executor}}
          not: {anyOf: [{required: [actorType]}, {required: [realmId]}, {required: [currentUser]}, {required: [operatorLabel]}]}
        - properties: {principalType: {const: database_login}}
          required: [currentUser]
          not: {anyOf: [{required: [actorType]}, {required: [realmId]}, {required: [authorizationDigest]}, {required: [commandId]}]}
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AuditEvent'}}
        nextCursor: {type: string, maxLength: 2048}
    AuditExportRequest:
      type: object
      additionalProperties: false
      required: [occurredFrom, occurredBefore, reason]
      properties:
        actor: {type: string, minLength: 1, maxLength: 512}
