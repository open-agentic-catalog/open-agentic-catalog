        value: {type: string, pattern: '^open-agentic-catalog-verification=[A-Za-z0-9_-]{43}$', maxLength: 77, description: Exact current TXT value. Returned only with management authority for a usable pending challenge.}
        expiresAt: {type: string, format: date-time}
    Publisher:
      type: object
