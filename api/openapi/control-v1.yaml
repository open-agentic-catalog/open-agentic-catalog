  /livez:
    get:
      tags: [Service]
      summary: Check process liveness
      operationId: getLiveness
      description: Returns process liveness without contacting PostgreSQL or optional providers. Use readiness, not this endpoint, to decide whether the API can accept work.
      security: []
      responses:
        '200': {$ref: '#/components/responses/Status'}
  /readyz:
    get:
      tags: [Service]
      summary: Check dependency readiness
      operationId: getReadiness
      description: Returns readiness after startup and required database checks. The API becomes unready during drain or when its required PostgreSQL connection is unavailable or read-only.
      security: []
      responses:
        '200': {$ref: '#/components/responses/Status'}
        '503': {$ref: '#/components/responses/Problem'}
  /version:
    get:
      tags: [Service]
      summary: Get service and profile versions
      operationId: getVersion
      description: Returns build metadata and the pinned standards profiles supported by this process. This public response contains no deployment credentials.
      security: []
      responses:
        '200': {$ref: '#/components/responses/ServiceVersion'}
  /api/v1/service-activity:
    get:
      tags: [Service]
      summary: Get request statistics for the responding API process
      operationId: getServiceActivity
      description: >-
        Requires current active membership and tenant-wide access.manage permission.
        When OAuth scope enforcement is enabled, GET and implicit HEAD require tenant.admin.
        The route is disabled by default. Enable http.serviceActivityEnabled to permit
        aggregate traffic disclosure across tenants to current administrators.
        Returns only bounded process-memory counters, with no tenant, user, resource or query identifiers.
        A later request can reach another replica. Counters reset on process restart.
        Accepts no query parameters or request body. This read creates no audit or outbox event.
        Catalog work excludes probes, metrics and activity polling. Search and MCP outcomes overlap HTTP counts.
      responses:
        '200':
          description: One bounded sample from the responding process. At most 64 KiB.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceActivity'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/service-information:
    get:
      tags: [Service]
      summary: Get the responding process's build and startup information
      operationId: getServiceInformation
      description: >-
        Requires authentication; no additional role or OAuth scope is required.
        Returns build and process timing together. The handler reads only process memory; authentication still applies.
        The instanceId identifies one execution, including when tracing is disabled.
        A later read may reach another replica. This is not a node inventory, health report or deployment history.
        Uptime uses monotonic elapsed time; UTC wall-clock timestamps can change after a clock correction.
      responses:
        '200':
          description: Current process information. Not cached.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceInformation'}
        default: {$ref: '#/components/responses/Problem'}
  /metrics:
    get:
      tags: [Service]
      summary: Get Prometheus metrics
      description: Returns deterministic size-bounded process-local metrics with fixed low-cardinality labels. PostgreSQL-backed API processes include safe client-pool and statement-class signals but never worker-global tenant aggregates.
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema: {type: string}
  /openapi/control-v1.yaml:
    get:
      tags: [Service]
      summary: Download the Control API contract
      operationId: getControlOpenAPI
      description: Returns the exact OpenAPI YAML embedded in this build, with its ETag and content digest. Send the exact returned ETag in If-None-Match to receive 304 while the contract is unchanged.
      security: []
      parameters:
        - {$ref: '#/components/parameters/IfNoneMatch'}
      responses:
        '200':
          description: The service OpenAPI contract.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Content-Digest: {$ref: '#/components/headers/ContentDigest'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/yaml:
              schema: {type: string}
        '304':
          description: The embedded contract matches the supplied ETag; no response body is sent.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Content-Digest: {$ref: '#/components/headers/ContentDigest'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
  /api/v1/capabilities:
    get:
      tags: [Service]
      summary: Get current Catalog capability state
      operationId: getCapabilities
      description: Returns implemented limits, standards profiles, optional capability states and validation capabilities. A disabled capability is not made available by client requests.
      responses:
        '200': {$ref: '#/components/responses/Capabilities'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me:
    get:
      tags: [Identity, My access]
      summary: Get current resolved Catalog access
      description: >-
        Requires an active authenticated member, but no product role or OAuth scope.
        Current tenant permissions, bounded any-scope navigation hints and a paged
        exact-namespace permission projection use one policy snapshot. The cursor
        binds current authorization. No raw token claims or complete grant graph are returned.
      operationId: getCurrentAccess
      parameters:
        - name: namespaceId
          in: query
          description: Return only the caller's grant for this namespace. An absent grant returns an empty list without disclosing namespace existence.
          schema: {$ref: '#/components/schemas/UUID'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Current caller and bounded namespace access.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentAccess'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/memberships:
    get:
      tags: [Identity]
      summary: List Catalog-owned memberships for the authenticated tenant
      operationId: listMemberships
      description: >-
        Returns a cursor-paginated tenant membership page. Optional exact subject, state, actorType and same-tenant realmId filters intersect with AND before selection. Subjects remain
        case-sensitive. Cursors bind filters, current authority and page size.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: subject, in: query, schema: {type: string, minLength: 1, maxLength: 512}}
        - {name: state, in: query, schema: {type: string, enum: [active, suspended, offboarded]}}
        - {name: actorType, in: query, schema: {$ref: '#/components/schemas/ActorType'}}
        - {name: realmId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
      responses:
        '200': {$ref: '#/components/responses/MembershipPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/memberships/{membershipId}:
    parameters: [{$ref: '#/components/parameters/MembershipId'}]
    get:
      tags: [Identity]
      summary: Get one Catalog-owned membership
      operationId: getMembership
      description: Returns one membership in the authenticated tenant, including its retained lifecycle state and revision.
      responses:
        '200': {$ref: '#/components/responses/Membership'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/memberships/{membershipId}/access:
    parameters: [{$ref: '#/components/parameters/MembershipId'}]
    get:
      tags: [Identity]
      summary: Inspect a member's direct and group assignment contributions
      operationId: getMembershipAccess
      description: >-
        Requires current access.manage and tenant.admin when OAuth scopes are enforced. Returns retained direct paths and current-realm group paths with exact role permissions and
        lifecycle eligibility. Other-realm group coverage is unavailable. Pages are partial inventories, not complete permission unions, distinct-user counts or recipient OAuth decisions.
        Each group path reports its active relation or most recent revoked relation. The cursor binds the inspected membership, current actor, policy revision and page size. Restart after
        policy changes.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Bounded current member contributions.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberAccessPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/memberships/{membershipId}:suspend:
    parameters: [{$ref: '#/components/parameters/MembershipId'}]
    post:
      tags: [Identity]
      summary: Suspend an active membership without deleting its retained grants
      operationId: suspendMembership
      description: Makes the membership inactive while preserving its grants and history. Requires the current membership revision and a reason; the final active tenant administrator cannot be suspended.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '200': {$ref: '#/components/responses/MembershipLifecycle'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/memberships/{membershipId}:reactivate:
    parameters: [{$ref: '#/components/parameters/MembershipId'}]
    post:
      tags: [Identity]
      summary: Reactivate a suspended membership in an active identity realm
      operationId: reactivateMembership
      description: Restores a suspended membership only while its identity realm is active. Requires the current membership revision and a reason; permanently offboarded memberships cannot be reactivated.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '200': {$ref: '#/components/responses/MembershipLifecycle'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/memberships/{membershipId}:offboard:
    parameters: [{$ref: '#/components/parameters/MembershipId'}]
    post:
      tags: [Identity]
      summary: Permanently offboard a membership and atomically revoke its active grants
      operationId: offboardMembership
      description: Ends the membership permanently and revokes its active role and namespace grants atomically. Requires the current revision and a reason, and preserves the final active tenant administrator.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '200': {$ref: '#/components/responses/MembershipLifecycle'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/role-assignments:
    get:
      tags: [Identity]
      summary: List tenant role assignments
      operationId: listRoleAssignments
      description: Returns a cursor-paginated projection of direct assignments to the eight exact CatalogRole built-in templates, regardless of which assignment API created them. Includes
        active and revoked tenant and namespace grants across the current tenant's realms. Custom roles, group targets and other templates are excluded before paging. Use
        membershipId to restrict the page to one membership.
      parameters:
        - {name: membershipId, in: query, description: Restrict the bounded page to one existing membership in the current tenant., schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/RoleAssignmentPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Identity]
      summary: Grant a Catalog-owned tenant or namespace role in the caller's identity realm
      operationId: grantRoleAssignment
      description: Grants a role in the authenticated tenant and identity realm, optionally scoped to one namespace. Authorization, separation of duties and the supplied audit reason are checked before the grant is committed.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/GrantRole'}
      responses:
        '201': {$ref: '#/components/responses/RoleAssignmentCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/role-assignments/{assignmentId}:revoke:
    parameters: [{$ref: '#/components/parameters/RoleAssignmentId'}]
    post:
      tags: [Identity]
      summary: Revoke a Catalog-owned role assignment
      description: Revoke an eligible direct assignment to an exact CatalogRole built-in template in the caller's identity realm, using its current ETag and an audit reason. Unsupported
        custom, group and other-template targets and assignments in another realm return NOT_FOUND without mutation; use the general access-assignment API for other supported
        targets in the caller's realm. Final-administrator protection counts active direct tenant administrators across the tenant, not separately per realm.
      operationId: revokeRoleAssignment
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '200': {$ref: '#/components/responses/RoleAssignmentUpdated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/namespaces:
    get:
      tags: [Identity]
      summary: List visible namespaces
      operationId: listNamespaces
      description: >-
        Returns a cursor-paginated page selected by current namespace.read permission before ordering and limits. Optional exact slug and displayName filters are intersected before
        limits. Slugs are trimmed and lowercased; display names preserve exact case and spacing. Duplicate names remain distinct by ID. A policy or filter change invalidates
        continuation; an active caller without namespace grants receives an empty page.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: slug
          in: query
          description: Exact namespace slug. Trimmed and lowercased using the same rules as creation.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[\\x09-\\x0d\\x20\\x85\\xa0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*\
              [A-Za-z0-9\u0130\u212a](?:[A-Za-z0-9\u0130\u212a-]*[A-Za-z0-9\u0130\u212a])?\
              [\\x09-\\x0d\\x20\\x85\\xa0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*$"
        - name: displayName
          in: query
          description: Exact stored display name, including case and spacing. Names are not unique.
          schema:
            type: string
            minLength: 1
            maxLength: 160
            pattern: "^[^\\x00]*[^\\x00\\x09-\\x0d\\x20\\x85\\xa0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000][^\\x00]*$"
      responses:
        '200': {$ref: '#/components/responses/NamespacePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Identity]
      summary: Create a namespace
      operationId: createNamespace
      description: Creates a namespace with a stable slug and display metadata. The returned revision and ETag identify its initial state.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateNamespace'}
      responses:
        '201': {$ref: '#/components/responses/NamespaceCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/namespaces/{namespaceId}:
    parameters: [{$ref: '#/components/parameters/NamespaceId'}]
    get:
      tags: [Identity]
      summary: Get a namespace
      operationId: getNamespace
      description: Returns a visible namespace and its current ETag for subsequent revision-bound commands.
      responses:
        '200': {$ref: '#/components/responses/Namespace'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Identity]
      summary: Update namespace metadata without changing its stable slug
      operationId: updateNamespace
      description: Updates namespace display metadata with the current If-Match value and an audit reason. The namespace slug remains unchanged.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/PatchNamespace'}
      responses:
        '200': {$ref: '#/components/responses/Namespace'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/publishers:
    get:
      tags: [Identity]
      summary: List publishers
      operationId: listPublishers
      description: >-
        Returns a cursor-paginated page of publisher identities visible in the authenticated tenant. Optional exact displayName and declaredDomain filters are intersected before
        limits and bound to continuation. Names preserve exact case and spacing and are not unique. Domains are trimmed, lowercased and stripped of one trailing dot; only declared
        domains match, independently of publication approval.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: displayName
          in: query
          description: Exact stored display name, including case and spacing. Names are not unique.
          schema:
            type: string
            minLength: 1
            maxLength: 160
            pattern: "^[^\\x00]*[^\\x00\\x09-\\x0d\\x20\\x85\\xa0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000][^\\x00]*$"
        - name: declaredDomain
          in: query
          description: Exact declared DNS domain, normalized as on creation. Does not select approved domains.
          schema:
            type: string
            minLength: 1
            maxLength: 253
            pattern: "^[\\x09-\\x0d\\x20\\x85\\xa0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*\
              [A-Za-z0-9\u0130\u212a](?:[A-Za-z0-9\u0130\u212a-]{0,61}[A-Za-z0-9\u0130\u212a])?(?:\\.[A-Za-z0-9\u0130\u212a](?:[A-Za-z0-9\u0130\u212a-]{0,61}[A-Za-z0-9\u0130\u212a])?)+\\.?\
              [\\x09-\\x0d\\x20\\x85\\xa0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*$"
      responses:
        '200': {$ref: '#/components/responses/PublisherPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Identity]
      summary: Create a publisher
      operationId: createPublisher
      description: Creates a publisher identity and its declared domains. Domain declaration does not approve that publisher for publication on a discovery host.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreatePublisher'}
      responses:
        '201': {$ref: '#/components/responses/PublisherCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/publishers/{publisherId}:
    parameters: [{$ref: '#/components/parameters/PublisherId'}]
    get:
      tags: [Identity]
      summary: Get a publisher
      operationId: getPublisher
      description: Returns a publisher's current metadata, declared domains and publication-domain approvals, with its revision ETag.
      responses:
        '200': {$ref: '#/components/responses/Publisher'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Identity]
      summary: Update publisher metadata or declared domains
      description: Declared domains that remain approved or back an active publication must be revoked and retired before removal.
      operationId: updatePublisher
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/PatchPublisher'}
      responses:
        '200': {$ref: '#/components/responses/Publisher'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/publishers/{publisherId}/domains/{domain}/verification:
    parameters:
      - {$ref: "#/components/parameters/PublisherId"}
      - {$ref: "#/components/parameters/Domain"}
    get:
      tags: [Identity]
      summary: Read publisher DNS verification status
      description: >-
        Requires current tenant-level publisher.read. Requires publishers.read when OAuth scopes are enforced.
        Reads evidence for one exact declared DNS domain without a DNS lookup. Does not expose the TXT value.
        Returns a verification ETag even before a challenge exists. Status remains readable when verification is disabled.
        Proof freshness and the last check outcome are separate from publication approval, general publisher authority and legal rights.
      operationId: getPublisherDomainVerification
      responses:
        "200":
          description: Current private evidence and its verification ETag.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Cache-Control: {schema: {type: string}, description: Private response with no-store caching.}
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublisherDomainVerification"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/publishers/{publisherId}/domains/{domain}/verification/challenge:
    parameters:
      - {$ref: "#/components/parameters/PublisherId"}
      - {$ref: "#/components/parameters/Domain"}
    get:
      tags: [Identity]
      summary: Read current TXT instructions
      description: >-
        Requires current tenant-level publisher.manage. Requires publishers.manage when OAuth scopes are enforced.
        Returns the TXT name, value and expiry only for a usable pending challenge. Does not query DNS.
        Returns a verification ETag even before a challenge exists. The publishers.read OAuth scope is not required.
        Disabled mode returns 404.
      operationId: getPublisherDomainChallenge
      responses:
        "200":
          description: Current private evidence and its verification ETag.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Cache-Control: {schema: {type: string}, description: Private response with no-store caching.}
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublisherDomainChallenge"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/publishers/{publisherId}/domains/{domain}/verification:issue:
    parameters:
      - {$ref: "#/components/parameters/PublisherId"}
      - {$ref: "#/components/parameters/Domain"}
    post:
      tags: [Identity]
      summary: Issue or replace a DNS TXT challenge
      description: >-
        Requires current tenant-level publisher.manage. Requires publishers.manage when OAuth scopes are enforced.
        Send an Idempotency-Key and the current verification ETag from either verification read in If-Match.
        Do not use the Publisher metadata ETag. Replaces the pending TXT value without extending or erasing earlier proof.
        Disabled mode returns 404 for a new command. Historical commands replay under current management authority after replacement, clearing or domain removal.
      operationId: issuePublisherDomainChallenge
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody: {$ref: "#/components/requestBodies/Reason"}
      responses:
        "200":
          description: Current evidence or a retained command response. Read current status after replay.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Cache-Control: {schema: {type: string}, description: Private response with no-store caching.}
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublisherDomainChallenge"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/publishers/{publisherId}/domains/{domain}/verification:check:
    parameters:
      - {$ref: "#/components/parameters/PublisherId"}
      - {$ref: "#/components/parameters/Domain"}
    post:
      tags: [Identity]
      summary: Check the current DNS TXT challenge
      description: >-
        Requires current tenant-level publisher.manage. Requires publishers.manage when OAuth scopes are enforced.
        Send an Idempotency-Key and the current verification ETag from either verification read in If-Match.
        Refuses stale, expired, consumed or absent challenges and excess lookup capacity before DNS.
        Queries DNS once and rechecks current authority before committing evidence. A completed lookup returns 200 with lastCheckOutcome.
        Only matched establishes proof. An unsuccessful renewal keeps earlier proof until its expiry; read state separately.
        Replaying the original command returns its retained response without another lookup, including unsuccessful outcomes.
        Disabled mode returns 404 for a new command. DNS evidence does not approve publication or establish general publisher authority or legal rights.
      operationId: checkPublisherDomainVerification
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody: {$ref: "#/components/requestBodies/Reason"}
      responses:
        "200":
          description: Current evidence or a retained command response. Read current status after replay.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Cache-Control: {schema: {type: string}, description: Private response with no-store caching.}
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublisherDomainVerification"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/publishers/{publisherId}/domains/{domain}/verification:clear:
    parameters:
      - {$ref: "#/components/parameters/PublisherId"}
      - {$ref: "#/components/parameters/Domain"}
    post:
      tags: [Identity]
      summary: Clear publisher DNS verification evidence
      description: >-
        Requires current tenant-level publisher.manage. Requires publishers.manage when OAuth scopes are enforced.
        Send an Idempotency-Key and the current verification ETag from either verification read in If-Match.
        Clears the pending challenge and DNS proof without a DNS lookup. Publication approval remains unchanged.
        Disabled mode returns 404 for a new command. Historical commands replay under current management authority after replacement, clearing or domain removal.
      operationId: clearPublisherDomainVerification
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody: {$ref: "#/components/requestBodies/Reason"}
      responses:
        "200":
          description: Current evidence or a retained command response. Read current status after replay.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Cache-Control: {schema: {type: string}, description: Private response with no-store caching.}
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublisherDomainVerification"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/publishers/{publisherId}/publication-domains/{domain}:approve:
    parameters:
      - {$ref: '#/components/parameters/PublisherId'}
      - {$ref: '#/components/parameters/Domain'}
    post:
      tags: [Identity]
      summary: Approve a publisher domain for publication
      description: >-
        Requires publisher.approve_domain and publishers.manage when OAuth scopes are enforced.
        Records a reason-bearing approval for a normalized domain already declared by this publisher.
        When publisherDomainVerification.mode is required_for_approval, fresh stored DNS TXT evidence
        is required at commit; missing or expired evidence returns PRECONDITION_FAILED.
        This command performs no DNS lookup. Existing approvals do not expire with their DNS evidence.
        The approval authorizes the baseline publication workflow only;
        it does not verify external control, establish publisher authority, or assess legal rights.
      operationId: approvePublisherPublicationDomain
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '200': {$ref: '#/components/responses/PublisherUpdated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/publishers/{publisherId}/publication-domains/{domain}:revoke:
    parameters:
      - {$ref: '#/components/parameters/PublisherId'}
      - {$ref: '#/components/parameters/Domain'}
    post:
      tags: [Identity]
      summary: Revoke a publisher domain from publication
      description: >-
        Requires publisher.approve_domain and publishers.manage when OAuth scopes are enforced.
        Removes the reason-bearing publication approval, identifies affected releases, and atomically withdraws active discovery snapshots for
        configured hosts that contain the domain. Discovery reads remain snapshot-only and fail closed after withdrawal.
      operationId: revokePublisherPublicationDomain
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '200': {$ref: '#/components/responses/PublicationDomainRevoked'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/resources/{resourceId}/listings:
    parameters: [{$ref: '#/components/parameters/ResourceId'}]
    get:
      tags: [Catalog lifecycle]
      summary: List listings
      description: Requires current resource.read_history at the canonical parent namespace. Results use ascending immutable UUID order and bounded parent-scoped pages. Revision histories contain summaries; exact content is read separately.
      operationId: listResourceListings
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200':
          description: Bounded history page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CatalogListing'}}
                  nextCursor: {type: string, maxLength: 2048}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/catalog-listings/{listingId}/releases:
    parameters: [{$ref: '#/components/parameters/ListingId'}]
    get:
      tags: [Catalog lifecycle]
      summary: List releases
      description: Requires current resource.read_history at the canonical parent namespace. Results use ascending immutable UUID order and bounded parent-scoped pages. Revision histories contain summaries; exact content is read separately.
      operationId: listListingReleases
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200':
          description: Bounded history page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ListingRelease'}}
                  nextCursor: {type: string, maxLength: 2048}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/review-submissions:
    get:
      tags: [Catalog lifecycle]
      summary: List review submissions
      description: >-
        Requires catalog.read when scopes are enforced. Current resource.read_history predicates select the authorized namespace population before pagination. Filter by listing and state; results
        use ascending immutable UUID order. A listing filter additionally requires history authority at that canonical namespace. Optional canonicalIdentifier and submittedDisplayName are
        independently projected under current resource.read and resource.read_content permissions. Names come from the exact submitted listing revision; missing context does not remove an
        otherwise authorized submission. Set unreleased=true only with state=approved to exclude every submission referenced by a release,
        including retired or revoked releases. False or omission adds no release filter. The filter binds continuation.
      operationId: listReviewSubmissions
      parameters:
        - name: unreleased
          in: query
          description: True requires state=approved and excludes submissions with any retained release. False or omission adds no release filter.
          schema: {type: boolean}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: listingId, in: query, description: "Restrict submissions to this Catalog listing.", schema: {$ref: '#/components/schemas/UUID'}}
        - {name: state, in: query, description: "Restrict submissions to this review state.", schema: {type: string, enum: [submitted, approved, changes_required, rejected]}}
      responses:
        '200':
          description: Bounded review page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ReviewSubmission'}}
                  nextCursor: {type: string, maxLength: 2048}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/review-submissions/{submissionId}/evidence:
    parameters: [{$ref: '#/components/parameters/SubmissionId'}]
    get:
      tags: [Catalog lifecycle]
      summary: Read exact submission-bound validation evidence
      description: >-
        Requires current resource.read_content at the submission namespace and retains the version-revision private-read audit record before disclosure.
        Returns the evidence ID, digest and policy version bound by this submission, never a later validation run. A failed audit write prevents disclosure.
      operationId: getReviewSubmissionEvidence
      responses:
        '200':
          description: Immutable submission-bound evidence.
          content: {application/json: {schema: {$ref: '#/components/schemas/EvidenceSet'}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/resources:
    get:
      tags: [Catalog lifecycle]
      summary: List local Resources
      operationId: listResources
      description: >-
        Returns a cursor-paginated page selected by current resource.read permission at each Resource namespace before ordering and limits. A policy change invalidates continuation. This authoring
        inventory is distinct from the governed discovery catalog.
      parameters:
        - name: canonicalIdentifier
          in: query
          description: >-
            Exact canonical identity, with surrounding whitespace trimmed and AIR scheme/publisher canonicalized as on creation. Namespace/name case and opaque Unicode spelling are preserved.
            Combined with kind before SQL limits; both filters bind continuation.
          schema: {type: string, minLength: 1, maxLength: 512}
        - name: kind
          in: query
          description: Restrict local Resource identities to this resource kind.
          schema: {$ref: '#/components/schemas/ResourceKind'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/ResourcePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Catalog lifecycle]
      summary: Create a Resource
      operationId: createResource
      description: Creates a stable local Resource in an authorized namespace. Representations, versions, listings and publication are separate lifecycle steps.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateResource'}
      responses:
        '201': {$ref: '#/components/responses/ResourceCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/resources/{resourceId}:
    parameters: [{$ref: '#/components/parameters/ResourceId'}]
    get:
      tags: [Catalog lifecycle]
      summary: Get a Resource
      operationId: getResource
      description: Returns a visible local Resource and its current revision ETag. Immutable versions and listing history are read through their own endpoints.
      responses:
        '200': {$ref: '#/components/responses/Resource'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/resources/{resourceId}:delete:
    parameters: [{$ref: '#/components/parameters/ResourceId'}]
    post:
      tags: [Catalog lifecycle]
      summary: Soft-delete an unpublished local draft with no retained review, release, or adoption dependency
      description: Soft-delete an eligible local draft using its current ETag and an audit reason. Requires current resource.delete_draft and either the exact originating
        membership/realm/subject or protected access.manage authority. Immutable creation audit attribution establishes ownership; missing or ambiguous attribution never grants
        creator access. Public createdBy text is attribution only. Retained review, release or adoption dependencies prevent deletion.
      operationId: deleteResource
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '204':
          description: Draft soft-deleted; its canonical identifier and audit evidence remain reserved.
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/resources/{resourceId}/versions:
    parameters: [{$ref: '#/components/parameters/ResourceId'}]
    get:
      tags: [Catalog lifecycle]
      summary: List versions
      description: Requires current resource.read_history at the canonical parent namespace. Results use ascending immutable UUID order and bounded parent-scoped pages. Revision histories contain summaries; exact content is read separately.
      operationId: listResourceVersions
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200':
          description: Bounded history page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ResourceVersion'}}
                  nextCursor: {type: string, maxLength: 2048}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Catalog lifecycle]
      summary: Create a Resource version
      operationId: createResourceVersion
      description: Reserves a version label under the Resource and creates its initial immutable revision from the supplied representations. Returns the version, revision and validation evidence.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateVersion'}
      responses:
        '201': {$ref: '#/components/responses/VersionEvidenceCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/resource-versions/{versionId}:
    parameters: [{$ref: '#/components/parameters/VersionId'}]
    get:
      tags: [Catalog lifecycle]
      summary: Get a Resource version
      operationId: getResourceVersion
      description: Returns version metadata and pointers to its current and sealed revisions, with the version ETag.
      responses:
        '200': {$ref: '#/components/responses/ResourceVersion'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/resource-versions/{versionId}/revisions:
    parameters: [{$ref: '#/components/parameters/VersionId'}]
    get:
      tags: [Catalog lifecycle]
      summary: List version revisions
      description: Requires current resource.read_history at the canonical parent namespace. Results use ascending immutable UUID order and bounded parent-scoped pages. Revision histories contain summaries; exact content is read separately.
      operationId: listVersionRevisions
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200':
          description: Bounded history page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/RevisionSummary'}}
                  nextCursor: {type: string, maxLength: 2048}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Catalog lifecycle]
      summary: Create an immutable version revision
      operationId: createVersionRevision
      description: Adds a new immutable representation revision while the version remains editable. Requires the current version ETag; earlier revisions remain retained.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/CreateRevision'}
      responses:
        '201': {$ref: '#/components/responses/VersionEvidenceCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/version-revisions/{revisionId}:
    parameters: [{$ref: '#/components/parameters/RevisionId'}]
    get:
      tags: [Catalog lifecycle]
      summary: Get an immutable version revision
      operationId: getVersionRevision
      description: Returns an authorized immutable version revision with its representation references and retained validation evidence.
      responses:
        '200': {$ref: '#/components/responses/RevisionEvidence'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/version-revisions/{revisionId}/export:
    parameters: [{$ref: '#/components/parameters/RevisionId'}]
    get:
      tags: [Catalog lifecycle]
      summary: Download a reusable draft JSON file
      operationId: exportVersionRevisionDraft
      description: >-
        Exports all representations from this exact VersionRevision, including readable content with validation findings.
        Requires current resource.read and resource.read_content in the canonical Namespace, plus catalog.read when OAuth scopes are enforced.
        Exact reads do not require resource.read_history. The optional ListingRevision must reference this exact revision and the same Resource, Namespace and tenant.
        VersionRevision and document private-read audits must succeed before disclosure; Listing metadata retains its permission-only read contract.
        Native text comes from retained documents, never a new source-URL fetch. Skill packages require separate package content.
        Plugin references carry the retained archive checksum. This read changes no domain records or outbox state.
        The encoded file limit is 64 MiB. Client and deployment response limits can be lower.
      parameters:
        - name: listingRevisionId
          in: query
          description: Include the exact matching ListingRevision's editable metadata, without destination identities or sealed artwork assessments.
          schema: {$ref: '#/components/schemas/UUID'}
      responses:
        '200':
          description: Complete reusable draft JSON attachment. Incomplete authored content can still need correction before Save.
          headers:
            Content-Digest: {$ref: '#/components/headers/ContentDigest'}
            Content-Length: {$ref: '#/components/headers/ContentLength'}
            Content-Disposition: {$ref: '#/components/headers/ContentDisposition'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogDraftFile'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/version-revisions/{revisionId}:validate:
    parameters: [{$ref: '#/components/parameters/RevisionId'}]
    post:
      tags: [Catalog lifecycle]
      summary: Revalidate an immutable version revision
      description: >-
        Records a new immutable validation run over the exact retained VersionRevision under the current adapter and policy without changing its content, approval, or prior evidence.
        Deterministic structural evidence has no wall-clock expiry. An HTTPS representation is retrieved again through the deployment-owned anonymous public route;
        identical bytes renew its bounded retrieval evidence, while an unavailable, mismatched, or changed response records a blocked run and never rewrites the VersionRevision.
        An explicit blocked URL revalidation also withdraws active publication snapshots containing a release for that revision.
      operationId: validateVersionRevision
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/EmptyObject'}
      responses:
        '201': {$ref: '#/components/responses/ValidationEvidenceCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/catalog-listings:
    post:
      tags: [Catalog lifecycle]
      summary: Create a Catalog listing
      operationId: createCatalogListing
      description: Creates a listing identity for a local Resource in an authorized namespace. Presentation, publisher and visibility metadata are supplied through a separate listing revision.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateListing'}
      responses:
        '201': {$ref: '#/components/responses/CatalogListingCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/catalog-listings/{listingId}:
    parameters: [{$ref: '#/components/parameters/ListingId'}]
    get:
      tags: [Catalog lifecycle]
      summary: Get a Catalog listing
      operationId: getCatalogListing
      description: Returns a visible listing and its current revision pointer, with an ETag for subsequent commands.
      responses:
        '200': {$ref: '#/components/responses/CatalogListing'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/catalog-listings/{listingId}/revisions:
    parameters: [{$ref: '#/components/parameters/ListingId'}]
    get:
      tags: [Catalog lifecycle]
      summary: List listing revisions
      description: Requires current resource.read_history at the canonical parent namespace. Results use ascending immutable UUID order and bounded parent-scoped pages. Revision histories contain summaries; exact content is read separately.
      operationId: listListingRevisions
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200':
          description: Bounded history page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/RevisionSummary'}}
                  nextCursor: {type: string, maxLength: 2048}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Catalog lifecycle]
      summary: Create an immutable listing revision
      operationId: createListingRevision
      description: Adds immutable listing metadata and advances the listing's current revision. Requires the current listing ETag and preserves earlier revisions.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/CreateListingRevision'}
      responses:
        '201': {$ref: '#/components/responses/ListingRevisionCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/listing-revisions/{revisionId}:
    parameters: [{$ref: '#/components/parameters/RevisionId'}]
    get:
      tags: [Catalog lifecycle]
      summary: Get an immutable listing revision
      operationId: getListingRevision
      description: Returns an authorized immutable listing revision and its presentation, visibility and publisher metadata.
      responses:
        '200': {$ref: '#/components/responses/ListingRevision'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/catalog-listings/{listingId}/submissions:
    parameters: [{$ref: '#/components/parameters/ListingId'}]
    post:
      tags: [Catalog lifecycle]
      summary: Submit a listing for review
      operationId: submitListingForReview
      description: Submits the listing's current revision and its referenced version revision for review. No revision IDs are supplied in the body; submission does not activate a public discovery snapshot.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/EmptyObject'}
      responses:
        '201': {$ref: '#/components/responses/ReviewSubmissionCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/review-submissions/{submissionId}:
    parameters: [{$ref: '#/components/parameters/SubmissionId'}]
    get:
      tags: [Catalog lifecycle]
      summary: Get a review submission
      operationId: getReviewSubmission
      description: Returns a visible review submission with its decision state and referenced immutable revisions.
      responses:
        '200': {$ref: '#/components/responses/ReviewSubmission'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/review-submissions/{submissionId}:approve:
    parameters: [{$ref: '#/components/parameters/SubmissionId'}]
    post:
      tags: [Catalog lifecycle]
      summary: Approve a review submission
      operationId: approveReviewSubmission
      description: Records an approval for the current submission revision after reviewer authorization and separation-of-duties checks. Approval alone does not activate a public snapshot.
        Independent review resolves immutable submission audit attribution; the originating membership or the same tenant/realm/subject cannot decide. An unrelated equal subject
        in another realm is eligible with current permissions. Missing or ambiguous attribution refuses the decision.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '200': {$ref: '#/components/responses/ReviewDecision'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/review-submissions/{submissionId}:request-changes:
    parameters: [{$ref: '#/components/parameters/SubmissionId'}]
    post:
      tags: [Catalog lifecycle]
      summary: Request review changes
      operationId: requestReviewChanges
      description: Records the reviewer's reason for requesting changes against the current submission revision. Submitted immutable evidence is not rewritten. Independent review resolves
        immutable submission audit attribution; the originating membership or the same tenant/realm/subject cannot decide. An unrelated equal subject in another realm is eligible
        with current permissions. Missing or ambiguous attribution refuses the decision.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '200': {$ref: '#/components/responses/ReviewDecision'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/review-submissions/{submissionId}:reject:
    parameters: [{$ref: '#/components/parameters/SubmissionId'}]
    post:
      tags: [Catalog lifecycle]
      summary: Reject a review submission
      operationId: rejectReviewSubmission
      description: Records a rejection and its reason against the current submission revision, preserving the submission and review evidence. Independent review resolves immutable
        submission audit attribution; the originating membership or the same tenant/realm/subject cannot decide. An unrelated equal subject in another realm is eligible with
        current permissions. Missing or ambiguous attribution refuses the decision.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '200': {$ref: '#/components/responses/ReviewDecision'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/catalog-listings/{listingId}:publish:
    parameters: [{$ref: '#/components/parameters/ListingId'}]
    post:
      tags: [Catalog lifecycle]
      summary: Publish an approved Catalog listing
      description: >-
        Rechecks current approved validation evidence before the publication transaction. URL-backed representations
        additionally require a fresh anonymous fetch through the deployment-owned public route whose status, media type,
        and exact bytes still match the reviewed PostgreSQL binding.
      operationId: publishCatalogListing
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/PublishListing'}
      responses:
        '201': {$ref: '#/components/responses/ListingPublished'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/listing-releases/{releaseId}:
    parameters: [{$ref: '#/components/parameters/ReleaseId'}]
    get:
      tags: [Catalog lifecycle]
      summary: Get a listing release
      operationId: getListingRelease
      description: Returns a visible release binding a listing revision to a version revision, including its lifecycle state and ETag.
      responses:
        '200': {$ref: '#/components/responses/ListingRelease'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/listing-releases/{releaseId}:deprecate:
    parameters: [{$ref: '#/components/parameters/ReleaseId'}]
    post:
      tags: [Catalog lifecycle]
      summary: Deprecate a listing release
      operationId: deprecateListingRelease
      description: Marks an eligible release deprecated with a reason and the current release ETag. Retained release evidence is preserved.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/ReleaseTransition'}
      responses: {'200': {$ref: '#/components/responses/ListingReleaseUpdated'}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/listing-releases/{releaseId}:retire:
    parameters: [{$ref: '#/components/parameters/ReleaseId'}]
    post:
      tags: [Catalog lifecycle]
      summary: Retire a listing release
      operationId: retireListingRelease
      description: Retires an eligible release with a reason and the current release ETag. This lifecycle change does not delete retained release history.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/ReleaseTransition'}
      responses: {'200': {$ref: '#/components/responses/ListingReleaseUpdated'}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/listing-releases/{releaseId}:supersede:
    parameters: [{$ref: '#/components/parameters/ReleaseId'}]
    post:
      tags: [Catalog lifecycle]
      summary: Supersede a listing release
      operationId: supersedeListingRelease
      description: Marks an eligible release superseded by the specified replacement release. Requires a reason, the current release ETag and an eligible replacement.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/ReleaseTransition'}
      responses: {'200': {$ref: '#/components/responses/ListingReleaseUpdated'}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/listing-releases/{releaseId}:revoke:
    parameters: [{$ref: '#/components/parameters/ReleaseId'}]
    post:
      tags: [Catalog lifecycle]
      summary: Revoke a listing release
      operationId: revokeListingRelease
      description: Revokes an eligible release with a reason and the current release ETag while preserving its retained evidence.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/ReleaseTransition'}
      responses: {'200': {$ref: '#/components/responses/ListingReleaseUpdated'}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/artifacts/{artifactId}/content:
    parameters: [{$ref: '#/components/parameters/ArtifactId'}]
    get:
      tags: [Catalog lifecycle]
      summary: Download an authorized bounded Catalog document
      description: >-
        New content representations are exact tenant-scoped documents stored transactionally with immutable version
        revisions. For a URL-backed representation, this authenticated
        route requires current resource.read_content authority at a live same-tenant reference namespace (or an explicit tenant-wide content grant); it does not grant public artifact-delivery authority.
      operationId: getArtifactContent
      responses:
        '200':
          description: Immutable bounded Catalog document bytes.
          headers:
            Content-Digest: {$ref: '#/components/headers/ContentDigest'}
            Content-Length: {$ref: '#/components/headers/ContentLength'}
            Content-Disposition: {$ref: '#/components/headers/ContentDisposition'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            '*/*':
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/catalog/resources:
    get:
      tags: [Catalog discovery]
      summary: Browse governed Catalog records
      operationId: browseCatalog
      description: Returns a bounded page of governed catalog records visible to the caller. Local drafts are not made discoverable through this endpoint.
      parameters:
        - name: namespaceId
          in: query
          description: Restrict to the local Listing namespace UUID without disclosing whether an unmatched namespace exists.
          schema: {$ref: '#/components/schemas/UUID'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: kind
          in: query
          description: Restrict governed catalog records to this resource kind.
          schema: {$ref: '#/components/schemas/ResourceKind'}
        - name: visibility
          in: query
          description: Restrict records by visibility without expanding the caller's access.
          schema: {$ref: '#/components/schemas/Visibility'}
      responses:
        '200': {$ref: '#/components/responses/CatalogRecordPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/catalog/resources/{catalogRecordId}:
    parameters: [{$ref: '#/components/parameters/CatalogRecordId'}]
    get:
      tags: [Catalog discovery]
      summary: Get a governed Catalog record
      operationId: getCatalogRecord
      description: Returns one governed catalog record visible to the caller, including its resource and release metadata.
      responses:
        '200': {$ref: '#/components/responses/CatalogRecord'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/catalog/indexed-record:
    get:
      tags: [Catalog discovery]
      summary: Get a current indexed Catalog projection
      description: >-
        Requires current tenant-level federation.discover and catalog.read. Returns the current projection under indexed-only Search eligibility,
        with bounded source attribution and conflict indicators. No live request, raw observation or administrator configuration is returned.
        A removed, paused, withdrawn or excluded external identity returns not found. A visible local counterpart does not hide this explicit indexed bookmark. This is a current bookmark, not immutable evidence.
      operationId: getIndexedCatalogRecord
      parameters:
        - {name: identifier, in: query, description: "Exact normalized AIR identifier for the external resource.", required: true, schema: {type: string, pattern: '^urn:air:', maxLength: 512}}
        - {name: versionPresent, in: query, description: "Whether the external entry carries a version; absence and an explicitly empty version are distinct.", required: true, schema: {type: boolean}}
        - {name: version, in: query, schema: {type: string, maxLength: 128}, description: Omit when versionPresent is false; an empty version is distinct from an absent version.}
      responses:
        '200':
          description: Current reader-visible indexed metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogSearchResult'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/catalog:reindex:
    post:
      tags: [Catalog discovery]
      summary: Reindex a Catalog search scope
      operationId: reindexCatalog
      description: >-
        Requires tenant-level operations.reindex and, when scope enforcement is enabled, the tenant.admin OAuth scope.
        Rebuilds the authenticated tenant's control search index, or the specified active publication snapshot's public index, using the deployment-configured model.
        Uses existing Job deduplication, audit evidence and idempotency. Disabled or excluded tenants receive a dependency-unavailable error. No provider or model override is accepted.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 2000, pattern: '.*\S.*'}
                snapshotId: {$ref: '#/components/schemas/UUID'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/overview/administration:
    get:
      tags:
        - Catalog overview
      summary: Summarize Catalog access administration
      operationId: getAdministrationOverview
      description: Requires current access.manage and enforced tenant.admin. Counts retained memberships by actor type and lifecycle state. Active realms
        are not required for counted memberships. Groups count active definitions in the caller's realm. Roles count active tenant definitions. Assignments count retained active IDs, including suspended Groups
        or members. These are not effective access or identity-provider counts. Each measure has an independent 10000-row ceiling. Incomplete distributions
        are omitted. No subjects or permission expansion are returned.
      responses:
        '200':
          description: Private current-access summary with Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationOverview'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/overview/feedback:
    get:
      tags:
        - Catalog overview
      summary: Summarize open feedback
      operationId: getFeedbackOverview
      description: Requires feedback.moderate and enforced tenant.admin. Counts open feedback by category, excluding soft-deleted Resources. The independent
        selection ceiling is 10000. An incomplete category distribution is omitted. The oldest original submission time remains independently exact, including
        reopened cases. No submission text or private Resource metadata is returned.
      responses:
        '200':
          description: Private current-access summary with Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackOverview'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/overview/ratings:
    get:
      tags:
        - Catalog overview
      summary: Summarize retained ratings
      operationId: getRatingOverview
      description: Requires ratings.moderate and enforced tenant.admin. Counts retained active, withdrawn and removed ratings, including unavailable targets.
        The selection ceiling is 10000. An incomplete state distribution is omitted. Active ratings are not pending moderation. No rater identities, target
        metadata or aggregate score is returned.
      responses:
        '200':
          description: Private current-access summary with Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingOverview'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/overview/webhook-endpoints:
    get:
      tags:
        - Catalog overview
      summary: Summarize webhook endpoints
      operationId: getWebhookEndpointOverview
      description: >-
        Requires webhook.read and enforced webhooks.manage. Webhooks must be enabled. Counts include active and disabled endpoints. The independent selection ceiling is
        10000. Incomplete distributions are omitted. No receiver requests occur.
      responses:
        '200':
          description: Private current-access summary with Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointOverview'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/overview/webhook-deliveries:
    get:
      tags:
        - Catalog overview
      summary: Summarize retained webhook deliveries
      operationId: getWebhookDeliveryOverview
      description: >-
        Requires webhook.read_evidence with its webhook.read companion and enforced webhooks.manage. Webhooks must be enabled. Counts cover retained production
        deliveries, including disabled endpoints and acknowledged parents. Synthetic tests are excluded. Distributions are omitted above 10000 rows. Failed endpoints
        independently select up to five active endpoints. Select the latest attempted row before filtering waiting or dead_letter outcomes. Order attempts by updated_at
        DESC and id DESC, at or after the current endpoint update. Retention can remove later outcomes. Failure can precede HTTP. These results do not establish receiver
        health, dispatch eligibility or lifetime order.
      responses:
        '200':
          description: Private current-access summary with Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryOverview'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/overview/sources:
    get:
      tags:
        - Catalog overview
      summary: Summarize sources
      operationId: getSourceOverview
      description: Requires source.read and enforced sources.read. Removed Sources do not count. Current-revision completed attempts determine sync outcomes.
        Select the latest attempt before failures. Last-complete evidence can belong to an earlier revision. Distributions are omitted above 10000 Sources.
        The problem list independently selects up to five Sources. No peer requests occur.
      responses:
        '200':
          description: Private current-access summary with Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceOverview'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/overview/jobs:
    get:
      tags:
        - Catalog overview
      summary: Summarize jobs
      operationId: getJobOverview
      description: Requires job.read and enforced catalog.read. Current family permissions and deployment target checks precede selection. Counts cover retained
        Jobs. Each count has an independent 10000-row ceiling. Incomplete kind/state distributions are omitted. Due work uses not_before for queued/waiting
        Jobs and lease expiry for running Jobs. Oldest due time remains independently exact. Due work does not establish worker availability.
      responses:
        '200':
          description: Private current-access summary with Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOverview'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/overview/reviews:
    get:
      tags:
        - Catalog overview
      summary: Summarize readable reviews and 30-day activity
      operationId: getReviewOverview
      description: Current resource.read_history visibility applies to all populations. The interval starts at UTC midnight 29 days before observedAt and excludes
        observedAt. Each population has an independent 10000-row ceiling. Incomplete age distributions and series are omitted. The median includes all decision
        outcomes selected by decidedAt. No decisions omit the median. Invalid durations omit the median with invalid_timestamps. Pending and approved-unreleased
        totals are independent of the interval.
      responses:
        '200':
          description: Private current-access summary with Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOverview'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/overview/publication:
    get:
      tags:
        - Catalog overview
      summary: Summarize configured publication hosts
      operationId: getPublicationOverview
      description: Requires publication.read and enforced catalog.read. Only configured hosts for the current tenant appear. Disabled hosts have no snapshot lookup.
        Active metadata for enabled hosts is read in one bounded query. Configured mode and stored audience remain separate. Recorded metadata and mismatch labels
        do not prove full document validity or discovery availability.
      responses:
        '200':
          description: Private current-access summary with Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationOverview'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/overview/resources:
    get:
      tags: [Catalog overview]
      summary: Count readable local Resources
      operationId: getResourceOverview
      description: >-
        Private current-access summary. resource.read in each Resource Namespace. Local Resource IDs count once. Soft-deleted Resources are excluded. Kind counts are present only for a complete population.
        Each response captures one server observation time and applies a fixed 10000-row ceiling per independent measure.
        Counts are subject to current tenant and Namespace permissions before aggregation. Separate reads are not one atomic dashboard snapshot.
      responses:
        '200':
          description: Bounded authorized summary. Responses use Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceOverview'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/overview/releases:
    get:
      tags: [Catalog overview]
      summary: Count current Listing releases
      operationId: getReleaseOverview
      description: >-
        Private current-access summary. resource.read_history in each Listing Namespace. Follow current Listing pointers only. Published and deprecated counts use independent ceilings. Resource-read permission is not required.
        Each response captures one server observation time and applies a fixed 10000-row ceiling per independent measure.
        Counts are subject to current tenant and Namespace permissions before aggregation. Separate reads are not one atomic dashboard snapshot.
      responses:
        '200':
          description: Bounded authorized summary. Responses use Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseOverview'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/overview/namespaces:
    get:
      tags: [Catalog overview]
      summary: Count readable Namespaces
      operationId: getNamespaceOverview
      description: >-
        Private current-access summary. namespace.read for each Namespace. Count readable Namespace IDs before the selection ceiling.
        Each response captures one server observation time and applies a fixed 10000-row ceiling per independent measure.
        Counts are subject to current tenant and Namespace permissions before aggregation. Separate reads are not one atomic dashboard snapshot.
      responses:
        '200':
          description: Bounded authorized summary. Responses use Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectoryOverview'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/overview/publishers:
    get:
      tags: [Catalog overview]
      summary: Count Publishers
      operationId: getPublisherOverview
      description: >-
        Private current-access summary. Tenant publisher.read and enforced publishers.read. This count does not require catalog.read.
        Each response captures one server observation time and applies a fixed 10000-row ceiling per independent measure.
        Counts are subject to current tenant and Namespace permissions before aggregation. Separate reads are not one atomic dashboard snapshot.
      responses:
        '200':
          description: Bounded authorized summary. Responses use Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectoryOverview'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/overview/indexed:
    get:
      tags: [Catalog overview]
      summary: Count distinct indexed external records
      operationId: getIndexedOverview
      description: >-
        Private current-access summary. Tenant federation.discover and enforced catalog.read.
        Reuse indexed-only Search eligibility without local shadowing.
        Bound eligible source contributions before deduplication by identifier, version presence and version.
        Limited contribution selection omits the distinct count. No live queries, embedding calls or artifact fetches occur.
        Missing or outdated derived projections return 503 instead of zero.
        Each response captures one server observation time and applies a fixed 10000-row ceiling per independent measure.
        Counts are subject to current tenant and Namespace permissions before aggregation. Separate reads are not one atomic dashboard snapshot.
      responses:
        '200':
          description: Bounded authorized summary. Responses use Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndexedOverview'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/catalog/search:
    post:
      tags: [Catalog discovery]
      summary: Search the unified authenticated Catalog
      description: >-
        Returns one bounded deterministic merge of authorized local published releases, current indexed observations from administrator-managed sources, and transient live results from eligible administrator-approved sources.
        Local resource.read predicates precede selection, totals and paging. Without federation.discover, default discovery selects only authorized local records; explicitly selecting indexed or
        live origins is forbidden before outbound disclosure. Visible current local releases shadow matching external identities only when the local origin participates.
        For a nonempty core query with durable origins, signed continuations traverse an unchanged live window of at most 50 candidates alongside durable results.
        Each continuation that needs live results repeats bounded approved peer traversal. A changed window or durable generation requires a restart;
        a temporary replay failure permits retry of the same cursor. The initial 15-minute expiry does not extend.
        Hybrid results retain exact durable rank order, followed by a distinct bounded live tail. Live-only Search pages the same bounded window without durable or embedding work.
        The service selects its core SearchProfile and source topology; clients cannot select sources, providers, models, indexes, weights, or tiers.
        core-lexical-v1 matches all query tokens across fields using Unicode letters/numbers and simple lowercase, without stemming or accent folding.
        Core results sort by descending score, then Unicode-whitespace-normalized lowercase display name and stable result ID.
        Hybrid composite order retains precise durable ranks before live results; each display score remains an integer from 0 to 100.
        Missing or outdated indexed search projections return DEPENDENCY_UNAVAILABLE until the bounded operator repair completes.
      operationId: searchCatalog
      requestBody: {$ref: '#/components/requestBodies/CatalogSearch'}
      responses:
        '200': {$ref: '#/components/responses/CatalogSearch'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/catalog/explore:
    post:
      tags: [Catalog discovery]
      summary: Explore local Catalog facets
      description: Computes the requested bounded facets inside PostgreSQL over the same authorized local-release filters used by Catalog browse. Indexed and live federation results are not included in facet counts.
      operationId: exploreCatalog
      requestBody: {$ref: '#/components/requestBodies/CatalogExplore'}
      responses:
        '200': {$ref: '#/components/responses/CatalogExplore'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/audit-events:
    get:
      tags: [Catalog discovery]
      summary: Investigate authorized audit events
      description: >-
        Returns one newest-first page after applying exact tenant-scoped filters at the PostgreSQL boundary. The paired target filters must be supplied together;
        occurredFrom is inclusive and occurredBefore is exclusive. Preparing a successful page appends an audit-only access record before response bytes are returned.
      operationId: listAuditEvents
      parameters:
        - {name: actor, in: query, description: 'Exact attributed Catalog membership, service-executor, or database-login principal.', schema: {type: string, minLength: 1, maxLength: 512}}
        - {name: action, in: query, description: "Exact audit action name, such as resource.created.", schema: {type: string, minLength: 3, maxLength: 160, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}}
        - {name: requestId, in: query, description: "Exact request correlation identifier recorded on the audit event.", schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}}
        - {name: targetType, in: query, description: Exact target type; targetId is required with it., schema: {type: string, minLength: 1, maxLength: 160}}
        - {name: targetId, in: query, description: Exact target identifier; targetType is required with it., schema: {type: string, minLength: 1, maxLength: 512}}
        - {name: occurredFrom, in: query, description: Inclusive lower occurrence-time bound., schema: {type: string, format: date-time}}
        - {name: occurredBefore, in: query, description: Exclusive upper occurrence-time bound., schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/AuditEventPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/audit-exports:
    post:
      tags: [Catalog discovery]
      summary: Export one bounded deterministic audit range
      description: >-
        Returns one synchronous ascending audit slice and a self-consistency manifest from a repeatable PostgreSQL snapshot. The range is half open, aggregate overflow
        requires a narrower range, and no export object or background job is created. File verification proves structural consistency only; restored-database comparison
        additionally requires a separately trusted manifest bound to the same quiesced recovery point.
      operationId: exportAuditEvents
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/AuditExport'}
      responses:
        '200': {$ref: '#/components/responses/AuditExport'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/publication/hosts:
    get:
      tags: [Publication]
      summary: List configured publication hosts
      operationId: listPublicationHosts
      description: >-
        Requires tenant-wide publication.read permission and catalog.read when OAuth scopes are enforced.
        Returns only the current tenant's exact configured hostnames and discovery modes, sorted by hostname.
        The deployment permits at most 64 hosts, so this complete inventory is not paginated.
        Disabled hosts remain visible but cannot be used for publication. Configuration choices are not
        availability checks or discovery URLs; publication commands recheck current host and tenant authority.
      responses:
        '200':
          description: Current tenant's bounded configured host inventory, including an empty array when none exist.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationHostInventory'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/publication/snapshots:
    get:
      tags: [Publication]
      summary: List publication snapshots
      operationId: listPublicationSnapshots
      description: >-
        Returns cursor-paginated snapshot history for one exact configured discovery host in the authenticated tenant.
        The optional exact state filter applies before pagination; use state=active and limit=1 for an observed active snapshot.
        An empty page means no matching snapshot at this read.
        A cursor is bound to the selected state, host, tenant, current authorization and page size.
      parameters:
        - {$ref: '#/components/parameters/DiscoveryHost'}
        - name: state
          in: query
          description: Exact snapshot state. Omit for all states; empty, repeated and wrongly cased values are invalid.
          schema: {type: string, enum: [candidate, active, retired]}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/PublicationSnapshotPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Publication]
      summary: Build a publication snapshot candidate
      operationId: buildPublicationSnapshot
      description: Builds and returns an immutable candidate for the exact configured discovery host and its audience. The candidate is not public until activated.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PublicationTarget'}
      responses:
        '201': {$ref: '#/components/responses/PublicationSnapshotCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/publication/snapshots/{snapshotId}:
    parameters:
      - {$ref: '#/components/parameters/SnapshotId'}
      - {$ref: '#/components/parameters/DiscoveryHost'}
    get:
      tags: [Publication]
      summary: Get a publication snapshot
      operationId: getPublicationSnapshot
      description: Returns the retained snapshot, generated manifests and exclusions for the specified configured host.
      responses:
        '200': {$ref: '#/components/responses/PublicationSnapshot'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/publication/snapshots/{snapshotId}:activate:
    parameters: [{$ref: '#/components/parameters/SnapshotId'}]
    post:
      tags: [Publication]
      summary: Activate a publication snapshot
      operationId: activatePublicationSnapshot
      description: Activates an eligible candidate for its exact configured host after checking the candidate ETag and retained dependencies.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/SnapshotIfMatch'}
      requestBody: {$ref: '#/components/requestBodies/PublicationTransition'}
      responses:
        '200': {$ref: '#/components/responses/PublicationSnapshotUpdated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/publication/snapshots/{snapshotId}:rollback:
    parameters: [{$ref: '#/components/parameters/SnapshotId'}]
    post:
      tags: [Publication]
      summary: Roll back to a retained publication snapshot
      operationId: rollbackPublicationSnapshot
      description: Restores an eligible retained snapshot for its configured host after checking the retained snapshot ETag and current publication eligibility.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/SnapshotIfMatch'}
      requestBody: {$ref: '#/components/requestBodies/PublicationTransition'}
      responses:
        '200': {$ref: '#/components/responses/PublicationSnapshotUpdated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/publication:unpublish:
    post:
      tags: [Publication]
      summary: Unpublish one configured discovery host
      operationId: unpublishCatalog
      description: Removes the active discovery snapshot for the exact configured host while retaining its history. Requires an audit reason.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PublicationTransition'}
      responses:
        '200': {$ref: '#/components/responses/PublicationSnapshotUpdated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/federation/source-inspections:
    post:
      tags: [Federation]
      summary: Inspect a federation source
      operationId: inspectFederationSource
      description: Inspects an administrator-supplied source endpoint under the bounded outbound fetch policy and returns retained inspection evidence. Inspection does not connect or approve the source.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/InspectSource'}
      responses:
        '201': {$ref: '#/components/responses/FederationInspectionCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/federation/source-inspections/{inspectionId}:
    parameters: [{$ref: '#/components/parameters/InspectionId'}]
    get:
      tags: [Federation]
      summary: Get a source inspection
      description: "Returns retained inspection evidence. Governed source history keeps referenced inspections available. Worker housekeeping may reclaim an expired unreferenced inspection; subsequent reads return not found."
      operationId: getFederationSourceInspection
      responses:
        '200': {$ref: '#/components/responses/FederationInspection'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/federation/sources:
    get:
      tags: [Federation]
      summary: List federation sources
      operationId: listFederationSources
      description: >-
        Returns nonremoved configured sources in the authenticated tenant, ordered by exact display name then ID.
        Optional exact displayName and status filters apply before pagination. Duplicate names retain distinct IDs.
        Continuation binds filters, ordering, page size, tenant and current authority.
        Removed sources are unavailable here and through exact Source reads; exact retained evidence follows its separate admission.
        No peer is contacted and credential values are never returned.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: displayName
          in: query
          description: Exact stored display name. No trimming, case folding or substring matching. Omit for all names; empty or repeated values are invalid.
          schema: {type: string, minLength: 1, maxLength: 160, pattern: '^[^\x00]*$'}
        - name: status
          in: query
          description: Exact configured state. Omit for all nonremoved states; empty, repeated or removed values are invalid.
          schema: {type: string, enum: [active, paused, error]}
      responses:
        '200': {$ref: '#/components/responses/FederationSourcePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Federation]
      summary: Connect an inspected federation source
      operationId: connectFederationSource
      description: Connects a source using a completed inspection and administrator-selected scope, retrieval and update policy. Credential settings are opaque bindings, not secret values.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ConnectSource'}
      responses:
        '201': {$ref: '#/components/responses/FederationSourceCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/federation/sources/{sourceId}:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    get:
      tags: [Federation]
      summary: Get a federation source
      operationId: getFederationSource
      description: Returns the source's reviewed configuration and current ETag without exposing its credential values.
      responses:
        '200': {$ref: '#/components/responses/FederationSource'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Federation]
      summary: Update a federation source
      operationId: updateFederationSource
      description: Applies reviewed source configuration with the current ETag and any required change-preview or replacement-inspection evidence. Existing observations retain their provenance.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/UpdateSource'}
      responses:
        '200': {$ref: '#/components/responses/FederationSourceUpdated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/federation/sources/{sourceId}:remove:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    post:
      tags: [Federation]
      summary: Remove a federation source
      description: Remove a source using the current ETag, an audit reason and the digest of a matching removal preview. Observations remain historical evidence; this does not delete adopted local resources.
      operationId: removeFederationSource
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/RemoveSource'}
      responses:
        '204':
          description: Source removed and observations retained as historical evidence.
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/federation/sources/{sourceId}/change-previews:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    post:
      tags: [Federation]
      summary: Preview a federation source change
      operationId: previewFederationSourceChange
      description: Computes the impact of a proposed update or removal against the current source and observations. The returned expiring digest binds a later mutation to that exact preview.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PreviewSourceChange'}
      responses:
        '200': {$ref: '#/components/responses/FederationChangePreview'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/federation/sources/{sourceId}/snapshots:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    get:
      tags: [Federation]
      summary: List source snapshots
      operationId: listFederationSourceSnapshots
      description: Returns cursor-paginated synchronization snapshot summaries for the source. Fetch an individual snapshot to inspect its retained retrieval evidence.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/FederationSnapshotPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/federation/sources/{sourceId}:test:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    post:
      tags: [Federation]
      summary: Test a federation source
      description: >-
        Revalidates the exact endpoint with the current deployment egress policy and credential revision. Success advances the immutable source revision only when the source type, profile, and Registry endpoint remain unchanged.
        Failure does not change source configuration or approved evidence.
      operationId: testFederationSource
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/EmptyObject'}
      responses: {'200': {$ref: '#/components/responses/FederationTestResult'}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/federation/sources/{sourceId}:sync:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    post:
      tags: [Federation]
      summary: Synchronize a federation source
      operationId: syncFederationSource
      description: Queues synchronization for an eligible source using its current ETag. Follow the returned Job; acceptance does not mean synchronization has completed.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/EmptyObject'}
      responses: {'202': {$ref: '#/components/responses/SourceSyncAccepted'}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/federation/sources/{sourceId}:pause:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    post:
      tags: [Federation]
      summary: Pause a federation source
      operationId: pauseFederationSource
      description: Pauses scheduled synchronization and live participation with the current source ETag and a reason, preserving retained observations.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses: {'200': {$ref: '#/components/responses/FederationSourceUpdated'}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/federation/sources/{sourceId}:resume:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    post:
      tags: [Federation]
      summary: Resume a federation source
      operationId: resumeFederationSource
      description: Resumes an eligible paused source under its reviewed configuration with the current source ETag and a reason.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses: {'200': {$ref: '#/components/responses/FederationSourceUpdated'}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/federation/snapshots/{snapshotId}:
    parameters: [{$ref: '#/components/parameters/SnapshotId'}]
    get:
      tags: [Federation]
      summary: Get a federation source snapshot
      operationId: getFederationSourceSnapshot
      description: Returns an authorized retained source snapshot and its retrieval evidence. Partial snapshots do not acquire complete-snapshot withdrawal authority.
      responses:
        '200': {$ref: '#/components/responses/FederationSnapshot'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/federation/snapshots/{snapshotId}/comparison:
    parameters: [{$ref: '#/components/parameters/SnapshotId'}]
    get:
      tags: [Federation]
      summary: Compare retained source synchronization memberships
      operationId: compareFederationSourceSnapshots
      description: >-
        Requires current tenant source.read and, when enforced, sources.read OAuth authority.
        Compares complete occurrence-bound memberships from the same source configuration revision,
        including after source removal. No upstream requests, Jobs, writes or raw-document reads occur.
        Unique source keys are paired; duplicate keys retain separate multiple rows without an arbitrary match.
        Absent means missing from the selected membership, not proven upstream deletion. Pairwise changes
        are independent of synchronization counters and current observation freshness.
        Each input is limited to 10000 occurrences and both inputs to 32 MiB of projected text.
        SQL checks membership counts and evidence before selecting at most limit plus one result rows.
        A 400 refuses different source/revision selections or invalid continuation; 412 refuses incomplete,
        failed or over-budget membership; 503 refuses inconsistent retained evidence. No partial diff is returned.
        Cursor binds both immutable snapshot IDs, their common revision, view, page size and current authority.
      parameters:
        - name: otherSnapshotId
          in: query
          required: true
          description: Exact after snapshot. The path snapshot is the before selection; chronological order is not required.
          schema: {$ref: '#/components/schemas/UUID'}
        - name: view
          in: query
          description: Show changes only, or also include unchanged unique entries. Multiple occurrences always remain visible.
          schema: {type: string, enum: [changes, all], default: changes}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Compact historical membership comparison; raw evidence keeps its separate audited read boundary.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FederationSnapshotComparisonPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/observations:
    get:
      tags: [Federation]
      summary: List source observations
      operationId: listObservations
      description: Returns a cursor-paginated page of authorized source observations filtered by source and freshness.
      parameters:
        - name: sourceId
          in: query
          description: Restrict observations to this configured federation source.
          schema: {$ref: '#/components/schemas/UUID'}
        - name: freshness
          in: query
          description: Select current observations only or include retained non-current history.
          schema: {type: string, enum: [current, all], default: current}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/ObservationPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/observation-groups:
    get:
      tags: [Federation]
      summary: Get one exact current observation group
      description: >-
        Requires tenant-level source.read and, when scope enforcement is enabled, the sources.read OAuth scope.
        Equivalent normalized observations share a member. Exact contributions, occurrence counts and same-source conflicts remain visible.
      operationId: getObservationGroup
      parameters:
        - {name: identifier, in: query, description: "Exact normalized AIR identifier for the external resource.", required: true, schema: {type: string, pattern: '^urn:air:', maxLength: 512}}
        - {name: versionPresent, in: query, description: "Whether the external entry carries a non-empty version. A present empty version is rejected.", required: true, schema: {type: boolean}}
        - {name: version, in: query, description: "Non-empty when versionPresent is true. Omit when versionPresent is false. An empty present version is rejected.", schema: {type: string, maxLength: 128}}
      responses:
        '200': {$ref: '#/components/responses/ObservationGroup'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/observations/{observationId}/raw:
    parameters: [{$ref: '#/components/parameters/ObservationId'}]
    get:
      tags: [Federation]
      summary: Download authorized raw observation evidence
      operationId: getRawObservation
      description: Returns the exact retained observation bytes to an authorized caller. The evidence remains external-source data, not a locally approved Resource.
      responses:
        '200':
          description: Exact retained source entry.
          headers:
            Content-Digest: {$ref: '#/components/headers/ContentDigest'}
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/observations/{observationId}/occurrences:
    parameters: [{$ref: '#/components/parameters/ObservationId'}]
    get:
      tags: [Federation]
      summary: List exact snapshot occurrences for an observation
      description: Entries require complete source-revision and retrieval provenance. Unsupported upstream observations may omit normalized evidence.
      operationId: listObservationOccurrences
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/ObservationOccurrencePage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/observations/{observationId}:adopt:
    parameters: [{$ref: '#/components/parameters/ObservationId'}]
    post:
      tags: [Federation]
      summary: Adopt one exact complete observation occurrence into a new local draft
      description: >-
        Requires tenant-level source.read_evidence and resource.create in the selected namespace, including their required companion reads.
        Also requires the catalog.write OAuth scope when scope enforcement is enabled.
        The result is a private-by-default draft, not approval or publication.
      operationId: adoptObservation
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/AdoptObservation'}
      responses:
        '201': {$ref: '#/components/responses/ObservationAdopted'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/observations:search:
    post:
      tags: [Federation]
      summary: Search indexed observations
      operationId: searchObservations
      description: Searches authorized indexed observations using structured filters and pagination. Results retain source provenance and do not imply local adoption or approval.
      requestBody: {$ref: '#/components/requestBodies/ObservationSearch'}
      responses:
        '200': {$ref: '#/components/responses/ObservationSearchPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/federation/sources:live-search:
    post:
      tags: [Federation]
      summary: Diagnose approved live Registries
      description: Administrator-facing diagnostic search over already configured live sources. It cannot introduce a source and is not the ordinary unified Catalog search contract.
      operationId: liveFederatedSearch
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/LiveSearch'}
      responses:
        '200':
          description: Bounded live Registry results with per-source diagnostics.
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LiveSearchResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/federation/sources/{sourceId}/trust-assessments:
    post:
      operationId: requestTrustAssessment
      tags: [Federation]
      summary: Assess one exact approved external entry
      description: >-
        Requires current tenant source.manage, source.read_evidence and federation.discover permissions.
        The optional deployment capability and selected source policy must be enabled.
        Select indexed evidence by observationId, or live evidence by text. Live selection contacts only this source,
        before enqueue and outside an interactive transaction. Exact-byte digest, version presence, native type and
        delivery must match. A replay does not contact peers. This command does not publish, adopt or approve software.
      security: [{bearerAuth: [sources.manage]}]
      parameters:
        - {$ref: '#/components/parameters/SourceId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrustAssessmentRequest'}
            example:
              sourceRevision: 1
              identifier: urn:air:peer.example:agents:one
              versionPresent: false
              mediaType: application/a2a-agent-card+json
              delivery: url
              exactEntryDigest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              text: one
              reason: Assess the selected registration
      responses:
        '202':
          description: Durable assessment Job accepted. Success means checks completed, not that registration is valid.
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Location: {schema: {type: string}}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/federation/sources/{sourceId}/trust-assessments/{jobId}:
    get:
      operationId: getTrustAssessment
      tags: [Federation]
      summary: Read a private completed assessment and exact evidence
      description: >-
        Requires job.read and source.read_evidence in the exact tenant and source.
        Non-succeeded Jobs return INVALID_TRANSITION. Historical results remain readable after disablement,
        source removal or policy rotation. Current interpretation also checks source revision, configuration,
        authority policy and signed validity. Evidence uses base64 to preserve original bytes.
        Generic Job responses never expose this evidence. A failed private-read audit write prevents disclosure.
        Job retention controls availability, not validity.
      security: [{bearerAuth: [sources.read]}]
      parameters:
        - {$ref: '#/components/parameters/SourceId'}
        - {$ref: '#/components/parameters/JobId'}
      responses:
        '200':
          description: Private evidence and current applicability. Broad software trust, artifact integrity and rights remain not_assessed.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrustAssessmentResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/jobs:
    get:
      tags: [Jobs]
      summary: List durable Jobs
      operationId: listJobs
      description: >-
        Returns a cursor-paginated page of durable Jobs with public status and result references, never private execution payloads.
        Requires current job.read. Selection applies the actual family read permission and existing configured target before pagination:
        source.read, source.read_evidence, publication.read or operations.reindex. Unreadable families and unknown, removed or unconfigured targets
        are omitted. Exact Job reads require the actual family and target authority.
        Optional kind, state and parentJobId filters intersect before page limits. Kind matches literally, including unknown names.
        Parent filtering matches each child's retained reference without reading or requiring access to the parent.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: kind
          in: query
          description: Exact retained Job kind; unknown names return an empty authorized selection. NUL is not accepted.
          schema: {type: string, minLength: 1, maxLength: 100}
        - name: state
          in: query
          description: Exact retained Job state.
          schema: {type: string, enum: [queued, running, waiting, succeeded, failed, cancelled, dead_letter]}
        - name: parentJobId
          in: query
          description: Exact retry-parent reference on each eligible child; parent access is not required.
          schema: {$ref: '#/components/schemas/UUID'}
      responses:
        '200': {$ref: '#/components/responses/JobPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs/{jobId}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      tags: [Jobs]
      summary: Get a durable Job
      description: Returns retained operational Job state. A terminal Job can be reclaimed after the configured retention interval once it has no child Job, and then returns not found.
      operationId: getJob
      responses:
        '200': {$ref: '#/components/responses/Job'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs/{jobId}:cancel:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      tags: [Jobs]
      summary: Cancel an eligible Job
      operationId: cancelJob
      description: Requests cancellation of an eligible Job with an audit reason. Cancellation follows Job state and ownership rules; it does not undo already committed effects.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses: {'200': {$ref: '#/components/responses/JobUpdated'}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/jobs/{jobId}:retry:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      tags: [Jobs]
      summary: Retry an eligible Job
      operationId: retryJob
      description: Creates an attributable retry for an eligible Job with an audit reason. Follow the returned Job location; acceptance is not evidence of completion.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses: {'202': {$ref: '#/components/responses/JobAccepted'}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook endpoints
      operationId: listWebhooks
      description: >-
        Returns a cursor-paginated page of webhook endpoints for the authenticated tenant. Exact case-sensitive name and status filters intersect before the page limit. Names are not unique; use the existing
        exact-ID read for one endpoint. Continuations bind filters, tenant and current authorization. Signing secrets are never included.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: name, in: query, description: 'Exact saved name, case-sensitive. No surrounding whitespace.', schema: {type: string, minLength: 1, maxLength: 160}}
        - {name: status, in: query, schema: {type: string, enum: [active, disabled]}}
      responses:
        '200': {$ref: '#/components/responses/WebhookPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Webhooks]
      summary: Create a webhook endpoint
      operationId: createWebhook
      description: Creates a signed HTTPS notification endpoint and returns its signing secret once. Store the secret at the receiver; later reads do not disclose it.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateWebhook'}
      responses:
        '201': {$ref: '#/components/responses/WebhookCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/webhooks/{webhookId}:
    parameters: [{$ref: '#/components/parameters/WebhookId'}]
    get:
      tags: [Webhooks]
      summary: Get a webhook endpoint
      operationId: getWebhook
      description: Returns the webhook endpoint's configuration and current ETag without its signing secret.
      responses:
        '200': {$ref: '#/components/responses/Webhook'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Webhooks]
      summary: Update a webhook endpoint
      operationId: updateWebhook
      description: Updates endpoint settings with the current ETag. Destination and subscription changes remain subject to webhook admission policy.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/PatchWebhook'}
      responses:
        '200': {$ref: '#/components/responses/WebhookUpdated'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Webhooks]
      summary: Disable a webhook endpoint
      operationId: disableWebhook
      description: Disables the endpoint using its current ETag without a request body. Retained delivery evidence is not deleted.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '204':
          description: Webhook disabled; delivery evidence is retained.
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/webhooks/{webhookId}:rotate-secret:
    parameters: [{$ref: '#/components/parameters/WebhookId'}]
    post:
      tags: [Webhooks]
      summary: Rotate a webhook signing secret
      operationId: rotateWebhookSecret
      description: Rotates signing material using the current endpoint ETag and returns the new secret once. Distribute it to the receiver before retiring any permitted overlap.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: false
        description: Omit the body for normal overlap, or set revokePrevious to revoke previous signing material immediately.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                revokePrevious: {type: boolean, default: false, description: 'Omit the normal 15-minute overlap and revoke all previous signing secrets. In-flight requests cannot be recalled; update the receiver immediately.'}
      responses:
        '200': {$ref: '#/components/responses/WebhookSecretRotated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/webhooks/reconciliation:
    get:
      tags: [Webhooks]
      summary: Read tenant webhook reconciliation state
      operationId: getWebhookReconciliation
      description: >-
        Requires current tenant-wide webhook.read_evidence permission and the webhooks.manage OAuth scope when scope enforcement is enabled. Returns coalesced notification loss counters.
        Compare both counters with the receiver checkpoint and refresh current authorized Catalog state after a change, restore, or disabled interval.
        Capacity loss counts public events; delivery loss counts terminal recipient failures, including retry exhaustion but excluding synthetic tests. Counters are not reset and do not promise historical replay.
        Pending events include claimed and deferred work and are capped at pendingEventLimit; equality means at least that many. Disabled webhooks omit this route.
      responses:
        '200':
          description: Bounded tenant notification state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookReconciliation'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/webhooks/{webhookId}:test:
    parameters: [{$ref: '#/components/parameters/WebhookId'}]
    post:
      tags: [Webhooks]
      summary: Send a test webhook event
      description: >-
        At most one synchronous test operation is admitted per API process. A competing authorized current-revision request returns 503 with code WEBHOOK_TEST_BUSY without sending or retaining delivery evidence.
        An admitted test makes one attempt, ignores subscriptions and returns 200 with delivery evidence even when the receiver returns 503. It does not prove worker delivery or receiver processing. A failure
        after sending may leave acceptance uncertain even without a committed delivery row. Other 503 responses do not prove that no request was sent. This is a concurrency bound, not a rate limit. An explicit
        later attempt uses a new Idempotency-Key because command failures may be replayed.
      operationId: testWebhook
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/EmptyObject'}
      responses:
        '200': {$ref: '#/components/responses/WebhookTestDelivery'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/webhooks/{webhookId}/deliveries:
    parameters: [{$ref: '#/components/parameters/WebhookId'}]
    get:
      tags: [Webhooks]
      summary: List webhook deliveries
      operationId: listWebhookDeliveries
      description: >-
        Returns cursor-paginated delivery evidence for the endpoint. Exact deliveryId, eventId and state filters intersect before the page limit. Continuations bind these filters, endpoint, tenant and current
        authorization. Each row is the latest retained endpoint/event outcome, not a history of all external sends. Mutable outcomes can move between pages; refresh from the first page to reconcile, and account
        for retention gaps. The returned page and required private-read audit commit atomically. Delivery status is separate from the originating Catalog transaction and does not disclose signing secrets or
        receiver bodies.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: deliveryId, in: query, schema: {type: string, format: uuid}}
        - {name: eventId, in: query, schema: {type: string, format: uuid}}
        - {name: state, in: query, schema: {type: string, enum: [pending, succeeded, waiting, dead_letter]}}
      responses:
        '200': {$ref: '#/components/responses/WebhookDeliveryPage'}
        default: {$ref: '#/components/responses/Problem'}
  /.well-known/ard.json:
    get:
      tags: [Discovery]
      summary: Get the active ARD manifest
      description: The exact request host selects one configured tenant and disabled, anonymous, or bearer-authenticated discovery mode. Unknown, disabled, and inactive hosts return 404.
      operationId: getARDManifest
      security:
        - {}
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/IfNoneMatch'}
        - {$ref: '#/components/parameters/IfModifiedSince'}
      responses:
        '200': {$ref: '#/components/responses/ARDManifest'}
        '304': {$ref: '#/components/responses/NotModified'}
        '401': {$ref: '#/components/responses/ARDError'}
        '403': {$ref: '#/components/responses/ARDError'}
        '404': {$ref: '#/components/responses/ARDError'}
        '503': {$ref: '#/components/responses/ARDError'}
  /.well-known/ai-catalog.json:
    get:
      tags: [Discovery]
      summary: Get the active AI Catalog document
      description: The exact request host selects one configured tenant and disabled, anonymous, or bearer-authenticated discovery mode. Unknown, disabled, and inactive hosts return 404.
      operationId: getAICatalog
      security:
        - {}
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/IfNoneMatch'}
        - {$ref: '#/components/parameters/IfModifiedSince'}
      responses:
        '200': {$ref: '#/components/responses/AICatalog'}
        '304': {$ref: '#/components/responses/NotModified'}
        '401': {$ref: '#/components/responses/ARDError'}
        '403': {$ref: '#/components/responses/ARDError'}
        '404': {$ref: '#/components/responses/ARDError'}
        '503': {$ref: '#/components/responses/ARDError'}
  /ard/v1/search:
    post:
      tags: [Discovery]
      summary: Search the host-selected ARD Registry
      description: >-
        Authentication is required only when the exact configured discovery host uses authenticated mode. Omitted federation means auto.
        Core auto Search merges the active local snapshot with up to 50 live candidates from administrator-approved sources.
        Signed continuations repeat bounded peer traversal while live candidates remain, and bind the unchanged window, snapshot, query, caller and host audience.
        The initial 15-minute expiry does not extend. A changed window or snapshot requires a restart; a temporary replay failure permits retry of the same token.
        Unsafe first-page traversal preserves healthy results with durable-only continuation. Hybrid Search returns the durable ranking before a distinct live tail;
        none and referrals modes continue local results only. A partial live stage is reported through Server-Timing without adding non-ARD members to the response.
      operationId: searchARDRegistry
      security:
        - {}
        - bearerAuth: []
      requestBody: {$ref: '#/components/requestBodies/ARDSearch'}
      responses:
        '200': {$ref: '#/components/responses/ARDSearch'}
        default: {$ref: '#/components/responses/ARDError'}
  /ard/v1/explore:
    post:
      tags: [Discovery]
      summary: Explore host-selected ARD Registry facets
      description: Authentication is required only when the exact configured discovery host uses authenticated mode.
      operationId: exploreARDRegistry
      security:
        - {}
        - bearerAuth: []
      requestBody: {$ref: '#/components/requestBodies/ARDExplore'}
      responses:
        '200': {$ref: '#/components/responses/ARDExplore'}
        default: {$ref: '#/components/responses/ARDError'}
  /ard/v1/agents:
    get:
      tags: [Discovery]
      summary: List host-selected ARD Registry entries
      description: Authentication is required only when the exact configured discovery host uses authenticated mode.
      operationId: listARDRegistryEntries
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          description: >-
            Allowlisted ARD List expression using displayName equality, comma-separated type or publisherId equality,
            and createdAfter or updatedAfter greater-than comparisons joined by AND. createdAfter uses the Registry-local
            release activation time, while updatedAfter uses the effective entry update time.
          schema: {type: string}
        - name: orderBy
          in: query
          description: displayName or updatedAt with optional DESC.
          schema: {type: string}
        - name: pageSize
          in: query
          description: Maximum entries in one List response; keep this value unchanged when continuing.
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: pageToken
          in: query
          description: Opaque continuation token from the preceding List response for this exact host, audience, generation and page size.
          schema: {type: string}
      responses:
        '200': {$ref: '#/components/responses/ARDList'}
        default: {$ref: '#/components/responses/ARDError'}
  /public/v1/artifacts/{artifactId}:
    parameters: [{$ref: '#/components/parameters/ArtifactId'}]
    get:
      tags: [Discovery]
      summary: Download a bounded document allowlisted by the host's active snapshot
      description: >-
        Only an exact PostgreSQL content identifier allowlisted by the active immutable publication snapshot is served.
      operationId: getPublicArtifact
      security:
        - {}
        - bearerAuth: []
      parameters: [{$ref: '#/components/parameters/IfNoneMatch'}]
      responses:
        '200':
          description: Bounded Catalog document referenced by the active immutable snapshot.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Content-Digest: {$ref: '#/components/headers/ContentDigest'}
            Content-Length: {$ref: '#/components/headers/ContentLength'}
            Content-Disposition: {$ref: '#/components/headers/ContentDisposition'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            '*/*':
              schema: {type: string, format: binary}
        '304': {$ref: '#/components/responses/ArtifactNotModified'}
        default: {$ref: '#/components/responses/ARDError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Scopes one mutating command to its authenticated tenant, actor, route, request, and current authorization. An identical completed retry returns the retained response with Idempotency-Replayed,
        while an active or interrupted pending command fails closed with Retry-After. A response completed by the current command protocol has a fixed 24-hour replay window measured from the original reservation.
        After that window the key may be reclaimed or reused as a new command. Pending reservations do not become safe to discard merely because that window elapsed.
      schema: {type: string, minLength: 1, maxLength: 200}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact revision ETag from the current target record; a stale or missing value prevents the command from changing it.
      schema: {type: string, pattern: '^"rev-[1-9][0-9]*"$'}
    SnapshotIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact ETag returned by the selected publication snapshot read.
      schema: {type: string}
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Previously received document ETag for a conditional read; a matching current representation returns 304 without a body.
      schema: {type: string}
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      required: false
      description: HTTP date for a conditional discovery read; If-None-Match takes precedence when both headers are supplied.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Maximum items in one page. Follow nextCursor with the same page size and filters to continue.
      schema: {type: integer, minimum: 1, maximum: 100}
    Cursor:
      name: cursor
      in: query
      description: Opaque, expiring cursor bound to the authenticated principal, current permissions, filters, ordering, parent resource, and page size.
      schema: {type: string, maxLength: 2048}
    Domain:
      name: domain
      in: path
      required: true
      description: Exact declared publisher domain. DNS verification rejects IP literals, wildcards and names that exceed the DNS limit after adding its challenge prefix.
      schema: {type: string, format: hostname}
    DiscoveryHost:
      name: host
      in: query
      required: true
      description: Exact configured discovery hostname or IP address whose isolated snapshot is being administered.
      schema: {type: string, minLength: 1, maxLength: 253}
    MembershipId:
      name: membershipId
      in: path
      required: true
      description: Catalog-owned membership identifier from a membership read or role grant.
      schema: {$ref: '#/components/schemas/UUID'}
    NamespaceId:
      name: namespaceId
      in: path
      required: true
      description: Namespace identifier, not its stable slug.
      schema: {$ref: '#/components/schemas/UUID'}
    RoleAssignmentId:
      name: assignmentId
      in: path
      required: true
      description: Role assignment identifier returned by a grant or assignment list.
      schema: {$ref: '#/components/schemas/UUID'}
    PublisherId:
      name: publisherId
      in: path
      required: true
      description: Publisher identity identifier, not a domain name.
      schema: {$ref: '#/components/schemas/UUID'}
    ResourceId:
      name: resourceId
      in: path
      required: true
      description: Stable local Resource identifier, not its canonical AIR identifier.
      schema: {$ref: '#/components/schemas/UUID'}
    VersionId:
      name: versionId
      in: path
      required: true
      description: Resource version identifier, not the version label.
      schema: {$ref: '#/components/schemas/UUID'}
    RevisionId:
      name: revisionId
      in: path
      required: true
      description: Immutable version or listing revision identifier for the selected route.
      schema: {$ref: '#/components/schemas/UUID'}
    ListingId:
      name: listingId
      in: path
      required: true
      description: Catalog listing identifier, not its immutable revision identifier.
      schema: {$ref: '#/components/schemas/UUID'}
    SubmissionId:
      name: submissionId
      in: path
      required: true
      description: Review submission identifier.
      schema: {$ref: '#/components/schemas/UUID'}
    ReleaseId:
      name: releaseId
      in: path
      required: true
      description: Listing release identifier.
      schema: {$ref: '#/components/schemas/UUID'}
    ArtifactId:
      name: artifactId
      in: path
      required: true
      description: Lower-case SHA-256 document digest without the algorithm prefix; the artifact parameter name is retained for v1 compatibility.
      schema: {type: string, pattern: '^[0-9a-f]{64}$', minLength: 64, maxLength: 64}
    CatalogRecordId:
      name: catalogRecordId
      in: path
      required: true
      description: Governed record identifier returned by Catalog browse or Search.
      schema: {$ref: '#/components/schemas/UUID'}
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      description: Publication or source snapshot identifier for the selected route.
      schema: {$ref: '#/components/schemas/UUID'}
    InspectionId:
      name: inspectionId
      in: path
      required: true
      description: Retained federation source inspection identifier.
      schema: {$ref: '#/components/schemas/UUID'}
    SourceId:
      name: sourceId
      in: path
      required: true
      description: Administrator-configured federation source identifier.
      schema: {$ref: '#/components/schemas/UUID'}
    ObservationId:
      name: observationId
      in: path
      required: true
      description: Retained external-source observation identifier.
      schema: {$ref: '#/components/schemas/UUID'}
    JobId:
      name: jobId
      in: path
      required: true
      description: Durable Job identifier returned by an asynchronous command.
      schema: {$ref: '#/components/schemas/UUID'}
    WebhookId:
      name: webhookId
      in: path
      required: true
      description: Webhook endpoint identifier.
      schema: {$ref: '#/components/schemas/UUID'}
  headers:
    ETag:
      description: Opaque representation or revision tag. Use the target operation's If-Match or If-None-Match contract rather than constructing a tag.
      schema: {type: string}
    ContentDigest:
      description: SHA-256 digest of the returned document bytes, encoded using the Content-Digest structured field syntax.
      schema: {type: string, pattern: '^sha-256=:[A-Za-z0-9+/]+=*:$'}
    ContentLength:
      description: Length of the returned document in bytes.
      schema: {type: string, pattern: '^[0-9]+$'}
    ContentDisposition:
      description: Download disposition and safe filename for the returned document.
      schema: {type: string}
    LastModified:
      description: HTTP date representing the returned discovery document's last modification time.
      schema: {type: string}
    Link:
      description: Discovery links and relation types advertised for this configured host.
      schema: {type: string}
    CacheControl:
      description: Cache policy for the authorized representation; private evidence is not a public cache entry.
      schema: {type: string}
    RequestId:
      description: Request correlation identifier for diagnostics; it is not an idempotency key.
      schema: {type: string}
    IdempotencyReplayed:
      description: Present with value true when this attempt returns a retained idempotent response.
      schema: {type: string, enum: ['true']}
    RetryAfter:
      description: Whole seconds before retrying a pending idempotent command.
      schema: {type: string, pattern: '^[0-9]+$'}
  requestBodies:
    EmptyObject:
      required: false
      description: No command inputs are needed; omit the body or send an empty JSON object.
      content:
        application/json:
          schema: {type: object, additionalProperties: false}
          example: {}
    Reason:
      required: true
      description: A nonblank audit reason for the lifecycle transition.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Reason'}
    AuditExport:
      required: true
      description: Inclusive occurredFrom and exclusive occurredBefore timestamps, optional audit filters and the reason for exporting the authenticated tenant's records.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuditExportRequest'}
    GrantRole:
      required: true
      description: The subject, actor type, role, optional namespace and audit reason for a grant in the caller's identity realm.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/GrantRole'}
    PublicationTarget:
      required: true
      description: The exact configured discovery host for candidate generation; its audience comes from deployment configuration.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublicationTarget'}
    PublicationTransition:
      required: true
      description: The exact configured discovery host and audit reason for activation, rollback or unpublication.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublicationTransition'}
    CreateNamespace:
      required: true
      description: A stable namespace slug and its initial display metadata.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateNamespace'}
    PatchNamespace:
      required: true
      description: Namespace display fields to change and the audit reason; omitted fields remain unchanged.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PatchNamespace'}
    CreatePublisher:
      required: true
      description: The publisher's display name and declared domain set; publication-domain approval is a separate command.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreatePublisher'}
    PatchPublisher:
      required: true
      description: Publisher metadata to change and the audit reason. A supplied domains array replaces the complete declared-domain set.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PatchPublisher'}
    CreateResource:
      required: true
      description: The owning namespace, resource kind and canonical identity for a new local Resource.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateResource'}
    CreateVersion:
      required: true
      description: A version label and the representations used to create its initial immutable revision.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateVersion'}
    CreateRevision:
      required: true
      description: The complete representation set for a new immutable version revision; it does not patch an earlier revision.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [representations]
            properties:
              representations:
                type: array
                minItems: 1
                maxItems: 16
                items: {$ref: '#/components/schemas/RepresentationInput'}
    CreateListing:
      required: true
      description: The namespace and local Resource to which the new listing belongs.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateListing'}
    CreateListingRevision:
      required: true
      description: The version revision, publisher, presentation and visibility metadata for a new immutable listing revision.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateListingRevision'}
    PublishListing:
      required: true
      description: The approved review submission to publish as a governed release.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublishListing'}
    ReleaseTransition:
      required: true
      description: An audit reason with optional replacement guidance for deprecation or a required replacement for supersession. Retirement and revocation reject replacementId.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ReleaseTransition'}
    CatalogSearch:
      required: true
      description: Search text, kind, tag, publisher and visibility filters, page size and continuation state for authorized discovery. Source topology remains administrator-configured.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CatalogSearch'}
    CatalogExplore:
      required: true
      description: The search context and requested facets to aggregate over authorized catalog records.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CatalogExplore'}
    InspectSource:
      required: true
      description: The candidate endpoint and administrator-selected inspection inputs, including opaque policy and credential bindings where required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/InspectSource'}
    ConnectSource:
      required: true
      description: The retained inspection, reviewed source settings, scope and reason for connecting a source.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ConnectSource'}
    PreviewSourceChange:
      required: true
      description: The update or removal intent and proposed settings to evaluate against the source's current revision and observations.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PreviewSourceChange'}
    UpdateSource:
      required: true
      description: The source settings and reason to apply, together with required change-preview and inspection bindings.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UpdateSource'}
    RemoveSource:
      description: Replace the illustrative digest with the digest returned by a current change preview whose intent is remove.
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RemoveSource'}
          example:
            changePreviewDigest: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            reason: Retire this federation source
    ObservationSearch:
      required: true
      description: Structured observation filters and continuation state for the authorized indexed observation inventory.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ObservationSearch'}
    AdoptObservation:
      required: true
      description: The target namespace and local authoring inputs for explicit adoption of a retained observation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdoptObservation'}
    LiveSearch:
      required: true
      description: A reason-bearing diagnostic query over eligible configured sources, optionally restricted by sourceIds. Source selection remains subject to deployment fan-out and source policy; it cannot add endpoints.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LiveSearch'}
    CreateWebhook:
      required: true
      description: An endpoint name, HTTPS receiver URL and subscribed event types.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateWebhook'}
    PatchWebhook:
      required: true
      description: Endpoint fields to change; omitted fields remain unchanged and a supplied eventTypes array replaces the subscription list.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PatchWebhook'}
    ARDSearch:
      required: true
      description: The pinned ARD query, optional mode and pagination inputs within this configured discovery host's approved topology.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ARDSearch'}
    ARDExplore:
      required: true
      description: The pinned ARD filter context and requested facet result type for the configured discovery host.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ARDExplore'}
  responses:
    MCPReply:
      description: Finite MCP JSON-RPC response. A tool refusal can use isError inside an HTTP 200 result.
      headers:
        X-Request-ID: {schema: {type: string}, description: Correlation identifier.}
        Cache-Control: {schema: {type: string, const: no-store}, description: Private results are never cacheable.}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MCPReply'}
    MCPError:
      description: Safe protocol or transport refusal. Authentication challenges accompany 401 and insufficient-scope 403. A disabled route uses the normal route-not-found problem instead.
      headers:
        X-Request-ID: {schema: {type: string}, description: Correlation identifier.}
        WWW-Authenticate: {schema: {type: string}, description: Bearer challenge; OIDC identifies the configured resource metadata URL.}
        Allow: {schema: {type: string}, description: Allowed methods on a 405 response.}
        Retry-After: {schema: {type: string}, description: Retry guidance when the concurrency gate is full.}
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MCPReply'}
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Status:
      description: Service status.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status]
            properties: {status: {type: string}}
    Capabilities:
      description: Currently wired and directly observable Catalog capabilities.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Capabilities'}
    Membership:
      description: Catalog-owned tenant membership.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Membership'}
    MembershipPage:
      description: Bounded tenant membership page ordered by subject and stable identifier.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MembershipPage'}
    MembershipLifecycle:
      description: Updated membership and the grants atomically revoked by this transition.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MembershipLifecycleResult'}
    Namespace:
      description: Stable namespace identity and mutable metadata.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Namespace'}
    RoleAssignmentPage:
      description: Catalog-owned role assignments for the authenticated tenant.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/RoleAssignment'}}
              nextCursor: {type: string, maxLength: 2048}
    RoleAssignmentCreated:
      description: Catalog role assignment granted.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        Location: {schema: {type: string}}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RoleAssignment'}
    RoleAssignmentUpdated:
      description: Catalog role assignment revoked.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RoleAssignment'}
    Publisher:
      description: Publisher identity and publication-domain approval state.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Publisher'}
    PublisherPage:
      description: Deterministic publisher collection.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublisherPage'}
    PublisherCreated:
      description: Publisher created.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        Location: {schema: {type: string}}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Publisher'}
    PublisherUpdated:
      description: Publisher publication-domain approval updated.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Publisher'}
    PublicationDomainRevoked:
      description: Publication-domain approval revoked and affected discovery hosts withdrawn.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublicationDomainRevocation'}
    VersionEvidenceCreated:
      description: Resource version or immutable revision created with current validation evidence.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        Location: {schema: {type: string}}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VersionEvidenceEnvelope'}
    RevisionEvidence:
      description: Immutable version revision and its projected validation evidence.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RevisionEvidenceEnvelope'}
    ValidationEvidenceCreated:
      description: New immutable validation evidence recorded for the unchanged version revision.
      headers:
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        Location: {schema: {type: string}}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RevisionEvidenceEnvelope'}
    CatalogRecord:
      description: Complete governed Catalog release, including typed representation package inventory and handoff metadata.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CatalogRecord'}
    CatalogRecordPage:
      description: "Deterministic page of bounded governed Catalog release summaries. Read the complete record through the authorized detail endpoint."
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CatalogRecordPage'}
    CatalogSearch:
      description: Bounded unified Catalog search response. durableTotal excludes transient live results; liveCount counts live results returned on this page.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CatalogSearchResponse'}
    CatalogExplore:
      description: Bounded local Catalog facet response.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CatalogExploreResponse'}
    FederationInspectionCreated:
      description: Bounded source inspection created with exact connectivity-policy evidence.
      headers:
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        Location: {schema: {type: string}}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FederationSourceInspection'}
    FederationInspection:
      description: "Bounded source inspection retained while referenced by governed source history or until housekeeping reclaims an expired unreferenced inspection."
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FederationSourceInspection'}
    FederationSourceCreated:
      description: Administrator-owned source topology created from the exact inspection.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        Location: {schema: {type: string}}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FederationSource'}
    FederationSourceUpdated:
      description: Federation source configuration or status updated as a new immutable revision.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FederationSource'}
    FederationSource:
      description: Current administrator-owned federation source revision.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
