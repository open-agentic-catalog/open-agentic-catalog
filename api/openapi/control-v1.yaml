    EvidenceSet:
      type: object
      additionalProperties: false
      required: [id, tenantId, subjectDigest, digest, state, validationProfile, policyVersion, legalRights, trust, createdAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenantId: {$ref: '#/components/schemas/UUID'}
        subjectDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        state: {type: string, enum: [complete, blocked]}
        findings: {type: array, items: {$ref: '#/components/schemas/Finding'}}
        validationProfile: {type: string, minLength: 1}
        policyVersion: {type: string, minLength: 1}
        legalRights: {$ref: '#/components/schemas/LegalRightsSummary'}
        trust: {$ref: '#/components/schemas/TrustSummary'}
        externalRetrievals:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/ExternalRetrieval'}
          description: Present only for bounded anonymous HTTPS responses observed by this validation run. Response bodies remain in the tenant-scoped exact document binding, not in this metadata.
        expiresAt:
          type: string
          format: date-time
          description: "Present only when the evidence depends on a subject that can change with time. Deterministic structural validation over immutable bytes does not expire."
        createdAt: {type: string, format: date-time}
      examples:
        - id: '00000000-0000-7000-8000-000000000021'
          tenantId: '00000000-0000-7000-8000-000000000001'
          subjectDigest: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          digest: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          state: complete
          validationProfile: catalog-validation-v7
          policyVersion: catalog-policy-v1
          legalRights: {state: not_assessed}
          trust: {state: not_assessed}
          createdAt: '2026-08-30T10:00:00Z'
    ExternalRetrieval:
      type: object
      additionalProperties: false
      required: [representationId, requestedUrl, finalUrl, status, mediaType, contentDigest, size, policyId, policyRevision, policyDigest, retrievedAt, expiresAt]
      properties:
        representationId: {$ref: '#/components/schemas/UUID'}
        requestedUrl: {type: string, format: uri, pattern: '^[hH][tT][tT][pP][sS]://', maxLength: 2048}
        finalUrl: {type: string, format: uri, pattern: '^[hH][tT][tT][pP][sS]://', maxLength: 2048, description: Final same-origin HTTPS URL after bounded redirect handling.}
        status: {type: integer, minimum: 200, maximum: 599}
        mediaType: {type: string, minLength: 1, maxLength: 255, description: Lower-case response media type without parameters.}
        contentDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$', description: SHA-256 of the exact decoded response bytes.}
        size: {type: integer, format: int64, minimum: 0, maximum: 16777216}
        policyId: {type: string, pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$', maxLength: 63}
        policyRevision: {type: integer, format: int64, minimum: 1}
        policyDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        retrievedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: Fixed v1 retrieval-evidence expiry exactly 24 hours after retrievedAt.}
    PackageAssessmentState:
      type: string
      enum: [not_assessed, passed, failed, unavailable]
    SkillPackageAssessments:
      type: object
      additionalProperties: false
      required: [malware, secrets, license, sbom, provenance]
