      type: object
      additionalProperties: true
      required: [jsonrpc, id]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id: {oneOf: [{type: string}, {type: number}, {type: 'null'}], description: 'Original call identifier, or null for unbound errors.'}
        result: {description: 'MCP discovery, tool inventory, handshake, ping or tool result, selected by the method and protocol version.'}
        error: {$ref: '#/components/schemas/MCPProtocolError'}
      oneOf:
        - required: [result]
        - required: [error]
