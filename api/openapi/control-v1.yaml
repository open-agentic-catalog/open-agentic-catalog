    ARDSearch:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: object
          additionalProperties: false
          required: [text]
          properties:
            '@context':
              description: Inline JSON-LD context for filter aliases. The pinned ARD base context is always applied; a context needed to resolve a requested term must resolve locally. Public requests cannot download new contexts.
              oneOf:
                - {type: string, format: uri}
                - {type: object, additionalProperties: true}
                - {type: array, items: {}}
            text: {type: string, minLength: 1, maxLength: 500}
            filter:
              description: >-
                Exact declared values, with OR within each key and AND across keys. Supports core fields, publisher, one-level scalar
                metadata (including metadata.license) and http://purl.org/dc/terms/subject. Equivalent full IRIs and inline aliases select
                the same field. Also supports A2A data.skills.id, data.skills.tags, data.defaultInputModes, data.defaultOutputModes,
                data.capabilities.streaming, data.supportedInterfaces.protocolBinding, data.supportedInterfaces.protocolVersion and MCP Server Card data.remotes.type,
                data.remotes.supportedProtocolVersions. Native paths require the matching declared media type and inline data; streaming
                values are the strings "true" or "false". Literal native members are not JSON-LD aliases. Distinct values count once per
                entry; different path constraints can match different array elements. Card defaults do not resolve per-skill mode overrides.
                Native skill tags are separate from top-level Listing tags. No artifacts are fetched. Unsupported paths
                return 400. Local entries must match; sparse live results may omit optional fields but cannot contradict disclosed filters.
              type: object
              maxProperties: 20
              additionalProperties:
                oneOf:
                  - {type: string, minLength: 1, maxLength: 512}
                  - {type: array, minItems: 1, maxItems: 100, items: {type: string, minLength: 1, maxLength: 512}}
        federation:
          type: string
          enum: [none, referrals, auto]
          default: auto
          description: >-
            ARD execution mode within the administrator-approved sources for this discovery host and audience. It
            cannot select, add, or broaden a source. Core auto continuation can replay an unchanged bounded live
            window. Hybrid auto Search preserves the durable order before a distinct live tail.
        pageSize: {type: integer, minimum: 1, maximum: 100, default: 10}
        pageToken:
          type: string
          maxLength: 4096
          description: Opaque signed token issued for the exact host, tenant, audience, snapshot generation, normalized query, filters, page size, and mode.
    ARDExplore:
      type: object
      additionalProperties: false
      required: [resultType]
      properties:
        query:
          type: object
          additionalProperties: false
          properties:
            '@context':
              description: Inline JSON-LD context for filter and facet aliases. The pinned ARD base context is always applied; a context needed to resolve a requested term must resolve locally. Public requests cannot download new contexts.
              oneOf:
                - {type: string, format: uri}
                - {type: object, additionalProperties: true}
                - {type: array, items: {}}
            text: {type: string, maxLength: 500}
            filter:
              description: >-
                Exact declared values, with OR within each key and AND across keys. Supports core fields, publisher, one-level scalar
                metadata (including metadata.license) and http://purl.org/dc/terms/subject. Equivalent full IRIs and inline aliases select
                the same field. Also supports A2A data.skills.id, data.skills.tags, data.defaultInputModes, data.defaultOutputModes,
                data.capabilities.streaming, data.supportedInterfaces.protocolBinding, data.supportedInterfaces.protocolVersion and MCP Server Card data.remotes.type,
                data.remotes.supportedProtocolVersions. Native paths require the matching declared media type and inline data; streaming
                values are the strings "true" or "false". Literal native members are not JSON-LD aliases. Distinct values count once per
                entry; different path constraints can match different array elements. Card defaults do not resolve per-skill mode overrides.
                Native skill tags are separate from top-level Listing tags. No artifacts are fetched. Unsupported paths
                return 400. Local entries must match; sparse live results may omit optional fields but cannot contradict disclosed filters.
              type: object
              maxProperties: 20
              additionalProperties:
                oneOf:
                  - {type: string, minLength: 1, maxLength: 512}
                  - {type: array, minItems: 1, maxItems: 100, items: {type: string, minLength: 1, maxLength: 512}}
        resultType:
          type: object
          additionalProperties: false
          required: [facets]
          properties:
            facets:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                required: [field]
                properties:
                  field:
                    type: string
                    minLength: 1
                    maxLength: 256
                    description: >-
                      Supported filter field, full IRI or inline alias. Topic and native-card buckets count each distinct value once per
                      matched local entry; license buckets compare exact compact declarations. Native paths use the same allowlist and
                      media-type gates as filters.
                  limit: {type: integer, minimum: 1, maximum: 100, default: 20}
                  minCount: {type: integer, minimum: 0, default: 1}
    ARDEntry:
      type: object
      required: [identifier, displayName, type]
      properties:
        '@context': {}
        '@id': {type: string}
        identifier: {type: string, pattern: '^urn:air:'}
        displayName: {type: string}
        type: {type: string}
        url: {type: string, format: uri}
        data: {type: object, additionalProperties: true}
