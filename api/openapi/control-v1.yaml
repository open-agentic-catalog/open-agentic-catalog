  /api/v1/federation/sources/{sourceId}/artwork:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags:
        - Federation
      summary: Get a local consumer artwork override
      operationId: getArtworkOverride
      description: Requires source.read and sources.read when OAuth scopes are enforced. Returns the retained override head
        for an exact source authority and entry. Does not require or accept a live receipt in the URL. Missing heads return
        NOT_FOUND.
      parameters:
        - name: presentationGeneration
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: identifier
          in: query
          required: true
          schema:
            type: string
            pattern: '^urn:air:'
            minLength: 1
            maxLength: 512
        - name: versionPresent
          in: query
          required: true
          schema:
            type: boolean
        - name: version
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: kind
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ResourceKind'
      responses:
        '200':
          description: Current bounded result.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkOverride'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
        - Federation
      summary: Set a local consumer artwork override
      operationId: setArtworkOverride
      description: Requires source.manage and sources.manage when OAuth scopes are enforced. Validates replacement image facts
        before the mutation transaction. Initial creation omits If-Match; changes require the current head ETag. Live target
        admission requires a signed receipt in the body. Both inherit modes explicitly reset presentation; publisher evidence
        is unchanged.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
            minLength: 1
          description: Current override ETag, required for an existing head and omitted for initial creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetArtworkOverride'
      responses:
        '200':
          description: Current bounded result.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkOverride'
        default:
          $ref: '#/components/responses/Problem'
