      type: object
      additionalProperties: false
      required: [encodingProfile, tenantId, filters, cutoff, rowCount, eventsDigest, generatedAt]
      properties:
        encodingProfile: {type: string, const: open-agentic-catalog-audit-export-v1}
        tenantId: {$ref: '#/components/schemas/UUID'}
        filters: {$ref: '#/components/schemas/AuditExportFilters'}
        cutoff: {type: string, format: date-time}
