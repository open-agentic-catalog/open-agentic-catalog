        requestId: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}
        targetType: {type: string, minLength: 1, maxLength: 160}
        targetId: {type: string, minLength: 1, maxLength: 512}
        occurredFrom: {type: string, format: date-time}
        occurredBefore: {type: string, format: date-time}
      dependentRequired:
        targetType: [targetId]
        targetId: [targetType]
