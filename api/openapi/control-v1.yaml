      properties:
        path: {type: string, minLength: 3, maxLength: 1024, description: Normalized relative path including the Agent Skill root directory.}
        size: {type: integer, format: int64, minimum: 0, maximum: 16777216}
        mediaType: {type: string, minLength: 1, maxLength: 255}
        digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
