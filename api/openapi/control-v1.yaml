      tags: [Feedback]
      summary: Submit private item feedback
      operationId: createFeedback
      description: >-
        Requires active human membership with feedback.own and feedback.write scope when enforced, plus resource.read in the selected namespace for a new submission.
        Derives submitter identity and exact release context. All four local kinds qualify; indexed/live observations do not. Text is limited to 4000 Unicode characters and bodies to 64 KiB. Eight concurrent writes per API
        process are admitted; busy attempts return 503 and can be retried. This is not a shared quota.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackCreate'}
      responses:
        '201':
          description: "Original command receipt without private text. Read current state separately with GET."
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            ETag: {schema: {type: string}, description: Individual feedback revision when applicable.}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackReceipt'}
        default: {$ref: '#/components/responses/Problem'}
