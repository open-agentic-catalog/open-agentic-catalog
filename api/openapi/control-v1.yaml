        malware: {$ref: '#/components/schemas/PackageAssessmentState'}
        secrets: {$ref: '#/components/schemas/PackageAssessmentState'}
        license: {$ref: '#/components/schemas/PackageAssessmentState'}
        sbom: {$ref: '#/components/schemas/PackageAssessmentState'}
