        eventsDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        generatedAt: {type: string, format: date-time}
      dependentRequired:
        first: [last]
        last: [first]
      allOf:
        - if: {properties: {rowCount: {const: 0}}, required: [rowCount]}
          then: {not: {anyOf: [{required: [first]}, {required: [last]}]}}
          else: {required: [first, last]}
