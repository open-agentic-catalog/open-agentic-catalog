        tenantId: {$ref: '#/components/schemas/UUID'}
        listingId: {$ref: '#/components/schemas/UUID'}
        submissionId: {$ref: '#/components/schemas/UUID'}
        versionRevisionId: {$ref: '#/components/schemas/UUID'}
        listingRevisionId: {$ref: '#/components/schemas/UUID'}
        state: {type: string, enum: [published, deprecated, retired, superseded, revoked]}
        replacementReleaseId: {$ref: '#/components/schemas/UUID'}
        dispositionReason: {type: string, maxLength: 2000}
        sunsetAt: {type: string, format: date-time}
        activatedBy: {type: string, minLength: 1}
        revision: {type: integer, format: int64, minimum: 1}
        activatedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AdoptionProvenance:
      type: object
      additionalProperties: false
      required: [observationId, sourceId, sourceRevision, snapshotId, retrievalDigest, entryLocation, exactEntryDigest, normalizedEntryDigest, normalizationProfile, adoptedBy, adoptedAt]
      properties:
        observationId: {$ref: '#/components/schemas/UUID'}
        sourceId: {$ref: '#/components/schemas/UUID'}
        sourceRevision: {type: integer, format: int64, minimum: 1}
        snapshotId: {$ref: '#/components/schemas/UUID'}
        retrievalDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        entryLocation: {type: string, pattern: '^/(entries|items)/(0|[1-9][0-9]*)$', maxLength: 1024}
        exactEntryDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        normalizedEntryDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        normalizationProfile: {type: string, const: catalog-observation-v1}
        adoptedBy: {type: string, minLength: 1}
        adoptedAt: {type: string, format: date-time}
    ObservationAdoption:
      type: object
      additionalProperties: false
      required: [resource, version, versionRevision, evidence, listing, listingRevision]
      properties:
        resource: {$ref: '#/components/schemas/AIRResource'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
        versionRevision: {$ref: '#/components/schemas/VersionRevision'}
        evidence: {$ref: '#/components/schemas/EvidenceSet'}
        listing: {$ref: '#/components/schemas/CatalogListing'}
        listingRevision: {$ref: '#/components/schemas/ListingRevision'}
    CatalogRecord:
      type: object
      additionalProperties: false
      required: [resource, version, versionRevision, listing, listingRevision, release, evidence, source]
      properties:
        display: {$ref: '#/components/schemas/CatalogPresentation'}
        resource: {$ref: '#/components/schemas/Resource'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
        versionRevision: {$ref: '#/components/schemas/VersionRevision'}
        listing: {$ref: '#/components/schemas/CatalogListing'}
        listingRevision: {$ref: '#/components/schemas/ListingRevision'}
        release: {$ref: '#/components/schemas/ListingRelease'}
        evidence: {$ref: '#/components/schemas/EvidenceSet'}
        relevanceScore: {type: integer, minimum: 0, maximum: 100}
        source: {type: string, const: local}
    CatalogResourceSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - namespaceId
        - canonicalIdentifier
        - kind
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        tenantId:
          $ref: '#/components/schemas/UUID'
        namespaceId:
          $ref: '#/components/schemas/UUID'
        canonicalIdentifier:
          type: string
          minLength: 1
          maxLength: 512
        kind:
          $ref: '#/components/schemas/ResourceKind'
    CatalogVersionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - version
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        version:
          type: string
          minLength: 1
          maxLength: 128
    CatalogRevisionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - contentSetDigest
        - evidenceSetId
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        contentSetDigest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        evidenceSetId:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: "Identifier of the latest validation run shown by this read. A new validation run changes this projection without rewriting immutable VersionRevision content."
    CatalogListingSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - namespaceId
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        namespaceId:
          $ref: '#/components/schemas/UUID'
    CatalogDisplaySummary:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - description
        - tags
        - publisherId
        - visibility
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        displayName:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[^\x00]*$
        description:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: ^[^\x00]*$
        tags:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 80
        publisherId:
          $ref: '#/components/schemas/UUID'
        visibility:
          $ref: '#/components/schemas/Visibility'
    CatalogReleaseSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - versionRevisionId
        - listingRevisionId
        - state
        - activatedAt
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        versionRevisionId:
          $ref: '#/components/schemas/UUID'
        listingRevisionId:
          $ref: '#/components/schemas/UUID'
        state:
          type: string
          enum:
            - published
            - deprecated
            - retired
            - superseded
            - revoked
        activatedAt:
          type: string
          format: date-time
    CatalogEvidenceSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - digest
        - state
        - trust
        - legalRights
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        state:
          type: string
          enum:
            - complete
            - blocked
        trust:
          type: object
          additionalProperties: false
          required:
            - state
          properties:
            state:
              type: string
              enum:
                - not_assessed
                - unsupported
                - unverified
                - verified
                - failed
                - expired
        legalRights:
          $ref: '#/components/schemas/LegalRightsSummary'
        expiresAt:
          type: string
          format: date-time
          description: "Present only when the evidence depends on a subject that can change with time. Deterministic structural validation over immutable bytes does not expire."
    CatalogPresentation:
      type: object
      additionalProperties: false
      description: >-
        Current release-linked Catalog directory labels, not immutable authorship or directory access.
        Compact license is the exact listing declaration; omitted-for-length declarations remain available in the full record.
        This projection does not alter public discovery.
      properties:
        publisherName: {type: string, minLength: 1, maxLength: 160}
        namespaceName: {type: string, minLength: 1, maxLength: 160}
        license: {type: string, minLength: 1, maxLength: 256}
        licenseOmitted: {type: boolean, const: true}
      not:
        required: [license, licenseOmitted]
    CatalogSummary:
      type: object
      additionalProperties: false
      description: Bounded collection metadata. Retrieve the complete retained record using release.id at GET /api/v1/catalog/resources/{catalogRecordId}.
        Documents, findings, package inventory and listing extensions are detail-only.
      required:
        - resource
        - version
        - versionRevision
        - listing
        - listingRevision
        - release
        - evidence
        - source
      properties:
        artwork: {$ref: '#/components/schemas/ArtworkPresentation'}
        display: {$ref: '#/components/schemas/CatalogPresentation'}
        resource:
          $ref: '#/components/schemas/CatalogResourceSummary'
        version:
          $ref: '#/components/schemas/CatalogVersionSummary'
        versionRevision:
          $ref: '#/components/schemas/CatalogRevisionSummary'
        listing:
          $ref: '#/components/schemas/CatalogListingSummary'
        listingRevision:
          $ref: '#/components/schemas/CatalogDisplaySummary'
        release:
          $ref: '#/components/schemas/CatalogReleaseSummary'
        evidence:
          $ref: '#/components/schemas/CatalogEvidenceSummary'
        source:
          type: string
          const: local
        relevanceScore:
          type: integer
          minimum: 0
          maximum: 100
    CatalogSearchLocal:
      type: object
      additionalProperties: false
      description: Local identity and status for Search. Display text, tags, publisher and rank occur once in the common
        result envelope. Full detail uses release.id.
      required:
        - resource
        - version
        - versionRevision
        - listing
        - listingRevision
        - release
        - evidence
      properties:
        display: {$ref: '#/components/schemas/CatalogPresentation'}
        resource:
          $ref: '#/components/schemas/CatalogResourceSummary'
        version:
          $ref: '#/components/schemas/CatalogVersionSummary'
        versionRevision:
          $ref: '#/components/schemas/CatalogRevisionSummary'
        listing:
          $ref: '#/components/schemas/CatalogListingSummary'
        listingRevision:
          type: object
          additionalProperties: false
          required:
            - id
            - visibility
          properties:
            id:
              $ref: '#/components/schemas/UUID'
            visibility:
              $ref: '#/components/schemas/Visibility'
        release:
          $ref: '#/components/schemas/CatalogReleaseSummary'
        evidence:
          $ref: '#/components/schemas/CatalogEvidenceSummary'
    CatalogRecordPage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        tier: {type: string, enum: [core, hybrid]}
        profile: {type: string, pattern: '^(core-lexical-v1|sha256:[a-f0-9]{64})$'}
        fallbackReason: {type: string, enum: [indexing, provider_unavailable, index_changed, work_limit]}
        partialIndex: {type: boolean}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CatalogSummary'}}
        nextCursor: {type: string}
        total: {type: integer, minimum: 0}
    IndexedCatalogSearchEvidence:
      type: object
      additionalProperties: false
      required: [observationGroupId, normalizedEntryDigest, sourceIds, sourceCount, sourcesTruncated, conflict, sameSourceConflict]
      properties:
        presentationSourceId: {$ref: '#/components/schemas/UUID'}
        presentationGeneration: {type: integer, format: int64, minimum: 1}
        presentationSourceRevision: {type: integer, format: int64, minimum: 1}
        observationGroupId: {type: string, pattern: '^observation-group-v1:sha256:[a-f0-9]{64}$'}
        normalizedEntryDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        sourceIds:
          type: array
          maxItems: 16
          uniqueItems: true
          items: {$ref: '#/components/schemas/UUID'}
        sourceCount: {type: integer, minimum: 1}
        sourcesTruncated: {type: boolean}
        conflict: {type: boolean}
        sameSourceConflict: {type: boolean}
    LiveCatalogSearchEvidence:
      type: object
      additionalProperties: false
      required: [sourceId, source, entry]
      properties:
        presentationGeneration: {type: integer, format: int64, minimum: 1}
        sourceRevision: {type: integer, format: int64, minimum: 1}
        sourceId: {$ref: '#/components/schemas/UUID'}
        source: {type: string, format: uri, pattern: '^[hH][tT][tT][pP][sS]://', maxLength: 2048}
        entry:
          type: object
          additionalProperties: true
          description: Exact bounded ARD Search result entry returned by the approved live source. It is transient metadata, not locally governed content.
    CatalogSearchResult:
      type: object
      additionalProperties: false
      required: [id, type, identifier, versionPresent, kind, displayName, tags, score]
      properties:
        peerRatings:
          type: object
          additionalProperties: false
          required: [reporter, count, average, measuredAt]
          properties:
            reporter: {type: string, format: uri, maxLength: 2048}
            count: {type: integer, minimum: 1}
            average: {type: number, minimum: 1, maximum: 5}
            measuredAt: {type: string, format: date-time}
        importedHere:
          type: object
          additionalProperties: false
          required: [resourceId, changedEntry]
          properties:
            resourceId: {$ref: '#/components/schemas/UUID'}
            changedEntry: {type: boolean}
        ratings: {$ref: '#/components/schemas/RatingSummary'}
        artwork: {$ref: '#/components/schemas/ArtworkPresentation'}
        id: {type: string, pattern: '^(?:local|indexed|live):[^\t\n\v\f\r ]+$', maxLength: 256}
        type: {type: string, enum: [local, indexed, live]}
        identifier: {type: string, minLength: 1, maxLength: 512, description: Local canonical identifier or normalized AIR identifier for an external result.}
        version: {type: string, maxLength: 128}
        versionPresent: {type: boolean}
        kind: {$ref: '#/components/schemas/ResourceKind'}
        displayName: {type: string, minLength: 1, maxLength: 512}
        description: {type: string, maxLength: 4000}
        tags: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 80}}
        publisher: {type: string, maxLength: 256, description: Catalog Publisher UUID for a local result or normalized AIR publisher component for an indexed or live result.}
        score: {type: integer, minimum: 0, maximum: 100}
        local: {$ref: '#/components/schemas/CatalogSearchLocal'}
        indexed: {$ref: '#/components/schemas/IndexedCatalogSearchEvidence'}
        live: {$ref: '#/components/schemas/LiveCatalogSearchEvidence'}
      oneOf:
        - required: [local]
          properties: {type: {const: local}}
          not: {anyOf: [{required: [indexed]}, {required: [live]}]}
        - required: [indexed]
          properties: {type: {const: indexed}}
          not: {anyOf: [{required: [local]}, {required: [live]}]}
        - required: [live]
          properties: {type: {const: live}}
          not: {anyOf: [{required: [local]}, {required: [indexed]}]}
    CatalogSearchDiagnostic:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        sourceId: {$ref: '#/components/schemas/UUID'}
        status:
          type: string
          enum: [failed, invalid_response, insufficient_evidence, policy_stale, fanout_limited, diagnostics_truncated, live_results_limited, continuation_unavailable]
          description: >-
            insufficient_evidence sets partial=true when an otherwise valid live result lacks bounded declarations required by Control filters.
            continuation_unavailable sets partial=true when a peer token remains after bounded paging or a failed continuation.
            Results with valid source authority remain available.
        message: {type: string, maxLength: 1000}
    CatalogSearchResponse:
      type: object
      additionalProperties: false
      required: [items, durableTotal, liveCount, profile, generation, tier, partial]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CatalogSearchResult'}}
        nextCursor: {type: string, maxLength: 4096}
        durableTotal: {type: integer, minimum: 0, description: Number of matching local and indexed result projections. Transient live results are excluded.}
        liveCount: {type: integer, minimum: 0, maximum: 50, description: Number of transient live results included in this response page.}
        profile: {type: string, pattern: '^(core-lexical-v1|sha256:[a-f0-9]{64})$'}
        generation: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        tier: {type: string, enum: [core, hybrid]}
        fallbackReason: {type: string, enum: [indexing, provider_unavailable, index_changed, work_limit], description: Safe reason this fresh query used lexical fallback. Continuations never silently change retrieval tier.}
        partialIndex: {type: boolean, description: Some eligible metadata cannot be embedded and remains lexical-only.}
        partial: {type: boolean}
        diagnostics: {type: array, maxItems: 33, items: {$ref: '#/components/schemas/CatalogSearchDiagnostic'}}
    VersionEvidenceEnvelope:
      type: object
      additionalProperties: false
      required: [version, revision, evidence]
      properties:
        version: {$ref: '#/components/schemas/ResourceVersion'}
        revision: {$ref: '#/components/schemas/VersionRevision'}
        evidence: {$ref: '#/components/schemas/EvidenceSet'}
    RevisionEvidenceEnvelope:
      type: object
      additionalProperties: false
      required: [namespaceId, revision, evidence]
      properties:
        namespaceId: {type: string, format: uuid, readOnly: true, description: Canonical same-tenant resource namespace. Returned only after revision authorization and required audit succeed.}
        revision: {$ref: '#/components/schemas/VersionRevision'}
        evidence: {$ref: '#/components/schemas/EvidenceSet'}
    Reason:
      type: object
      additionalProperties: false
      required: [reason]
      properties: {reason: {type: string, minLength: 1, maxLength: 2000, pattern: '.*\S.*'}}
    CreateNamespace:
      type: object
      additionalProperties: false
      required: [slug, displayName]
      properties:
        slug: {type: string, pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$', maxLength: 64}
        displayName: {type: string, minLength: 1, maxLength: 160, pattern: '^[^\x00]*$'}
        description: {type: string, maxLength: 2000, pattern: '^[^\x00]*$'}
    PatchNamespace:
      type: object
      additionalProperties: false
      required: [reason]
      minProperties: 2
      properties:
        displayName: {type: string, minLength: 1, maxLength: 160, pattern: '^[^\x00]*$'}
        description: {type: string, maxLength: 2000, pattern: '^[^\x00]*$'}
        reason: {type: string, minLength: 1, maxLength: 2000, pattern: '.*\S.*'}
      anyOf:
        - required: [displayName]
        - required: [description]
    CreatePublisher:
      type: object
      additionalProperties: false
      required: [displayName, domains]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 160, pattern: '^[^\x00]*$'}
        domains:
          type: array
          minItems: 1
          maxItems: 64
          items: {type: string, format: hostname}
    PatchPublisher:
      type: object
      additionalProperties: false
      required: [reason]
      minProperties: 2
      properties:
        displayName: {type: string, minLength: 1, maxLength: 160, pattern: '^[^\x00]*$'}
        domains:
          type: array
          minItems: 1
          maxItems: 64
          items: {type: string, format: hostname}
        reason: {type: string, minLength: 1, maxLength: 2000, pattern: '.*\S.*'}
      anyOf:
        - required: [displayName]
        - required: [domains]
    CreateResource:
      type: object
      additionalProperties: false
      required: [namespaceId, canonicalIdentifier, kind]
      properties:
        namespaceId: {$ref: '#/components/schemas/UUID'}
        canonicalIdentifier: {type: string, minLength: 1, maxLength: 512}
        kind: {$ref: '#/components/schemas/ResourceKind'}
    CreateVersion:
      type: object
      additionalProperties: false
      required: [version, representations]
      properties:
        version: {type: string, minLength: 1, maxLength: 128}
        representations:
          type: array
          minItems: 1
          maxItems: 16
          items: {$ref: '#/components/schemas/RepresentationInput'}
    RepresentationInput:
      type: object
      additionalProperties: false
      required: [role, mediaType]
      allOf:
        - if: {required: [expectedDigest]}
          then:
            required: [url]
            properties:
              mediaType: {enum: [application/agent-plugins+zip, application/agent-plugins+gzip]}
        - if:
            properties:
              mediaType: {enum: [application/agent-plugins+zip, application/agent-plugins+gzip]}
          then: {required: [url]}
      properties:
        expectedDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$', description: Optional exact archive checksum for Plugin HTTPS input only.}
        role: {type: string, enum: [primary, distribution, metadata, documentation]}
        mediaType: {type: string, minLength: 3, maxLength: 255, pattern: '^[^/\s]+/[^/\s;]+(?:\s*;.*)?$', description: Syntactically valid media type containing an explicit type and subtype.}
        profileId: {type: string, maxLength: 160}
        url:
          type: string
          format: uri
          pattern: '^[hH][tT][tT][pP][sS]://'
          maxLength: 2048
          description: 'Credential-free delivery URL retrieved synchronously through the deployment-owned anonymous public route. PostgreSQL retains exact text validation bytes. For Plugin archives, it retains bounded
            inspection documents and inventory. The digest and size identify the complete external archive.'
        data: {type: object, additionalProperties: true}
        content: {type: string}
        packageData:
          type: string
          format: byte
          minLength: 1
          maxLength: 22369624
          description: Transient base64 ZIP or gzipped-tar bytes used only for bounded Agent Skill inspection. Bytes are digested but never retained; the configured request-body limit may be lower.
        handoff: {$ref: '#/components/schemas/SkillHandoff'}
      oneOf:
        - required: [url]
          not: {anyOf: [{required: [data]}, {required: [content]}, {required: [packageData]}, {required: [handoff]}]}
        - required: [data]
          not: {anyOf: [{required: [url]}, {required: [content]}, {required: [packageData]}, {required: [handoff]}]}
        - required: [content]
          not: {anyOf: [{required: [url]}, {required: [data]}, {required: [packageData]}, {required: [handoff]}]}
        - required: [packageData, handoff]
          properties:
            mediaType: {type: string, enum: [application/agent-skills+zip, application/agent-skills+gzip]}
          not: {anyOf: [{required: [url]}, {required: [data]}, {required: [content]}]}
    CreateListing:
      type: object
      additionalProperties: false
      required: [namespaceId, resourceId]
      properties:
        namespaceId: {$ref: '#/components/schemas/UUID'}
        resourceId: {$ref: '#/components/schemas/UUID'}
    CreateListingRevision:
      type: object
      additionalProperties: false
      required: [versionRevisionId, displayName, description, publisherId, visibility]
      properties:
        versionRevisionId: {$ref: '#/components/schemas/UUID'}
        displayName: {type: string, minLength: 1, maxLength: 160, pattern: '^[^\x00]*$'}
        description: {type: string, minLength: 1, maxLength: 4000, pattern: '^[^\x00]*$'}
        tags: {type: array, maxItems: 32, items: {type: string, maxLength: 80}}
        categories: {type: array, maxItems: 16, items: {type: string, maxLength: 80}}
        representativeQueries:
          type: array
          maxItems: 5
          description: Queries normalize whitespace and use Unicode code-point lengths. Public publication requires two to five queries.
          items: {type: string, minLength: 3, maxLength: 240, pattern: '^[^\x00]*$'}
        publisherId: {$ref: '#/components/schemas/UUID'}
        documentationUrl: {type: string, format: uri}
        supportUrl: {type: string, format: uri}
        license: {type: string}
        termsUrl: {type: string, format: uri}
        visibility: {$ref: '#/components/schemas/Visibility'}
        relationships:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {$ref: '#/components/schemas/Relationship'}
        extensions:
          type: object
          description: >-
            Service control metadata reviewed with this listing revision. Values are retained and digested but are not automatically projected as ARD JSON-LD terms or AI Catalog namespaced extensions.
          additionalProperties: true
          properties:
            'https://github.com/open-agentic-catalog/open-agentic-catalog/schemas/artwork/v1#descriptor': {$ref: '#/components/schemas/ArtworkInput'}
    Relationship:
      type: object
      additionalProperties: false
      required: [type, targetIdentifier]
      properties:
        type: {type: string, enum: [depends_on, recommended_with, supersedes, bundled_with]}
        targetIdentifier: {type: string, minLength: 1, maxLength: 512}
        targetVersion: {type: string, minLength: 1, maxLength: 128}
    PublishListing:
      type: object
      additionalProperties: false
      required: [submissionId]
      properties:
        submissionId: {$ref: '#/components/schemas/UUID'}
        priorDisposition: {type: string, enum: [retired, superseded]}
        priorReason: {type: string, maxLength: 2000}
    ReleaseTransition:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000, pattern: '.*\S.*'}
        replacementId:
          allOf: [{$ref: '#/components/schemas/UUID'}]
          description: 'Optional replacement guidance for deprecation and required for supersession. The replacement must be published or deprecated in the same tenant. It may identify another CatalogListing. Retirement
            and revocation reject this field.'
        sunsetAt:
          type: string
          format: date-time
          description: "Optional deprecation sunset guidance later than the transition time. Retirement, supersession and revocation reject this field."
    CatalogSearchOrder:
      type: string
      enum: [name_asc, name_desc, kind_asc, kind_desc, publisher_asc, publisher_desc]
      description: >-
        Explicit column order across local and indexed keyword matches, followed by a separately ordered bounded live window.
        Omit for relevance (including configured semantic search) or name A-Z when browsing without text.
        Publisher uses the current local display name or external publisher declaration. Kind uses its wire label.
        Primary keys use the selected direction; ties use normalized name and stable result ID ascending.
        Column ordering does not invoke the embedding provider. Changing order requires a new cursor-free search.
    CatalogSearch:
      type: object
      additionalProperties: false
      allOf:
        - anyOf:
            - not: {required: [namespaceId]}
            - properties:
                origins: {type: array, items: {type: string, enum: [local]}}
      properties:
        order:
          $ref: '#/components/schemas/CatalogSearchOrder'
        origins:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: >-
            Select local, indexed or transient live provenance. Omission preserves existing participation.
            With namespaceId, omit origins or select local alone. License and category filters apply across selected origins. Local releases shadow matching indexed identities only when local participates.
            Live-only search can continue a verified bounded live window and reports zero durableTotal.
          items: {type: string, enum: [local, indexed, live]}
        namespaceId:
          allOf: [{$ref: '#/components/schemas/UUID'}]
          description: Local Listing namespace UUID; restricts to local releases. Unknown or other-tenant UUIDs return no matches. Not an AIR or JSON-LD namespace.
        text: {type: string, maxLength: 500, pattern: '^[^\x00]*$', description: Search text excludes NUL and is limited to 500 UTF-8 bytes.}
        kinds: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/ResourceKind'}}
        tags: {type: array, maxItems: 32, items: {type: string, maxLength: 80, pattern: '^[^\x00]*$'}}
        license:
          type: string
          maxLength: 256
          pattern: '^$|^[^\x00]*[^\s\x00][^\x00]*$'
          description: >-
            Empty means no license filter. Trimmed, case-sensitive exact match against the immutable local
            Listing license or bounded external metadata.license string. No SPDX interpretation or match for
            absent, malformed or oversized declarations. Applies across selected origins.
        categories:
          type: array
          maxItems: 16
          items: {type: string, minLength: 1, maxLength: 80, pattern: '^[^\x00]*[^\s\x00][^\x00]*$'}
          description: >-
            All selected categories must match after trimming, lowercasing and deduplication. Local releases
            use Listing categories; external entries use bounded literal Dublin Core subjects. Missing, malformed
            or oversized declarations do not match. Live candidates are checked before admission; their bounded
            population can be incomplete. Applies across selected origins.
        publisher:
          type: string
          maxLength: 256
          pattern: '^[^\x00]*$'
          description: Source-aware selector matched against the Catalog Publisher UUID for local releases and the normalized AIR publisher component for indexed or live entries. Excludes NUL and is limited to 256 UTF-8 bytes.
        visibility: {$ref: '#/components/schemas/Visibility'}
        limit: {type: integer, minimum: 1, maximum: 100}
        cursor:
          type: string
          maxLength: 4096
          description: >-
            Opaque expiring continuation cursor bound to the principal, permissions, normalized query, core
            SearchProfile, and durable local and indexed generations. Core live continuation replays an unchanged
            bounded window of at most 50 candidates with a fixed 15-minute expiry. Changed evidence requires restart;
            temporary replay failure permits retrying the same cursor. Hybrid Search preserves the precise durable ranking before a separate live tail.
            Live-only Search binds the live window without durable generation or embedding work.
    CatalogExplore:
      type: object
      additionalProperties: false
      required: [facets]
      properties:
        query: {$ref: '#/components/schemas/CatalogExploreQuery'}
        facets:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [field]
            properties:
              field: {type: string, enum: [kind, visibility, publisher, tag, category, namespace, trustState, source]}
              limit: {type: integer, minimum: 1, maximum: 100}
              minCount: {type: integer, minimum: 0}
    CatalogExploreQuery:
      type: object
      additionalProperties: false
      properties:
        namespaceId: {$ref: '#/components/schemas/UUID'}
        text: {type: string, maxLength: 500}
        kinds: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/ResourceKind'}}
        tags: {type: array, maxItems: 32, items: {type: string, maxLength: 80}}
        license:
          type: string
          maxLength: 256
          pattern: '^$|^[^\x00]*[^\s\x00][^\x00]*$'
          description: >-
            Empty means no license filter. Trimmed, case-sensitive exact match against the local immutable
            Listing license declaration. No SPDX interpretation or match for absent declarations. Explore covers
            local releases only.
        categories:
          type: array
          maxItems: 16
          items: {type: string, minLength: 1, maxLength: 80, pattern: '^[^\x00]*[^\s\x00][^\x00]*$'}
          description: All selected categories must match local Listing categories after trimming, lowercasing and deduplication. Missing categories do not match. Explore covers local releases only.
        publisher: {type: string, maxLength: 256, description: Catalog Publisher UUID. Explore covers local governed releases only.}
        visibility: {$ref: '#/components/schemas/Visibility'}
    CatalogFacetBucket:
      type: object
      additionalProperties: false
      required: [value, count]
      properties:
        value: {type: string, minLength: 1, maxLength: 512}
        count: {type: integer, minimum: 1}
    CatalogFacetResult:
      type: object
      additionalProperties: false
      required: [buckets]
      properties:
        buckets: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CatalogFacetBucket'}}
        otherCount: {type: integer, minimum: 1, description: Sum of counts for matching buckets outside the requested bounded result. Omitted when zero.}
    CatalogExploreResponse:
      type: object
      additionalProperties: false
      required: [matched, facets]
      properties:
        tier: {type: string, enum: [core, hybrid]}
        profile: {type: string, pattern: '^(core-lexical-v1|sha256:[a-f0-9]{64})$'}
        fallbackReason: {type: string, enum: [indexing, provider_unavailable, index_changed, work_limit]}
        partialIndex: {type: boolean}
        matched: {type: integer, minimum: 0}
        facets:
          type: object
          additionalProperties: {$ref: '#/components/schemas/CatalogFacetResult'}
          propertyNames: {enum: [kind, visibility, publisher, tag, category, namespace, trustState, source]}
          minProperties: 1
          maxProperties: 10
    InspectSource:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: {type: string, minLength: 1, maxLength: 2048}
        networkProfile: {$ref: '#/components/schemas/NetworkProfileReference'}
        credentialBinding: {$ref: '#/components/schemas/CredentialBindingReference'}
    SourceScope:
      type: object
      additionalProperties: false
      anyOf:
        - {required: [identifiers]}
        - {required: [versions]}
        - {required: [kinds]}
        - {required: [publishers]}
        - {required: [tags]}
      properties:
        excludedIdentifiers:
          type: array
          maxItems: 1000
          uniqueItems: true
          description: >-
            Local source exclusions for all versions. Deny takes precedence. Omitted or empty means no exclusions.
            At least one positive filter remains required. Values have a 512 Unicode code point limit;
            valid AIRs normalize publisher case while other identifiers match exactly.
          items: {type: string, minLength: 1, maxLength: 512, pattern: '^\S(?:.*\S)?$'}
        identifiers: {type: array, minItems: 1, maxItems: 1000, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 512, pattern: '^\S(?:.*\S)?$'}}
        versions: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128, pattern: '^\S(?:.*\S)?$'}}
        kinds: {type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/ResourceKind'}}
        publishers: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 255, pattern: '^\S(?:.*\S)?$'}}
        tags: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 80, pattern: '^\S(?:.*\S)?$'}}
    LivePolicy:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        referralOnly: {type: boolean, description: Excludes this source from root live selection while allowing it as an explicitly approved observed referral hop.}
        queryPrivacyAcknowledged: {type: boolean}
        anonymousDisclosureAcknowledged: {type: boolean, description: Explicit acknowledgement that anonymous live results may disclose this Registry identity and the returned source origins publicly.}
        federationMode:
          type: string
          enum: [none, referrals]
          description: Administrator-controlled mode sent to this configured upstream Registry. It can operate only within the bounded approved topology; an observed referral is never contacted without independent source approval.
    RetrievalMode:
      type: string
      enum: [indexed, live, hybrid]
      description: Indexed sources contribute durable observations, live sources are queried during discovery, and hybrid sources do both.
    NetworkProfileReference:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    CredentialBindingReference:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._-]+$'
      not: {enum: ['.', '..']}
      description: Opaque deployment-resolved reference. It is not a credential value.
    NetworkProfilePatchReference:
      type: string
      maxLength: 63
      pattern: '^(?:|[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)$'
      description: Named deployment network profile, or an empty string to clear the current profile after a matching inspection.
    CredentialBindingPatchReference:
      type: string
      maxLength: 128
      pattern: '^(?:|[A-Za-z0-9._-]+)$'
      not: {enum: ['.', '..']}
      description: Opaque deployment-resolved reference, or an empty string to clear the current binding after a matching inspection.
    DiscoveryAssignment:
      type: object
      additionalProperties: false
      required: [host, audience]
      properties:
        host: {type: string, minLength: 1, maxLength: 253, description: Exact deployment-configured discovery host.}
        audience: {type: string, enum: [anonymous, authenticated]}
    ReferralPolicy:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        maxHops: {type: integer, minimum: 1, maximum: 2, description: Maximum approved referral depth when this source is selected as a root. A referred source cannot increase the root request's remaining hop budget.}
        approvedSourceIds:
          type: array
          maxItems: 12
          uniqueItems: true
          items: {$ref: '#/components/schemas/UUID'}
          description: Independently inspected and connected source identifiers. Returned URLs never add an edge.
        anonymousDisclosureAcknowledged: {type: boolean, description: Explicit acknowledgement that anonymous auto discovery may forward queries through these approved referral edges.}
    FederationSourceInspection:
      type: object
      additionalProperties: false
      required: [id, tenantId, requestedUrl, resolvedUrl, sourceType, profileId, mediaType, bodyDigest, entryCount, kindCounts, publishers, tags, capabilities, policyId, policyRevision, policyDigest, expiresAt, createdAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenantId: {$ref: '#/components/schemas/UUID'}
        requestedUrl: {type: string, format: uri}
        resolvedUrl: {type: string, format: uri}
        sourceType: {type: string, enum: [ard_manifest, ai_catalog, ard_registry, hybrid]}
        profileId: {type: string}
        mediaType: {type: string}
        bodyDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        entryCount: {type: integer, minimum: 0}
        kindCounts: {type: object, additionalProperties: {type: integer, minimum: 0}}
        publishers: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
        capabilities: {type: object, additionalProperties: {type: boolean}}
        registrySearchUrl: {type: string, format: uri}
        registryListUrl: {type: string, format: uri}
        networkProfile: {$ref: '#/components/schemas/NetworkProfileReference'}
        credentialBinding: {$ref: '#/components/schemas/CredentialBindingReference'}
        policyId: {type: string, minLength: 1, maxLength: 63}
        policyRevision: {type: integer, format: int64, minimum: 1}
        policyDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        credentialRevision: {type: string, minLength: 1, maxLength: 128}
        warnings: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Finding'}}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    FederationSource:
      type: object
      additionalProperties: false
      required: [id, tenantId, displayName, type, endpoint, status, profileId, retrievalMode, scope, updateMode, live, referrals, nesting, policyId, policyRevision, policyDigest, revision, createdBy, createdAt, updatedAt]
      properties:
        trustVerificationPolicy: {type: string, maxLength: 63, pattern: "^(?:|[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)$", description: Named operator ANS policy; empty clears selection. Inert when verification is disabled.}
        artworkEnabled: {type: boolean, description: Explicit opt-in to source-provided artwork and native icons; image origin policy still applies.}
        presentationGeneration: {type: integer, format: int64, minimum: 1, description: Source presentation authority generation; replacement authority starts a new generation.}
        id: {$ref: '#/components/schemas/UUID'}
        tenantId: {$ref: '#/components/schemas/UUID'}
        displayName: {type: string, minLength: 1, maxLength: 160, pattern: '^[^\x00]*$'}
        type: {type: string, enum: [ard_manifest, ai_catalog, ard_registry, hybrid]}
        endpoint: {type: string, format: uri}
        registrySearchUrl: {type: string, format: uri}
        registryListUrl: {type: string, format: uri}
        status: {type: string, enum: [active, paused, error, removed]}
        profileId: {type: string}
        retrievalMode: {$ref: '#/components/schemas/RetrievalMode'}
        scope: {$ref: '#/components/schemas/SourceScope'}
        updateMode: {type: string, enum: [manual_review, automatic]}
        live: {$ref: '#/components/schemas/LivePolicy'}
        referrals: {$ref: '#/components/schemas/ReferralPolicy'}
        discoveryAssignments:
          type: array
          maxItems: 16
          uniqueItems: true
          items: {$ref: '#/components/schemas/DiscoveryAssignment'}
        nesting: {$ref: '#/components/schemas/NestingPolicy'}
        credentialBinding: {$ref: '#/components/schemas/CredentialBindingReference'}
        networkProfile: {$ref: '#/components/schemas/NetworkProfileReference'}
        policyId: {type: string, maxLength: 63, pattern: '^(?:|[a-z0-9]+(?:-[a-z0-9]+)*)$'}
        policyRevision: {type: integer, format: int64, minimum: 0}
        policyDigest: {type: string, pattern: '^(?:|sha256:[a-f0-9]{64})$'}
        credentialRevision: {type: string, minLength: 1, maxLength: 128}
        revision: {type: integer, format: int64, minimum: 1}
        lastCompleteSnapshotId: {$ref: '#/components/schemas/UUID'}
        lastSyncAt: {type: string, format: date-time}
        lastError: {type: string}
        createdBy: {type: string, minLength: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    FederationSourcePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/FederationSource'}}
        nextCursor: {type: string, maxLength: 2048}
    FederationSnapshot:
      type: object
      additionalProperties: false
      required: [id, tenantId, sourceId, sourceRevision, state, enumerationComplete, withdrawalAuthority, bodyDigest, policyId, policyRevision, policyDigest, memberCount, added, updated, withdrawn, startedAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenantId: {$ref: '#/components/schemas/UUID'}
        sourceId: {$ref: '#/components/schemas/UUID'}
        sourceRevision: {type: integer, format: int64, minimum: 1, description: Exact retained source revision.}
        state: {type: string, enum: [running, complete, incomplete, failed]}
        enumerationComplete: {type: boolean}
        withdrawalAuthority: {type: boolean}
        reconcileCurrentView: {type: boolean, description: True only for a complete non-withdrawal-authoritative Registry List snapshot that replaces the source's current indexed view.}
        bodyDigest: {type: string}
        policyId: {type: string, maxLength: 63}
        policyRevision: {type: integer, format: int64, minimum: 0}
        policyDigest: {type: string, pattern: '^(?:|sha256:[a-f0-9]{64})$'}
        credentialRevision: {type: string, minLength: 1, maxLength: 128}
        memberCount: {type: integer, minimum: 0}
        added: {type: integer, minimum: 0}
        updated: {type: integer, minimum: 0}
        withdrawn: {type: integer, minimum: 0}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        findings: {type: array, items: {$ref: '#/components/schemas/Finding'}}
        retrievals: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/FederationRetrievalEvidence'}}
    FederationRetrievalEvidence:
      type: object
      additionalProperties: false
      required: [id, requestKey, requestedUrlDigest, finalUrlDigest, profileId, status, receivedBody, reused, fetchedAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        requestKey: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        requestedUrlDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        finalUrlDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        profileId: {type: string, minLength: 1, maxLength: 128}
        status: {type: integer, minimum: 100, maximum: 599}
        receivedBody: {type: boolean}
        reused: {type: boolean}
        representationDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        etagDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        lastModifiedDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        fetchedAt: {type: string, format: date-time}
    FederationSnapshotPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/FederationSnapshot'}}
        nextCursor: {type: string, maxLength: 2048}
    FederationSnapshotComparisonSummary:
      type: object
      additionalProperties: false
      required: [id, memberCount, startedAt, withdrawalAuthority]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        memberCount: {type: integer, minimum: 0, maximum: 10000}
        startedAt: {type: string, format: date-time}
        withdrawalAuthority: {type: boolean}
    FederationSnapshotComparisonMember:
      type: object
      additionalProperties: false
      required: [observationId, identifier, version, versionPresent, kind, identityDigest, occurrence]
      properties:
        observationId: {$ref: '#/components/schemas/UUID'}
        identifier: {type: string, maxLength: 2048}
        version: {type: string, maxLength: 128}
        versionPresent: {type: boolean, description: Missing and present-empty versions remain distinct.}
        kind: {type: string, description: Retained kind or empty when unavailable.}
        identityDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        occurrence: {$ref: '#/components/schemas/ObservationOccurrence'}
    FederationSnapshotEntryChange:
      type: object
      additionalProperties: false
      required: [position, sourceKey, change, beforeCount, afterCount]
      properties:
        position: {type: integer, minimum: 1, maximum: 20000, description: Stable position in the selected filtered comparison.}
        sourceKey: {type: string, maxLength: 2048, description: Retained source-local correspondence key; unidentifiable entries use their exact occurrence-based key.}
        change: {type: string, enum: [added, absent, changed, unchanged, multiple]}
        beforeCount: {type: integer, minimum: 0, maximum: 10000}
        afterCount: {type: integer, minimum: 0, maximum: 10000}
        before: {$ref: '#/components/schemas/FederationSnapshotComparisonMember'}
        after: {$ref: '#/components/schemas/FederationSnapshotComparisonMember'}
      description: >-
        Unique keys have at most one member on either side. Changed compares exact-entry, normalization-input,
        normalized-entry and identity digests; occurrence timing or retrieval changes alone are not content changes.
        Multiple rows preserve every occurrence on its own side whenever either selected membership repeats a key.
        No arbitrary correspondence is asserted for those rows. Exact raw bytes are not included.
    FederationSnapshotComparisonPage:
      type: object
      additionalProperties: false
      required: [sourceId, sourceRevision, before, after, items]
      properties:
        sourceId: {$ref: '#/components/schemas/UUID'}
        sourceRevision: {type: integer, format: int64, minimum: 1}
        before: {$ref: '#/components/schemas/FederationSnapshotComparisonSummary'}
        after: {$ref: '#/components/schemas/FederationSnapshotComparisonSummary'}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/FederationSnapshotEntryChange'}}
        nextCursor: {type: string, maxLength: 2048}
    ObservationCompatibility:
      type: object
      additionalProperties: false
      required: [structural, profileId, support]
      properties:
        structural: {type: string, enum: [valid, invalid]}
        profileId: {type: string}
        support: {type: string, enum: [supported, unknown]}
        findings: {type: array, items: {$ref: '#/components/schemas/Finding'}}
    Observation:
      type: object
      additionalProperties: false
      required: [id, tenantId, sourceId, sourceKey, versionPresent, completeness, compatibility, rawEntryAvailable, exactEntryDigest, identityDigest, freshness, firstSeenAt, lastSeenAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenantId: {$ref: '#/components/schemas/UUID'}
        sourceId: {$ref: '#/components/schemas/UUID'}
        sourceKey: {type: string, minLength: 1}
        identifier: {type: string, pattern: '^urn:air:', maxLength: 512}
        version: {type: string, maxLength: 128}
        versionPresent: {type: boolean}
        kind: {$ref: '#/components/schemas/ResourceKind'}
        mediaType: {type: string, maxLength: 255}
        completeness: {type: string, enum: [complete, projection, unresolved]}
        compatibility: {$ref: '#/components/schemas/ObservationCompatibility'}
        rawEntryAvailable: {type: boolean, description: True only when the exact original decoded entry bytes can be downloaded.}
        exactEntryDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        identityDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        normalizedEntryDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        normalizationProfile: {type: string, const: catalog-observation-v1}
        freshness: {type: string, enum: [current, stale, withdrawn, source_removed]}
        firstSeenAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
    ObservationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Observation'}}
        nextCursor: {type: string, maxLength: 2048}
    ObservationOccurrence:
      type: object
      additionalProperties: false
      required: [observationId, sourceId, snapshotId, sourceRevision, retrievalDigest, entryLocation, exactEntryDigest, evidenceComplete, observedAt]
      properties:
        observationId: {$ref: '#/components/schemas/UUID'}
        sourceId: {$ref: '#/components/schemas/UUID'}
        snapshotId: {$ref: '#/components/schemas/UUID'}
        sourceRevision: {type: integer, format: int64, minimum: 1, description: Exact retained source revision.}
        retrievalDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        entryLocation:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            Exact `/entries/N` manifest location or `/items/N` Registry List page location for complete retained evidence.
        exactEntryDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        normalizedEntryDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        normalizationInputDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        evidenceComplete: {type: boolean, enum: [true]}
        observedAt: {type: string, format: date-time}
    ObservationOccurrencePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ObservationOccurrence'}}
        nextCursor: {type: string, maxLength: 2048}
    ObservationGroupContribution:
      type: object
      additionalProperties: false
      required: [observation, occurrenceCount, latestOccurrence, sourceConflict]
      properties:
        observation: {$ref: '#/components/schemas/Observation'}
        occurrenceCount: {type: integer, minimum: 1}
        latestOccurrence: {$ref: '#/components/schemas/ObservationOccurrence'}
        sourceConflict: {type: boolean}
    ObservationGroupMember:
      type: object
      additionalProperties: false
      required: [normalizedEntryDigest, contributions]
      properties:
        normalizedEntryDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        contributions:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/ObservationGroupContribution'}
    ObservationGroup:
      type: object
      additionalProperties: false
      required: [id, identifier, versionPresent, kind, conflict, contributionsTruncated, members]
      properties:
        id: {type: string, pattern: '^observation-group-v1:sha256:[a-f0-9]{64}$'}
        identifier: {type: string, pattern: '^urn:air:', maxLength: 512}
        version: {type: string, maxLength: 128}
        versionPresent: {type: boolean}
        kind: {$ref: '#/components/schemas/ResourceKind'}
        conflict: {type: boolean}
        contributionsTruncated: {type: boolean, description: True when more than 100 exact contributions exist and the response contains only the bounded projection.}
        members: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/ObservationGroupMember'}}
    AdoptObservation:
      type: object
      additionalProperties: false
      required: [snapshotId, retrievalDigest, entryLocation, namespaceId, publisherId]
      properties:
        snapshotId: {$ref: '#/components/schemas/UUID'}
        retrievalDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        entryLocation: {type: string, pattern: '^/(entries|items)/(0|[1-9][0-9]*)$', maxLength: 1024}
        namespaceId: {$ref: '#/components/schemas/UUID'}
        publisherId: {$ref: '#/components/schemas/UUID'}
        version: {type: string, minLength: 1, maxLength: 128, description: Required only when the selected external observation has no version; otherwise it must be absent or equal the observed version.}
        displayName: {type: string, minLength: 1, maxLength: 160, pattern: '^[^\x00]*$', description: Optional local override; required when the observation has no usable display name.}
        description: {type: string, minLength: 1, maxLength: 4000, pattern: '^[^\x00]*$', description: Optional local override; required when the observation has no usable description.}
        categories: {type: array, maxItems: 16, uniqueItems: true, items: {type: string, maxLength: 80}}
        documentationUrl: {type: string, format: uri, pattern: '^[hH][tT][tT][pP][sS]://', maxLength: 2048}
