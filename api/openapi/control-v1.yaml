      type: object
      additionalProperties: true
      required: [jsonrpc, method]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id: {oneOf: [{type: string}, {type: number}], description: 'A string or numeric call identifier; omit only for notifications.'}
        method: {type: string, minLength: 1, description: 'Selected methods are server/discover, tools/list, tools/call, initialize, notifications/initialized and ping.'}
        params:
          type: object
          additionalProperties: true
          description: MCP parameters and extensible protocol metadata. Tool arguments use each advertised closed schema.
