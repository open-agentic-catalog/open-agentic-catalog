      properties:
        structureState: {type: string, enum: [passed, failed]}
        rootDirectory: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 64}
        expandedSize: {type: integer, format: int64, minimum: 0, maximum: 67108864}
        fileCount: {type: integer, minimum: 0, maximum: 1024}
        files: {type: array, maxItems: 1024, items: {$ref: '#/components/schemas/SkillPackageFile'}}
        assessments: {$ref: '#/components/schemas/SkillPackageAssessments'}
      oneOf:
        - required: [rootDirectory, files]
          properties:
            structureState: {const: passed}
            expandedSize: {type: integer, format: int64, minimum: 1, maximum: 67108864}
            fileCount: {type: integer, minimum: 1, maximum: 1024}
            files: {type: array, minItems: 1, maxItems: 1024, items: {$ref: '#/components/schemas/SkillPackageFile'}}
        - properties:
            structureState: {const: failed}
            expandedSize: {const: 0}
            fileCount: {const: 0}
            files: {type: array, maxItems: 0, items: {}}
          not: {required: [rootDirectory]}
      description: Complete inventory is present only when structureState is passed. A failed inspection retains no partial inventory.
    GitHandoffReference:
      type: object
