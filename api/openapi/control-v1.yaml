        occurredBefore: {type: string, format: date-time, description: 'Exclusive upper occurrence-time bound, which must not be after the server cutoff.'}
        reason: {type: string, minLength: 1, maxLength: 2000, pattern: '.*\S.*', description: 'Durable user-authored audit text; never include secrets, URLs, raw queries, or content.'}
      dependentRequired:
        targetType: [targetId]
        targetId: [targetType]
    AuditExportFilters:
      type: object
      additionalProperties: false
      required: [occurredFrom, occurredBefore]
      properties:
        actor: {type: string, minLength: 1, maxLength: 512}
