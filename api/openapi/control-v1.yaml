    PersonalReference:
      type: object
      additionalProperties: false
      required:
        - origin
      properties:
        origin:
          type: string
          enum:
            - local
            - foreign
        kind:
          $ref: '#/components/schemas/ResourceKind'
        releaseId:
          $ref: '#/components/schemas/UUID'
        versionRevisionId:
          $ref: '#/components/schemas/UUID'
        sourceId:
          $ref: '#/components/schemas/UUID'
        presentationGeneration:
          type: integer
          minimum: 1
        identifier:
          type: string
          minLength: 1
          maxLength: 512
        versionPresent:
          type: boolean
        version:
          type: string
          maxLength: 128
      oneOf:
        - properties:
            origin:
              const: local
          required:
            - releaseId
            - versionRevisionId
          not:
            anyOf:
              - required:
                  - sourceId
              - required:
                  - presentationGeneration
              - required:
                  - identifier
              - required:
                  - versionPresent
              - required:
                  - version
              - required:
                  - kind
        - properties:
            origin:
              const: foreign
          required:
            - sourceId
            - presentationGeneration
            - identifier
            - versionPresent
            - kind
          not:
            anyOf:
              - required:
                  - releaseId
              - required:
                  - versionRevisionId
    PersonalCriteria:
      type: object
      additionalProperties: false
      allOf:
        - anyOf:
            - not:
                required:
                  - namespaceId
            - properties:
                origins:
                  type: array
                  items:
                    type: string
                    enum:
                      - local
      properties:
        order:
          $ref: '#/components/schemas/CatalogSearchOrder'
        origins:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: Select local, indexed or transient live provenance. Omission preserves existing participation. With namespaceId,
            omit origins or select local alone. License and category filters apply across selected origins. Local releases shadow
            matching indexed identities only when local participates. Live-only search can continue a verified bounded live window
            and reports zero durableTotal.
          items:
            type: string
            enum:
              - local
              - indexed
              - live
        namespaceId:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: Local Listing namespace UUID; restricts to local releases. Unknown or other-tenant UUIDs return no matches.
            Not an AIR or JSON-LD namespace.
        text:
          type: string
          maxLength: 500
          pattern: ^[^\x00]*$
          description: Search text excludes NUL and is limited to 500 UTF-8 bytes.
        kinds:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceKind'
        tags:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 80
            pattern: ^[^\x00]*$
        license:
          type: string
          maxLength: 256
          pattern: ^$|^[^\x00]*[^\s\x00][^\x00]*$
          description: Empty means no license filter. Trimmed, case-sensitive exact match against the immutable local Listing
            license or bounded external metadata.license string. No SPDX interpretation or match for absent, malformed or oversized
            declarations. Applies across selected origins.
        categories:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 80
            pattern: ^[^\x00]*[^\s\x00][^\x00]*$
          description: All selected categories must match after trimming, lowercasing and deduplication. Local releases use Listing
            categories; external entries use bounded literal Dublin Core subjects. Missing, malformed or oversized declarations
            do not match. Live candidates are checked before admission; their bounded population can be incomplete. Applies across
            selected origins.
        publisher:
          type: string
          maxLength: 256
          pattern: ^[^\x00]*$
          description: Source-aware selector matched against the Catalog Publisher UUID for local releases and the normalized
            AIR publisher component for indexed or live entries. Excludes NUL and is limited to 256 UTF-8 bytes.
        visibility:
          $ref: '#/components/schemas/Visibility'
      description: Private criteria only. Saving and opening never execute a Search. Current disclosure, live and embedding consent
        apply to the later explicit Search.
