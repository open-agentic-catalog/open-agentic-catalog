[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "open-agentic-catalog"
version = "0.1.0"
description = "Explicit, bounded Python client for Open Agentic Catalog"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["httpx2>=2.13.1,<3", "pydantic>=2.11,<3", "python-dateutil>=2.9,<3", "typing-extensions>=4.15,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
