[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false
[security]
admin_user = catalog
admin_password = $__file{/run/secrets/grafana_password}
disable_gravatar = true
cookie_samesite = strict
[users]
allow_sign_up = false
allow_org_create = false
[auth.anonymous]
enabled = false
[plugins]
plugin_admin_enabled = false
preinstall_disabled = true
preinstall_auto_update = false
disable_plugins = elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin
[unified_alerting]
enabled = false
[news]
news_feed_enabled = false
[dashboards]
min_refresh_interval = 10s
[log]
mode = console
level = warn
[dataproxy]
timeout = 10
row_limit = 10000
[server]
enable_gzip = false
