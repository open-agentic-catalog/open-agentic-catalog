{{- range $role := list "api" "worker" }}
{{- $account := index $.Values.serviceAccounts $role }}
{{- if $account.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "open-agentic-catalog.serviceAccountName" (dict "root" $ "role" $role) | quote }}
  labels:
    {{- include "open-agentic-catalog.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role | quote }}
  {{- with $account.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{/* Lower-weight hooks remain available while the migration Job runs. Helm can clean successful prerequisites after the Job fails. */}}
{{- $migration := .Values.serviceAccounts.migration }}
{{- if $migration.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "open-agentic-catalog.serviceAccountName" (dict "root" . "role" "migration") | quote }}
  labels:
    {{- include "open-agentic-catalog.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with $migration.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
